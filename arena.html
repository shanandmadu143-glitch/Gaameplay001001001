<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ශ්‍රී ලංකීය දාම් - Top 3D Arena</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070e;--panel:rgba(14,20,38,.92);--gold:#ffd166;--neon-blue:#00f2fe;--neon-green:#2ecc71;--red:#ff4757;--dim:#a0aec0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: linear-gradient(rgba(10, 25, 15, 0.78), rgba(5, 15, 10, 0.9)), 
              url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
  color:#f8f9fa;
}

.arena {
  width: 100vw; height: 100dvh;
  padding: env(safe-area-inset-top, 12px) 14px env(safe-area-inset-bottom, 14px) 14px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative; overflow: hidden;
}

.arena-top-header {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; width: 100%; max-width: 520px;
  background: rgba(10, 25, 15, 0.85); padding: 9px 14px; border-radius: 20px; border: 1.5px solid rgba(46, 204, 113, 0.4); box-shadow: 0 6px 20px rgba(0,0,0,0.6); margin-top: 4px;
  backdrop-filter: blur(6px); z-index: 10;
}
.arena-player-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; position: relative; }
.arena-avatar-box { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #2ecc71; background: #0f2b1c; display: grid; place-items: center; font-size: 1.25rem; color: #2ecc71; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
.arena-player-card.active .arena-avatar-box { border-color: #ffd166; box-shadow: 0 0 20px rgba(255, 209, 102, 0.8); transform: scale(1.08); }
.arena-player-card b { font-size: 0.88rem; color: #fff; max-width: 105px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arena-player-card small { font-size: 0.7rem; color: #a0aec0; }

.arena-coins-center { display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(46, 204, 113, 0.12); padding: 6px 15px; border-radius: 16px; border: 1px solid rgba(46, 204, 113, 0.35); }
.arena-coins-center i { font-size: 1.2rem; color: #2ecc71; }
.arena-coins-center b { font-size: 0.98rem; color: #fff; }

.mid-voice-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(10, 25, 15, 0.72);
  padding: 5px 16px;
  border-radius: 26px;
  border: 1px solid rgba(46, 204, 113, 0.32);
  backdrop-filter: blur(5px);
  margin: 4px 0;
  z-index: 10;
}
.arena-voice-mic-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--red);
  background: rgba(255, 71, 87, 0.2); color: var(--red); font-size: 0.95rem;
  display: grid; place-items: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.arena-voice-mic-btn.active-rec {
  background: var(--red); color: #fff; border-color: var(--red);
  animation: pulseRec 1s infinite;
}
@keyframes pulseRec {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
  70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
}
.mid-voice-label {
  font-size: 0.76rem;
  color: #cbd5e1;
  font-weight: 600;
}

.thought-bubble {
  position: absolute; top: 74px; left: 50%; transform: translateX(-50%) scale(0);
  background: rgba(14, 20, 38, 0.95); border: 2px solid var(--neon-blue); color: #fff;
  padding: 6px 12px; border-radius: 14px; font-size: 0.78rem; white-space: nowrap; max-width: 160px;
  overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 20px rgba(0,242,254,0.5);
  z-index: 50; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
}
.thought-bubble.show { transform: translateX(-50%) scale(1); }
.thought-bubble:after {
  content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  border-width: 0 6px 6px 6px; border-style: solid; border-color: transparent transparent var(--neon-blue) transparent;
}

@keyframes rgbGlow {
  0% { border-color: #ff4757; box-shadow: 0 0 24px rgba(255, 71, 87, 0.65), inset 0 0 12px rgba(255, 71, 87, 0.35); }
  25% { border-color: #2ecc71; box-shadow: 0 0 24px rgba(46, 204, 113, 0.65), inset 0 0 12px rgba(46, 204, 113, 0.35); }
  50% { border-color: #00f2fe; box-shadow: 0 0 24px rgba(0, 242, 254, 0.65), inset 0 0 12px rgba(0, 242, 254, 0.35); }
  75% { border-color: #ffd166; box-shadow: 0 0 24px rgba(255, 209, 102, 0.65), inset 0 0 12px rgba(255, 209, 102, 0.35); }
  100% { border-color: #ff4757; box-shadow: 0 0 24px rgba(255, 71, 87, 0.65), inset 0 0 12px rgba(255, 71, 87, 0.35); }
}

.board-wrap { 
  width: min(92vw, 54vh, 430px); aspect-ratio: 1; position: relative; margin: auto; 
  background: linear-gradient(135deg, rgba(16, 40, 26, 0.92), rgba(7, 18, 12, 0.96)); padding: 8px; border-radius: 24px; 
  border: 3px solid #2ecc71; animation: rgbGlow 6s linear infinite;
  box-shadow: 0 16px 38px rgba(0,0,0,0.85);
  overflow: hidden;
}

#threeStage {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  touch-action: manipulation;
}
#threeStage canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

.board {
  display: none;
  width: 100%; height: 100%;
  grid-template-columns: repeat(8,1fr); grid-template-rows: repeat(8,1fr);
  border-radius: 12px; overflow: hidden; border: 2px solid #07140c;
}
.board-wrap.fallback-2d .board { display: grid; }
.board-wrap.fallback-2d #threeStage { display: none; }

.sq { display: grid; place-items: center; position: relative; cursor: pointer; touch-action: manipulation; }
.sq.light { background: #e8d7be; }
.sq.dark { background: #4a2e18; }
.sq.selected { background: #ffd166 !important; }
.sq.target:after { content:''; width:32%; height:32%; border-radius:50%; background:#2ecc71; }
.sq.capture:after { content:''; width:42%; height:42%; border-radius:50%; background:#ff4757; }
.sq.last-move-from { background: rgba(255, 165, 2, 0.35) !important; }
.sq.last-move-to { background: rgba(0, 242, 254, 0.35) !important; border: 2px dashed var(--neon-blue); }
.piece { width: 82%; height: 82%; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.7); display: grid; place-items: center; font-size: 1.15rem; position: relative; }
.king:after { content:'♛'; font-size: clamp(13px,3.2vw,19px); position: absolute; bottom: 2px; right: 2px; color: #ffd166; }

.arena-bottom-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 520px; padding: 4px 10px; margin-bottom: 2px; z-index: 10; }
#clockPanel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
#clockRing { --progress: 100; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; position: relative; background: conic-gradient(#2ecc71 calc(var(--progress)*1%), rgba(255,255,255,0.12) 0); }
#clockRing:before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: #0b1f13; border: 1px solid rgba(255,255,255,0.2); }
#turnClock { position: relative; z-index: 1; font-size: 1.1rem; font-weight: 800; color: #2ecc71; }
#clockCaption { font-size: 0.74rem; color: #2ecc71; font-weight: 700; }
#clockRing.urgent #turnClock { color: var(--red); }

.arena-circle-btn { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #2ecc71; background: linear-gradient(135deg, #2ecc71, #27ae60); color: #0b1f13; font-size: 1.2rem; display: grid; place-items: center; cursor: pointer; position: relative; }
.arena-circle-btn.close-btn { border-color: #ff6b81; background: linear-gradient(135deg, #ff4757, #c0392b); color: #fff; }
.chat-badge {
  position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff; font-size: 0.65rem;
  width: 18px; height: 18px; border-radius: 50%; display: none; place-items: center; font-weight: bold;
}

.chat-drawer { position: fixed; top: 0; right: -100%; width: min(85vw, 310px); height: 100dvh; background: rgba(10, 25, 15, 0.98); border-left: 2px solid #2ecc71; z-index: 95; display: flex; flex-direction: column; transition: right 0.3s ease; }
.chat-drawer.open { right: 0; }
.chat-header { padding: 14px; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(46, 204, 113, 0.2); display: flex; justify-content: space-between; align-items: center; color: #2ecc71; }
.chat-body { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-msg { background: rgba(255,255,255,0.06); padding: 7px 11px; border-radius: 10px; font-size: 0.85rem; max-width: 85%; word-break: break-word; user-select: text; }
.chat-msg.me { align-self: flex-end; background: rgba(46, 204, 113, 0.25); border: 1px solid rgba(46, 204, 113, 0.5); color: #fff; }
.chat-msg.them { align-self: flex-start; background: rgba(255,255,255,0.12); color: #fff; }
.chat-footer { padding: 10px; display: flex; gap: 6px; background: rgba(0,0,0,0.4); align-items: center; }
.chat-footer input { padding: 8px 10px; font-size: 0.85rem; border-radius: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(46, 204, 113, 0.4); color: #fff; width: 100%; outline: none; user-select: text; }
.quick-chats { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: rgba(0,0,0,0.25); }
.quick-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 0.72rem; padding: 5px 9px; border-radius: 12px; white-space: nowrap; cursor: pointer; }

.voice-msg-bubble {
  display: flex; align-items: center; gap: 8px; background: rgba(46, 204, 113, 0.15) !important;
  border: 1px solid rgba(46, 204, 113, 0.4); padding: 6px 10px; border-radius: 12px;
}
.voice-msg-bubble audio {
  height: 30px; width: 140px;
}

.modal{position:fixed;inset:0;background:rgba(3,5,12,0.85);backdrop-filter:blur(8px);display:none;place-items:center;z-index:100;padding:15px}
.modal.show{display:grid}
.modalbox{width:min(100%,420px);background:linear-gradient(145deg,#0a190f,#132e1e);border:2px solid #2ecc71;border-radius:24px;padding:20px;display:grid;gap:12px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,0.8)}
.modalbox h2,.modalbox h3{text-align:center;color:#2ecc71;font-weight:700}
.btn,.btn-gold{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2)}
.btn-gold{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#111;box-shadow:0 4px 15px rgba(46,204,113,0.4)}
.row{display:flex;gap:10px;align-items:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);opacity:0;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #2ecc71;color:#f8f9fa;border-radius:30px;padding:10px 20px;z-index:150;transition:.3s;font-weight:600;display:flex;align-items:center;gap:8px;font-size:0.9rem}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>

  </div>

   <button class="btn-gold" id="sendChatBtn" style="padding:6px 12px"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
 </div>
</section>

<audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>
<audio id="forestAmbient" src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db32c1b913.mp3?filename=forest-with-birds-and-wind-111456.mp3" preload="auto" loop style="display:none;"></audio>

<div class="modal" id="overModal">

 </div>
</div>

function getSelectedPieceIndex(){
 try{
  const raw = localStorage.getItem(KEY);
  if(raw){
   const parsed = JSON.parse(raw);
   if(parsed && parsed.pieceIndex !== undefined && parsed.pieceIndex !== null){
    const idx = Number(parsed.pieceIndex);
    if(Number.isFinite(idx) && idx >= 0 && idx < PIECE_DESIGNS.length) return idx;
   }
  }
 }catch(_){}
 const uIdx = Number(user && user.pieceIndex);
 return (Number.isFinite(uIdx) && uIdx >= 0 && uIdx < PIECE_DESIGNS.length) ? uIdx : 0;
}

function create3DPieceMesh(val, design, isSelected){
 const group = new THREE.Group();
 const isKing = Math.abs(val) === 2;

 // 1. Beveled base disc (3D depth + rim)
 const baseGeo = new THREE.CylinderGeometry(0.35, 0.41, 0.22, 36);
 const baseMat = new THREE.MeshStandardMaterial({
  color: design.hex,
  roughness: 0.24,
  metalness: 0.45
 });
 const baseMesh = new THREE.Mesh(baseGeo, baseMat);
 baseMesh.position.y = 0.14;
 baseMesh.castShadow = true;
 baseMesh.receiveShadow = true;
 group.add(baseMesh);

 // 2. Raised top cap disc
 const topCapGeo = new THREE.CylinderGeometry(0.31, 0.34, 0.06, 36);
 const topCapMat = new THREE.MeshStandardMaterial({
  color: design.hex,
  emissive: design.hex,
  emissiveIntensity: 0.14,
  roughness: 0.2,
  metalness: 0.55
 });
 const topCapMesh = new THREE.Mesh(topCapGeo, topCapMat);
 topCapMesh.position.y = 0.27;
 topCapMesh.castShadow = true;
 group.add(topCapMesh);

 // 3. Metallic outer accent ring
 const ringGeo = new THREE.TorusGeometry(0.28, 0.028, 14, 32);
 const ringMat = new THREE.MeshStandardMaterial({
  color: design.accentHex,
  emissive: design.accentHex,
  emissiveIntensity: 0.22,
  roughness: 0.25,
  metalness: 0.78
 });
 const ringMesh = new THREE.Mesh(ringGeo, ringMat);
 ringMesh.rotation.x = Math.PI / 2;
 ringMesh.position.y = 0.305;
 group.add(ringMesh);

 // 4. Design-specific 3D center emblem
 const emblemMat = new THREE.MeshStandardMaterial({
  color: design.accentHex,
  emissive: design.accentHex,
  emissiveIntensity: 0.25,
  roughness: 0.22,
  metalness: 0.8
 });

 if(design.emblem === 'star'){
  const starGeo = new THREE.OctahedronGeometry(0.13, 0);
  const starMesh = new THREE.Mesh(starGeo, emblemMat);
  starMesh.scale.set(1, 0.45, 1);
  starMesh.position.y = 0.33;
  group.add(starMesh);
 } else if(design.emblem === 'diamond'){
  const diaGeo = new THREE.BoxGeometry(0.16, 0.06, 0.16);
  const diaMesh = new THREE.Mesh(diaGeo, emblemMat);
  diaMesh.rotation.y = Math.PI / 4;
  diaMesh.position.y = 0.32;
  group.add(diaMesh);
 } else if(design.emblem === 'ring'){
  const innerRingGeo = new THREE.TorusGeometry(0.13, 0.025, 12, 24);
  const innerRingMesh = new THREE.Mesh(innerRingGeo, emblemMat);
  innerRingMesh.rotation.x = Math.PI / 2;
  innerRingMesh.position.y = 0.315;
  group.add(innerRingMesh);
 } else if(design.emblem === 'crown'){
  const cGeo = new THREE.ConeGeometry(0.13, 0.14, 6);
  const cMesh = new THREE.Mesh(cGeo, emblemMat);
  cMesh.position.y = 0.35;
  group.add(cMesh);
 } else {
  const knobGeo = new THREE.SphereGeometry(0.085, 20, 14);
  const knobMesh = new THREE.Mesh(knobGeo, emblemMat);
  knobMesh.scale.set(1, 0.45, 1);
  knobMesh.position.y = 0.315;
  group.add(knobMesh);
 }

 // 5. Extra gold 3D King crown if promoted to King (|val| === 2)
 if(isKing){
  const kingGoldMat = new THREE.MeshStandardMaterial({
   color: 0xffd166,
   emissive: 0x664400,
   emissiveIntensity: 0.35,
   roughness: 0.18,
   metalness: 0.9
  });
  const kingCrownGeo = new THREE.CylinderGeometry(0.17, 0.12, 0.16, 7);
  const kingCrownMesh = new THREE.Mesh(kingCrownGeo, kingGoldMat);
  kingCrownMesh.position.y = 0.41;
  kingCrownMesh.castShadow = true;
  group.add(kingCrownMesh);
 }

 group.userData.isSel = !!isSelected;
 return group;
}

function initThreeArena(){
 const stage = $('threeStage');
 const wrap = $('boardWrap');
 if(!stage || typeof THREE === 'undefined'){
  if(wrap) wrap.classList.add('fallback-2d');
  return;
 }

 try{
  const w = stage.clientWidth || 380;
  const h = stage.clientHeight || 380;

  scene3D = new THREE.Scene();
  camera3D = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
  camera3D.position.copy(TOP_3D_CAM_POS);
  camera3D.lookAt(0, 0, 0);

  renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer3D.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer3D.setSize(w, h);
  renderer3D.shadowMap.enabled = true;
  renderer3D.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer3D.toneMapping = THREE.ACESFilmicToneMapping;
  renderer3D.toneMappingExposure = 1.15;

  stage.innerHTML = '';
  stage.appendChild(renderer3D.domElement);

  const ambient = new THREE.AmbientLight(0xe6fff2, 0.78);
  scene3D.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xfff6dc, 1.2);
  dirLight.position.set(3.5, 13, 3.5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene3D.add(dirLight);

  const rimLight = new THREE.PointLight(0x00f2fe, 0.75, 18);
  rimLight.position.set(-4.5, 5, -4.5);
  scene3D.add(rimLight);

  const goldLight = new THREE.PointLight(0xffd166, 0.65, 18);
  goldLight.position.set(4.5, 5, 4.5);
  scene3D.add(goldLight);

  boardGroup3D = new THREE.Group();
  piecesGroup3D = new THREE.Group();
  markersGroup3D = new THREE.Group();
  scene3D.add(boardGroup3D, markersGroup3D, piecesGroup3D);

  const frameGeo = new THREE.BoxGeometry(8.7, 0.42, 8.7);
  const frameMat = new THREE.MeshStandardMaterial({
   color: 0x0b2416,
   roughness: 0.38,
   metalness: 0.38
  });
  const frameMesh = new THREE.Mesh(frameGeo, frameMat);
  frameMesh.position.y = -0.26;
  frameMesh.receiveShadow = true;
  boardGroup3D.add(frameMesh);

  const sqGeo = new THREE.BoxGeometry(0.98, 0.14, 0.98);
  const lightMat = new THREE.MeshStandardMaterial({ color: 0xe8d7be, roughness: 0.52, metalness: 0.06 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.58, metalness: 0.12 });

  squareMeshes3D = [];
  for(let r=0; r<8; r++){
   for(let c=0; c<8; c++){
    const isDark = (r + c) % 2 === 1;
    const mesh = new THREE.Mesh(sqGeo, isDark ? darkMat.clone() : lightMat.clone());
    mesh.position.set(c - 3.5, -0.02, r - 3.5);
    mesh.receiveShadow = true;
    mesh.userData = { r, c, baseColor: isDark ? 0x4a2e18 : 0xe8d7be };
    boardGroup3D.add(mesh);
    squareMeshes3D.push(mesh);
   }
  }

  raycaster3D = new THREE.Raycaster();
  stage.addEventListener('pointerdown', e => {
   pointerDownPos = { x: e.clientX, y: e.clientY };
  });
  stage.addEventListener('pointerup', e => {
   if(!pointerDownPos) return;
   const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
   pointerDownPos = null;
   if(dist > 14) return;
   handleThreeClick(e.clientX, e.clientY);
  });

  window.addEventListener('resize', resizeThreeArena);
  threeReady = true;
  syncThreeBoard();
  animateThreeLoop();
 }catch(err){
  console.warn('Three.js fallback to 2D:', err);
  if(wrap) wrap.classList.add('fallback-2d');
 }
}

function resizeThreeArena(){
 const stage = $('threeStage');
 if(!threeReady || !renderer3D || !camera3D || !stage) return;
 const w = stage.clientWidth || 380;
 const h = stage.clientHeight || 380;
 camera3D.aspect = w / h;
 camera3D.updateProjectionMatrix();
 renderer3D.setSize(w, h);
}

function handleThreeClick(clientX, clientY){
 if(!threeReady || !renderer3D || !camera3D) return;
 const rect = renderer3D.domElement.getBoundingClientRect();
 if(!rect.width || !rect.height) return;
 const ndc = new THREE.Vector2(
  ((clientX - rect.left) / rect.width) * 2 - 1,
  -((clientY - rect.top) / rect.height) * 2 + 1
 );
 raycaster3D.setFromCamera(ndc, camera3D);
 const targets = [...squareMeshes3D, ...piecesGroup3D.children];
 const hits = raycaster3D.intersectObjects(targets, true);
 if(!hits.length) return;

 for(const hit of hits){
  let obj = hit.object;
  while(obj){
   if(obj.userData && typeof obj.userData.r === 'number' && typeof obj.userData.c === 'number'){
    clickSquare(obj.userData.r, obj.userData.c);
    return;
   }
   obj = obj.parent;
  }
 }
}

function clearGroup3D(grp){
 if(!grp) return;
 while(grp.children.length > 0){
  grp.remove(grp.children[0]);
 }
}

function syncThreeBoard(){
 if(!threeReady || !board || !board.length) return;

 clearGroup3D(markersGroup3D);
 clearGroup3D(piecesGroup3D);
 animatedPieceMeshes = [];

 const myPieceIdx = getSelectedPieceIndex();
 user.pieceIndex = myPieceIdx;

 const flip = single ? (userSide === -1) : (role === 'guest');
 const toWorldX = c => (flip ? (7 - c) : c) - 3.5;
 const toWorldZ = r => (flip ? (7 - r) : r) - 3.5;

 for(const sqMesh of squareMeshes3D){
  const { r, c, baseColor } = sqMesh.userData;
  sqMesh.material.color.setHex(baseColor);
  sqMesh.material.emissive.setHex(0x000000);

  if(lastMove){
   if(lastMove.fromR === r && lastMove.fromC === c){
    sqMesh.material.emissive.setHex(0x553800);
   }
   if(lastMove.toR === r && lastMove.toC === c){
    sqMesh.material.emissive.setHex(0x004455);
   }
  }
  if(selected && selected.r === r && selected.c === c){
   sqMesh.material.color.setHex(0xffd166);
   sqMesh.material.emissive.setHex(0x554000);
  }
 }

 const markerGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.08, 24);
 for(const m of moves){
  const isCap = !!m.capture;
  const mat = new THREE.MeshStandardMaterial({
   color: isCap ? 0xff4757 : 0x2ecc71,
   emissive: isCap ? 0x550011 : 0x004418,
   roughness: 0.3
  });
  const marker = new THREE.Mesh(markerGeo, mat);
  marker.position.set(toWorldX(m.toC), 0.09, toWorldZ(m.toR));
  marker.userData = { r: m.toR, c: m.toC };
  markersGroup3D.add(marker);
 }

 for(let r=0; r<8; r++){
  for(let c=0; c<8; c++){
   const val = board[r][c];
   if(!val) continue;

   const isMyPiece = single ? (Math.sign(val) === userSide) : (role === 'host' ? Math.sign(val) === 1 : Math.sign(val) === -1);
   const pieceDesignIndex = isMyPiece
    ? myPieceIdx
    : (window.opponentPieceIndex !== undefined ? window.opponentPieceIndex : 2);
   const design = PIECE_DESIGNS[pieceDesignIndex] || PIECE_DESIGNS[0];

   const isSel = !!(selected && selected.r === r && selected.c === c);
   const pieceGroup = create3DPieceMesh(val, design, isSel);
   pieceGroup.position.set(toWorldX(c), isSel ? 0.16 : 0, toWorldZ(r));
   pieceGroup.userData = { r, c, isSel };

   piecesGroup3D.add(pieceGroup);
   animatedPieceMeshes.push(pieceGroup);
  }
 }
}

function animateThreeLoop(){
 if(!threeReady) return;
 requestAnimationFrame(animateThreeLoop);

 const t = performance.now() * 0.003;
 camera3D.position.copy(TOP_3D_CAM_POS);
 camera3D.lookAt(0, 0, 0);

 for(const grp of animatedPieceMeshes){
  if(grp.userData && grp.userData.isSel){
   grp.position.y = 0.18 + Math.sin(t * 2.4) * 0.05;
  }
 }

 renderer3D.render(scene3D, camera3D);
}

/* Self-Upgrading Planned Tactical AI Engine */
function loadAiMasterState(){
 const def={
  level:1,
  turnsPlanned:0,
  aiWins:0,
  playerWins:0,
  searchDepth:4,
  aggression:0.95,
  trapAvoidance:1.05,
  kingPriority:1.45,
  centerControl:0.75
 };
 try{
  const raw=localStorage.getItem(AI_UPGRADE_KEY);
  if(!raw)return def;
  const p=JSON.parse(raw);
  return {
   ...def,
   ...p,
   level:Math.max(1,Number(p.level)||1),
   turnsPlanned:Math.max(0,Number(p.turnsPlanned)||0),
   aiWins:Math.max(0,Number(p.aiWins)||0),
   playerWins:Math.max(0,Number(p.playerWins)||0),
   searchDepth:Math.min(6,Math.max(4,Number(p.searchDepth)||4)),
   aggression:Math.min(1.6,Math.max(0.9,Number(p.aggression)||0.95)),
   trapAvoidance:Math.min(1.75,Math.max(1.0,Number(p.trapAvoidance)||1.05)),
   kingPriority:Math.min(2.3,Math.max(1.3,Number(p.kingPriority)||1.45)),
   centerControl:Math.min(1.5,Math.max(0.6,Number(p.centerControl)||0.75))
  };
 }catch(_){
  return def;
 }
}

function saveAiMasterState(st){
 try{localStorage.setItem(AI_UPGRADE_KEY,JSON.stringify(st));}catch(_){}
}

let aiMasterState=loadAiMasterState();

function updateAiSubLabel(){
 const subEl=$('p2sub');
 if(subEl && single){
  subEl.textContent=`AI Lv.${aiMasterState.level} (D${aiMasterState.searchDepth})`;
 }
}

function upgradeAiOnTurn(){
 aiMasterState.turnsPlanned += 1;
 if(aiMasterState.turnsPlanned % 4 === 0){
  aiMasterState.level += 1;
  aiMasterState.searchDepth = Math.min(6, 4 + Math.floor((aiMasterState.level - 1) / 3));
  aiMasterState.aggression = Math.min(1.6, Number((aiMasterState.aggression + 0.03).toFixed(2)));
  aiMasterState.trapAvoidance = Math.min(1.75, Number((aiMasterState.trapAvoidance + 0.03).toFixed(2)));
  aiMasterState.kingPriority = Math.min(2.3, Number((aiMasterState.kingPriority + 0.04).toFixed(2)));
  aiMasterState.centerControl = Math.min(1.5, Number((aiMasterState.centerControl + 0.03).toFixed(2)));
 }
 saveAiMasterState(aiMasterState);
 updateAiSubLabel();
}

function upgradeAiOnMatchEnd(aiWon){
 if(aiWon){
  aiMasterState.aiWins += 1;
  aiMasterState.level += 1;
 }else{
  aiMasterState.playerWins += 1;
  aiMasterState.level += 2;
 }
 aiMasterState.searchDepth = Math.min(6, 4 + Math.floor((aiMasterState.level - 1) / 2));
 aiMasterState.aggression = Math.min(1.6, Number((aiMasterState.aggression + 0.06).toFixed(2)));
 aiMasterState.trapAvoidance = Math.min(1.75, Number((aiMasterState.trapAvoidance + 0.06).toFixed(2)));
 aiMasterState.kingPriority = Math.min(2.3, Number((aiMasterState.kingPriority + 0.08).toFixed(2)));
 aiMasterState.centerControl = Math.min(1.5, Number((aiMasterState.centerControl + 0.05).toFixed(2)));
 saveAiMasterState(aiMasterState);
 updateAiSubLabel();
}

function cloneBoard8(b){
 return b.map(row=>row.slice());
}

function simulateBoardMove(b, m){
 const next=cloneBoard8(b);
 const p=next[m.fromR][m.fromC];
 next[m.fromR][m.fromC]=0;
 next[m.toR][m.toC]=p;
 if(m.capture && inside(m.capR, m.capC)){
  next[m.capR][m.capC]=0;
 }
 if(p===1 && m.toR===0) next[m.toR][m.toC]=2;
 if(p===-1 && m.toR===7) next[m.toR][m.toC]=-2;
 return next;
}

function evaluateBoardForSide(b, aiSide, cfg){
 const humanSide=-aiSide;
 let score=0;

 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const val=b[r][c];
   if(!val)continue;
   const side=Math.sign(val);
   const isKing=Math.abs(val)===2;
   const pieceBase=isKing ? (100 * cfg.kingPriority) : 100;

   const adv=(side === -1) ? (r / 7) : ((7 - r) / 7);
   const advanceBonus=isKing ? 22 : (adv * 34 * cfg.aggression);

   const centerDist=Math.abs(3.5 - c) + Math.abs(3.5 - r);
   const centerBonus=Math.max(0, 7 - centerDist) * 5.5 * cfg.centerControl;

   const edgeBonus=(c===0 || c===7) ? 12 : 0;

   const totalPiece=pieceBase + advanceBonus + centerBonus + edgeBonus;
   score += (side === aiSide) ? totalPiece : -(totalPiece * 1.12);
  }
 }

 const aiMovesCount=allMoves(aiSide, b).length;
 const humanMovesCount=allMoves(humanSide, b).length;
 score += (aiMovesCount - humanMovesCount) * 8;
 return score;
}

function scoreMovePlan(m, b, aiSide, cfg){
 let s=0;
 if(m.capture){
  s += 280 * cfg.aggression;
  const afterCapBoard=simulateBoardMove(b, m);
  const chainCaps=pieceMoves(m.toR, m.toC, afterCapBoard).filter(x=>x.capture);
  if(chainCaps.length) s += 190 * cfg.aggression;
 }
 const p=b[m.fromR][m.fromC];
 if((p===1 && m.toR===0) || (p===-1 && m.toR===7)){
  s += 210 * cfg.kingPriority;
 }
 const forwardGain=(aiSide === -1) ? (m.toR - m.fromR) : (m.fromR - m.toR);
 s += forwardGain * 24 * cfg.aggression;
 const centerProximity=4 - Math.abs(3.5 - m.toC);
 s += centerProximity * 7 * cfg.centerControl;
 return s;
}

function alphaBetaPlan(b, depth, alpha, beta, maximizingAi, aiSide, cfg){
 const currentSide=maximizingAi ? aiSide : -aiSide;
 const movesList=allMoves(currentSide, b);

 if(depth <= 0 || !movesList.length){
  if(!movesList.length){
   return maximizingAi ? -5000 : 5000;
  }
  return evaluateBoardForSide(b, aiSide, cfg);
 }

 if(maximizingAi){
  let value=-Infinity;
  for(const m of movesList){
   const child=simulateBoardMove(b, m);
   value=Math.max(value, alphaBetaPlan(child, depth - 1, alpha, beta, false, aiSide, cfg));
   alpha=Math.max(alpha, value);
   if(alpha >= beta) break;
  }
  return value;
 }else{
  let value=Infinity;
  for(const m of movesList){
   const child=simulateBoardMove(b, m);
   value=Math.min(value, alphaBetaPlan(child, depth - 1, alpha, beta, true, aiSide, cfg));
   beta=Math.min(beta, value);
   if(alpha >= beta) break;
  }
  return value;
 }
}

function choosePlannedAiMove(legalMoves, aiSide){
 const cfg=loadAiMasterState();
 if(!legalMoves.length)return null;
 if(legalMoves.length===1)return legalMoves[0];

 const depth=Math.min(4, Math.max(2, cfg.searchDepth - 2));
 const humanSide=-aiSide;
 let bestMove=legalMoves[0];
 let bestScore=-Infinity;

 for(const m of legalMoves){
  const planScore=scoreMovePlan(m, board, aiSide, cfg);
  const afterBoard=simulateBoardMove(board, m);
  const futureVal=alphaBetaPlan(afterBoard, depth, -Infinity, Infinity, false, aiSide, cfg);

  const humanNextMoves=allMoves(humanSide, afterBoard);
  let humanCaptureThreat=0;
  for(const hm of humanNextMoves){
   if(hm.capture){
    humanCaptureThreat += 260 * cfg.trapAvoidance;
   }
  }

  const total=planScore + (futureVal * 0.7) - humanCaptureThreat;
  if(total > bestScore){
   bestScore=total;
   bestMove=m;
  }
 }

 return bestMove;
}

function createFreshBoard() {
 const b = Array.from({length:8},()=>Array(8).fill(0));
 for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){if(r<3)b[r][c]=-1;else if(r>4)b[r][c]=1}
 return b;
}

function normalizeFirebaseBoard(rawBoard) {
 if (!Array.isArray(rawBoard) || rawBoard.length !== 8) return createFreshBoard();
 return Array.from({length:8}, (_, r) =>
  Array.from({length:8}, (__, c) => {
   const val = rawBoard[r] && rawBoard[r][c];
   return typeof val === 'number' ? val : 0;
  })
 );
}

 }, 800);

const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;

function pieceMoves(r,c,b=board){
 const p=b[r][c];if(!p)return[];
 const isKing=Math.abs(p)===2,dirs=[[1,1],[1,-1],[-1,1],[-1,-1]];
 const caps=[],normal=[];
 if(isKing){
  for(const[dr,dc]of dirs){
   let step=1;while(true){const tr=r+dr*step,tc=c+dc*step;if(!inside(tr,tc)||b[tr][tc]!==0)break;normal.push({fromR:r,fromC:c,toR:tr,toC:tc,capture:false});step++;}
  }
  for(const[dr,dc]of dirs){
   let step=1,enemyR=-1,enemyC=-1;
   while(true){
    const tr=r+dr*step,tc=c+dc*step;if(!inside(tr,tc))break;
    const val=b[tr][tc];
    if(val!==0){if(Math.sign(val)===Math.sign(p))break;else{if(enemyR!==-1)break;enemyR=tr;enemyC=tc;}}
    else if(enemyR!==-1)caps.push({fromR:r,fromC:c,toR:tr,toC:tc,capR:enemyR,capC:enemyC,capture:true});
    step++;
   }
  }
 }else{
  const moveDirs=(p>0?[[-1,1],[-1,-1]]:[[1,1],[1,-1]]);
  for(const[dr,dc]of dirs){
   const mr=r+dr,mc=c+dc,tr=r+2*dr,tc=c+2*dc;
   if(inside(mr,mc)&&inside(tr,tc)&&b[mr][mc]&&Math.sign(b[mr][mc])!==Math.sign(p)&&!b[tr][tc])
    caps.push({fromR:r,fromC:c,toR:tr,toC:tc,capR:mr,capC:mc,capture:true});
  }
  for(const[dr,dc]of moveDirs){const tr=r+dr,tc=c+dc;if(inside(tr,tc)&&!b[tr][tc])normal.push({fromR:r,fromC:c,toR:tr,toC:tc,capture:false});}
 }
 return caps.length?caps:normal;
}

function allMoves(side,b=board){
 let caps=[],normal=[];
 for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]&&Math.sign(b[r][c])===side){
  for(const m of pieceMoves(r,c,b))(m.capture?caps:normal).push(m);
 }
 return caps.length?caps:normal;
}

  }
 }

function clickSquare(r,c){

 if(selected){
  const target=moves.find(x=>x.toR===r&&x.toC===c);
  if(target){playMove(target);return}
 }
 const p=board[r][c];
 if(p&&Math.sign(p)===turn){
  if(forcedContinuation&&(r!==forcedContinuation.r||c!==forcedContinuation.c))return;
  const pieceLegal=allMoves(turn).filter(m=>m.fromR===r&&m.fromC===c);
  if(!pieceLegal.length)return toast('අනිවාර්ය Capture එකක් තිබේ නම් එය කළ යුතුයි.');
  selected={r,c};moves=pieceLegal;render();
 }
}

function applyMove(b,m){
 const p=b[m.fromR][m.fromC];b[m.fromR][m.fromC]=0;b[m.toR][m.toC]=p;
 if(m.capture)b[m.capR][m.capC]=0;
 if(p===1&&m.toR===0)b[m.toR][m.toC]=2;
 if(p===-1&&m.toR===7)b[m.toR][m.toC]=-2;
 return p;
}

async function playMove(m){
 if(processing||gameOver)return;
 processing=true;
 lastMove = { fromR: m.fromR, fromC: m.fromC, toR: m.toR, toC: m.toC };

 const moving=board[m.fromR][m.fromC];
 applyMove(board,m);selected=null;moves=[];
 const landed=board[m.toR][m.toC];
 const followUps=m.capture&&Math.abs(landed)===Math.abs(moving)?pieceMoves(m.toR,m.toC).filter(x=>x.capture):[];

 if(followUps.length){
  forcedContinuation={r:m.toR,c:m.toC};turn=Math.sign(landed);render();processing=false;setTurnUI();
  if(!single && roomRef) syncMultiplayerState();
  if(single&&turn!==userSide)aiTimer=setTimeout(aiMove,400);
  return;
 }

 forcedContinuation=null;turn=-Math.sign(moving);render();processing=false;
 if(!allMoves(turn).length){
  if(!single && roomRef) syncMultiplayerState();
  finish(Math.sign(moving),'ප්‍රතිවාදියාට නීත්‍යානුකූල Move නොමැත.');
  return;
 }
 setTurnUI();
 if(!single && roomRef) syncMultiplayerState();
 if(single&&turn!==userSide)aiTimer=setTimeout(aiMove,420);
}

function startTurnClock(deadline){
 clearInterval(turnClockTimer);turnDeadline=deadline||Date.now()+15000;
 const ring=$('clockRing'),number=$('turnClock');
 const tick=()=>{
  const remaining=Math.max(0,turnDeadline-Date.now()),left=Math.ceil(remaining/1000);
  number.textContent=String(left);
  ring.style.setProperty('--progress',Math.max(0,Math.min(100,remaining/15000*100)));
  ring.classList.toggle('urgent',left<=3);
  if(remaining<=0){
   clearInterval(turnClockTimer);
   if(single&&turn===userSide){
    turn=-userSide;selected=null;moves=[];render();setTurnUI();aiTimer=setTimeout(aiMove,320);
   } else if(!single&&turn===userSide&&!gameOver){
    finish(-userSide,'ඔබගේ වාරයේ කාලය අවසන් විය.');
   }
  }
 };
 tick();turnClockTimer=setInterval(tick,100);
}

function aiMove(){
 const aiSide=-userSide;if(gameOver||turn!==aiSide)return;
 let legal=allMoves(aiSide);
 if(!legal.length)return finish(userSide,'AI පරිගණකයට Move නොමැත.');
 if(forcedContinuation)legal=pieceMoves(forcedContinuation.r,forcedContinuation.c).filter(m=>m.capture);
 if(!legal.length){forcedContinuation=null;legal=allMoves(aiSide);}

 upgradeAiOnTurn();
 const m=choosePlannedAiMove(legal, aiSide) || legal[0];
 lastMove = { fromR: m.fromR, fromC: m.fromC, toR: m.toR, toC: m.toC };

 const moving=board[m.fromR][m.fromC];
 applyMove(board,m);
 const landed=board[m.toR][m.toC];
 const followUps=m.capture&&Math.abs(landed)===Math.abs(moving)?pieceMoves(m.toR,m.toC).filter(x=>x.capture):[];
 if(followUps.length){forcedContinuation={r:m.toR,c:m.toC};turn=aiSide;render();setTurnUI();aiTimer=setTimeout(aiMove,380);return;}
 forcedContinuation=null;render();turn=userSide;
 if(!allMoves(userSide).length)finish(aiSide,'ඔබට නීත්‍යානුකූල Move නොමැත.');else setTurnUI();
}

  if(won){
   user.points+=bet;user.wins++;$('overPoints').textContent='+'+bet+' Points (Win!)';
  } else {
   user.points=Math.max(0,user.points-bet);user.losses++;$('overPoints').textContent='-'+bet+' Points';
  }
  localStorage.setItem(KEY,JSON.stringify(user));
  const statPatch = {points:user.points,wins:user.wins,losses:user.losses};
  db.ref('users_v6/'+fbUser.uid).update(statPatch).catch(()=>{});
  db.ref('publicProfiles_v6/'+fbUser.uid).update(statPatch).catch(()=>{});
 }

 if(won){

}

}

$('closeChat').onclick = () => $('chatDrawer').classList.remove('open');

function handleSendChat() {
 const input = $('chatInput');
 const v = input.value.trim();
 if(v) {
  sendQuickChat(v);
  input.value = '';
 }
}

$('sendChatBtn').onclick = handleSendChat;
$('chatInput').addEventListener('keydown', (e) => {
 if (e.key === 'Enter') {
  e.preventDefault();
  handleSendChat();
 }
});

function setupMultiplayerGame(id, assignedRole, opponentName, bet) {
 role = assignedRole === 'guest' ? 'guest' : 'host';
 roomId = id;
 userSide = role === 'host' ? 1 : -1;
 board = createFreshBoard();
 turn = 1;
 selected = null;
 moves = [];
 gameOver = false;
 processing = false;
 forcedContinuation = null;
 lastMove = null;

 if(!db || !roomId) {
  render();
  setTurnUI();
  return;
 }

 roomRef = db.ref('rooms_v6/' + roomId);

 roomRef.once('value').then(snap => {
  const data = snap.val();
  if(data) {
   if(data.bet) {
    window.currentBetPoints = Number(data.bet) || bet;
    $('arenaBetDisplay').textContent = window.currentBetPoints;
   }
   if(Array.isArray(data.board)) {
    board = normalizeFirebaseBoard(data.board);
   }
   if(data.turn !== undefined) {
    turn = Number(data.turn) === -1 ? -1 : 1;
   }

   if(role === 'host') {
    window.opponentPieceIndex = data.guestPieceIndex !== undefined ? data.guestPieceIndex : 2;
    $('p1name').textContent = user.name || data.hostName || 'Host'; $('p1sub').textContent = 'Host';
    $('p2name').textContent = opponentName || data.guestName || 'Guest'; $('p2sub').textContent = 'Guest';
    applyAvatarToBox('p1AvatarBox', user.pieceIndex||0, user.avatarIcon||'fa-user');
    applyAvatarToBox('p2AvatarBox', data.guestPieceIndex||0, data.guestAvatar||'fa-chess-knight');
    if(!Array.isArray(data.board)) {
     roomRef.update({
      board: board,
      turn: 1,
      status: 'active',
      matchStarted: true,
      hostName: user.name || data.hostName || 'Host',
      hostPieceIndex: user.pieceIndex || 0
     }).catch(()=>{});
    }
   } else {
    window.opponentPieceIndex = data.hostPieceIndex !== undefined ? data.hostPieceIndex : 0;
    $('p1name').textContent = opponentName || data.hostName || 'Host'; $('p1sub').textContent = 'Host';
    $('p2name').textContent = user.name || data.guestName || 'Guest'; $('p2sub').textContent = 'Guest';
    applyAvatarToBox('p1AvatarBox', data.hostPieceIndex||0, data.hostAvatar||'fa-user');
    applyAvatarToBox('p2AvatarBox', user.pieceIndex||0, user.avatarIcon||'fa-user');
    const guestPatch = {
     status: 'active',
     matchStarted: true,
     guestName: user.name || data.guestName || 'Guest',
     guestPieceIndex: user.pieceIndex || 0,
     guestJoinedAt: Date.now()
    };
    if(!Array.isArray(data.board)) {
     guestPatch.board = board;
     guestPatch.turn = 1;
    }
    roomRef.update(guestPatch).catch(()=>{});
   }
   render();
   setTurnUI();
  }
 });

 if(roomValueHandler) { try { roomRef.off('value', roomValueHandler); } catch(e){} }
 roomValueHandler = snap => {
  const data = snap.val();
  if(!data) return;

  if(role === 'host') {
   if(data.guestName) $('p2name').textContent = data.guestName;
   if(data.guestPieceIndex !== undefined) window.opponentPieceIndex = data.guestPieceIndex;
  } else {
   if(data.hostName) $('p1name').textContent = data.hostName;
   if(data.hostPieceIndex !== undefined) window.opponentPieceIndex = data.hostPieceIndex;
  }

  if(data.status === 'finished') {
   if(!gameOver) finish(Number(data.winner), 'තරඟය අවසන් විය.');
   return;
  }

  if(data.updatedBy && data.updatedBy === mySessionId) return;

  const prevTurn = turn;
  if(Array.isArray(data.board)) {
   board = normalizeFirebaseBoard(data.board);
  }
  if(data.turn !== undefined) {
   turn = Number(data.turn) === -1 ? -1 : 1;
  }
  forcedContinuation = data.forcedContinuation || null;
  if(data.lastMove) lastMove = data.lastMove;

  render();
  if(prevTurn !== turn || !turnClockTimer) {
   setTurnUI();
  }
 };
 roomRef.on('value', roomValueHandler);

 if(chatAddedHandler) { try { roomRef.child('chats').off('child_added', chatAddedHandler); } catch(e){} }
 chatAddedHandler = snap => {
  const c = snap.val();
  if(c && c.senderId !== mySessionId) {
   if(c.type === 'voice' && c.audioData) {
    appendVoiceMessage(c.audioData, false);
   } else if(c.message) {
    appendChatMessage(`${c.sender}: ${c.message}`, false);
   }
   showOpponentThought(c.message || '[Voice Message]');
   if(!$('chatDrawer').classList.contains('open')) {
    $('chatBadge').style.display = 'grid';
   }
  }
 };
 roomRef.child('chats').on('child_added', chatAddedHandler);
 render();
 setTurnUI();
 startForestAmbient();
}

function syncMultiplayerState() {
 if(roomRef) {
  roomRef.update({
   board: board,
   turn: turn,
   forcedContinuation: forcedContinuation || null,
   lastMove: lastMove || null,
   updatedBy: mySessionId,
   updatedAt: firebase.database.ServerValue.TIMESTAMP
  }).catch(()=>{});
 }
}

function leaveArena(){
 clearInterval(turnClockTimer);clearTimeout(aiTimer);
 const forestAudio = $('forestAmbient');
 if(forestAudio) forestAudio.pause();
 if(roomRef){
  if(!gameOver && gameMode==='multi') {
   roomRef.update({status:'finished',winner:-userSide,updatedBy:mySessionId}).catch(()=>{});
   roomRef.child('chats').remove().catch(()=>{});
  }
  if(roomValueHandler) roomRef.off('value', roomValueHandler);
  if(chatAddedHandler) roomRef.child('chats').off('child_added', chatAddedHandler);
 }
 sessionStorage.removeItem('sinhala_draughts_multi_room');
 window.location.href = 'index.html';
}

$('arenaMenuBtn').onclick = leaveArena;
$('exit').onclick = leaveArena;
$('rematch').onclick = () => {
 modal('overModal',false);
 if(gameMode==='multi') { leaveArena(); return; }
 nextStartingSide = -nextStartingSide;
 initBoard();
};

initThreeArena();
initGameFromURL();
</script>
