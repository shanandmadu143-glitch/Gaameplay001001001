<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shop & Reward - ශ්‍රී ලංකා දාම්</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b18;--panel:rgba(18,24,43,.96);--gold:#ffd166;--dim:#a0aec0;--green:#2ecc71;--red:#ff6b81}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none}
html,body{width:100%;min-height:100%;background:radial-gradient(circle at 18% 18%,#3b2e2530,transparent 35%),linear-gradient(145deg,#080b18,#111a31 55%,#0a1022);color:#f8f9fa;padding:15px}
.app{max-width:900px;margin:auto;display:grid;gap:20px}
header{background:var(--panel);border:1px solid #ffd16640;border-radius:15px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:1.25rem;color:var(--gold);font-weight:800}
.points-box{background:rgba(0,0,0,0.4);border:1px solid var(--gold);padding:6px 14px;border-radius:20px;font-weight:700;color:var(--gold)}
.shop-container{background:var(--panel);border:1px solid #ffd16640;border-radius:15px;padding:20px;display:grid;gap:20px}
h2,h3{color:var(--gold);text-align:center}

/* Free Reward Section Style */
.reward-banner{background:linear-gradient(135deg,rgba(255,209,102,0.1),rgba(46,204,113,0.1));border:2px solid var(--gold);border-radius:16px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.reward-info{display:flex;align-items:center;gap:15px}
.reward-icon{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#ffeaa7,#fdcb6e);color:#111;display:grid;place-items:center;font-size:1.8rem;box-shadow:0 0 15px rgba(255,209,102,0.4)}
.timer-text{font-size:1.1rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.item-card{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transition:.2s}
.item-card:hover{border-color:var(--gold);background:rgba(255,255,255,0.07)}
.preview-circle{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ffeaa7,#fdcb6e);display:grid;place-items:center;font-size:1.8rem;color:#111}

/* Visual Effect Animations */
.fx-glow{box-shadow:0 0 20px #ffd166, 0 0 40px #ffad62!important}
.fx-fire{box-shadow:0 0 20px #ff4757, 0 0 35px #ffa502!important;animation:pulseFire 1s infinite alternate}
.fx-rainbow{box-shadow:0 0 25px #ff6b81, 0 0 35px #7ee7ff!important;animation:spinRainbow 3s linear infinite}
.fx-lightning{box-shadow:0 0 22px #4facfe, 0 0 40px #00f2fe!important;animation:pulseLight .8s infinite alternate}
.fx-matrix{box-shadow:0 0 22px #2ed573, 0 0 35px #26de81!important}

@keyframes pulseFire{0%{filter:brightness(1)}100%{filter:brightness(1.4)}}
@keyframes pulseLight{0%{opacity:0.7}100%{opacity:1}}

.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer;transition:.2s}
.btn-gold:hover{filter:brightness(1.1)}
.btn-gold:disabled{opacity:0.5;cursor:not-allowed}
.btn-back{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2);border-radius:9px;padding:8px 14px;cursor:pointer;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-back:hover{background:rgba(255,255,255,0.2)}

#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,100px);opacity:0;background:#1e293b;border:1px solid var(--gold);color:white;border-radius:25px;padding:10px 20px;z-index:100;transition:.3s;font-weight:600}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><i class="fa-solid fa-store"></i> Shop & Reward</div>
<div class="points-box">🪙 <span id="userPoints">500</span> pts</div>
<a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> ප්‍රධාන පිටුවට</a>
</header>

<div class="shop-container">
<!-- Free Reward Banner & Timer -->
<h2>නොමිලේ ත්‍යාග (Free Rewards)</h2>
<div class="reward-banner">
<div class="reward-info">
<div class="reward-icon"><i class="fa-solid fa-gift"></i></div>
<div>
<h3 style="text-align:left">පැය 6කට වරක් Free Points</h3>
<p style="color:var(--dim);font-size:0.9rem">නොමිලේ ලකුණු 200ක් ලබා ගන්න!</p>
<div id="timerDisplay" class="timer-text" style="margin-top:5px">ඉල්ලීමට සූදානම්!</div>
</div>
</div>
<button class="btn-gold" id="claimRewardBtn" onclick="claimFreeReward()">ත්‍යාගය ලබාගන්න (Claim 200 pts)</button>
</div>

<hr style="border-color:rgba(255,255,255,0.1);margin:10px 0">

<h2>දාම් ඉත්තන් සඳහා විශේෂ Effects (250 pts බැගින්)</h2>
<div class="grid" id="shopGrid"></div>
</div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",authDomain:"bin-card-42614.firebaseapp.com",databaseURL:"https://bin-card-42614-default-rtdb.firebaseio.com",projectId:"bin-card-42614",storageBucket:"bin-card-42614.firebasestorage.app",messagingSenderId:"1063550230753",appId:"1:1063550230753:web:1ad8306405e709ac5b17a0"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const KEY = 'sinhala_draughts_v7_user';
let user = JSON.parse(localStorage.getItem(KEY) || '{"points":500, "unlockedEffects":[], "lastRewardTime":0}');
if(!user.unlockedEffects) user.unlockedEffects = [];

const EFFECTS = [
 {id: 'glow', name: 'රන් කැටයම් (Golden Glow)', desc: 'ඉත්තා වටා දිලිසෙන රන්වන් ආලෝකයකි.', class: 'fx-glow', icon: '★'},
 {id: 'fire', name: 'ගිනි දැල් (Fire Aura)', desc: 'උණුසුම් ගිනි පුපුරු විහිදුවන ආචරණයකි.', class: 'fx-fire', icon: '🔥'},
 {id: 'rainbow', name: 'දේදුනු විදුලිය (Rainbow Flow)', desc: 'වර්ණ මාලාවකින් දිස්වන ආකර්ෂණීය පෙනුමකි.', class: 'fx-rainbow', icon: '⚡'},
 {id: 'lightning', name: 'විදුලි කුණාටුව (Lightning Shield)', desc: 'නිල් පැහැති විදුලි රැස් විහිදුවයි.', class: 'fx-lightning', icon: '🛡'},
 {id: 'matrix', name: 'මරකත මැජික් (Matrix Green)', desc: 'ශක්තිමත් කොළ පැහැති මැජික් ආලෝකයකි.', class: 'fx-matrix', icon: '❖'}
];

function toast(msg){
 const t = document.getElementById('toast');
 t.textContent = msg;
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'), 2500);
}

function updatePointsUI(){
 document.getElementById('userPoints').textContent = user.points !== undefined ? user.points : 500;
}

function syncUserWithDB(){
 localStorage.setItem(KEY, JSON.stringify(user));
 const currentUser = auth.currentUser;
 if(currentUser){
  db.ref('users_v6/' + currentUser.uid).update({
   points: user.points,
   unlockedEffects: user.unlockedEffects || [],
   selectedEffect: user.selectedEffect || '',
   lastRewardTime: user.lastRewardTime || 0
  }).catch(console.error);
 }
 updatePointsUI();
}

auth.onAuthStateChanged(async u => {
 if(u){
  try{
   const snap = await db.ref('users_v6/' + u.uid).once('value');
   const d = snap.val();
   if(d){
    user.points = d.points !== undefined ? Number(d.points) : user.points;
    user.unlockedEffects = Array.isArray(d.unlockedEffects) ? d.unlockedEffects : (user.unlockedEffects || []);
    user.selectedEffect = d.selectedEffect || user.selectedEffect || '';
    user.lastRewardTime = d.lastRewardTime !== undefined ? Number(d.lastRewardTime) : (user.lastRewardTime || 0);
    user.uid = u.uid;
    localStorage.setItem(KEY, JSON.stringify(user));
   }
  }catch(e){}
 }
 updatePointsUI();
 renderShop();
 startRewardTimer();
});

// Free Reward Countdown Logic (6 Hours = 21600000 ms)
const COOLDOWN_TIME = 6 * 60 * 60 * 1000; 

function startRewardTimer(){
 const btn = document.getElementById('claimRewardBtn');
 const timerText = document.getElementById('timerDisplay');

 setInterval(() => {
  const now = Date.now();
  const lastTime = user.lastRewardTime || 0;
  const elapsed = now - lastTime;

  if(elapsed < COOLDOWN_TIME){
   const remaining = COOLDOWN_TIME - elapsed;
   const hours = Math.floor(remaining / (1000 * 60 * 60));
   const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
   const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

   timerText.textContent = `නැවත ලබාගීමට ඉතිරි කාලය: ${hours}h ${minutes}m ${seconds}s`;
   btn.disabled = true;
   btn.style.opacity = '0.5';
  } else {
   timerText.textContent = 'ත්‍යාගය ලබා ගැනීමට සූදානම්!';
   btn.disabled = false;
   btn.style.opacity = '1';
  }
 }, 1000);
}

function claimFreeReward(){
 const now = Date.now();
 const lastTime = user.lastRewardTime || 0;
 
 if((now - lastTime) < COOLDOWN_TIME){
  return toast('කරුණාකර නියමිත කාලය අවසන් වන තෙක් රැඳී සිටින්න!');
 }

 user.points += 200;
 user.lastRewardTime = now;
 syncUserWithDB();
 toast('සුභ පැතුම්! ඔබට Free Points 200ක් ලැබුණි! 🎉');
}

function renderShop(){
 const grid = document.getElementById('shopGrid');
 grid.innerHTML = '';
 
 EFFECTS.forEach(fx => {
  const isUnlocked = user.unlockedEffects && user.unlockedEffects.includes(fx.id);
  const card = document.createElement('div');
  card.className = 'item-card';
  card.innerHTML = `
   <div class="preview-circle ${fx.class}">${fx.icon}</div>
   <b style="color:var(--gold)">${fx.name}</b>
   <p style="font-size:0.85rem;color:var(--dim)">${fx.desc}</p>
   <button class="btn-gold" ${isUnlocked ? 'disabled style="background:#2ecc71;color:#fff;"' : ''} onclick="buyEffect('${fx.id}')">
    ${isUnlocked ? 'මිලදී ගෙන ඇත (Unlocked)' : 'මිලදී ගන්න (250 pts)'}
   </button>
  `;
  grid.appendChild(card);
 });
}

function buyEffect(id){
 if(user.points < 250){
  return toast('ඔබ සතුව ප්‍රමාණවත් Points නැත (අවශ්‍යයි: 250 pts)!');
 }
 user.points -= 250;
 if(!user.unlockedEffects) user.unlockedEffects = [];
 user.unlockedEffects.push(id);
 
 syncUserWithDB();
 renderShop();
 toast('සාර්ථකව මිලදී ගන්නා ලදී! 🎉 (Profile වෙතින් Select කරගන්න)');
}

updatePointsUI();
renderShop();
startRewardTimer();
</script>
</body>
</html>
