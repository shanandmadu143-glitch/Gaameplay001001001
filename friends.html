<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ශ්‍රී ලංකීය දාම් - Friends & Invite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070e;--panel:rgba(14,20,38,.94);--gold:#ffd166;--neon-blue:#00f2fe;--neon-green:#2ecc71;--red:#ff4757;--dim:#a0aec0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:radial-gradient(circle at 50% 15%,rgba(255,159,28,0.2) 0%,rgba(42,20,76,0.9) 38%,#080c1c 72%,#03050a 100%);color:#f8f9fa;overflow:hidden}
body{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center}

.app{width:100%;height:100dvh;max-width:768px;margin:0 auto;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2;overflow:hidden}

.home-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:linear-gradient(135deg,rgba(30,41,78,0.96),rgba(10,14,28,0.97));border:2px solid rgba(255,209,102,0.55);border-radius:22px;box-shadow:0 8px 22px rgba(0,0,0,0.62)}
.profile-float{display:flex;align-items:center;gap:12px;cursor:pointer}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffe08a,#ffb52e);color:#18213e;font-size:1.35rem;border:2px solid #ffd166;flex-shrink:0}
#headerName{font-size:1.12rem;color:#fff;font-weight:800}

.coin-pill{display:flex;align-items:center;gap:6px;border:1.5px solid rgba(255,209,102,0.5);border-radius:20px;background:rgba(5,8,18,0.92);padding:4px 10px}
.coin-pill>i{font-size:1.05rem;color:var(--gold)}
.coin-pill b{font-size:1rem;color:#fff}
.coin-pill button{width:24px;height:24px;border:0;border-radius:50%;background:linear-gradient(135deg,#2ecc71,#20c978);color:#fff;font-size:0.95rem;font-weight:800;cursor:pointer;display:grid;place-items:center}

main{flex:1;display:flex;flex-direction:column;width:100%;margin:8px 0;overflow:hidden}
.panel{width:100%;height:100%;display:flex;flex-direction:column;gap:12px;padding:16px;background:linear-gradient(145deg,rgba(19,26,48,0.94),rgba(10,14,26,0.97));border:2px solid rgba(255,209,102,0.34);border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,0.58);overflow-y:auto}
.panel h2{text-align:center;color:var(--gold);font-size:1.3rem}

.bet-banner{background:rgba(255,209,102,0.12);border:1.5px solid rgba(255,209,102,0.5);border-radius:16px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:0.92rem}
.bet-banner b{color:var(--gold)}

.search-row{display:flex;gap:8px}
input{flex:1;padding:10px 14px;background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,209,102,0.4);border-radius:12px;color:white;font-size:0.95rem;outline:none}
input:focus{border-color:var(--gold)}

.btn,.btn-gold,.btn-green,.btn-blue,.btn-red{border:0;border-radius:12px;padding:9px 13px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .12s ease;font-size:0.86rem}
.btn:active,.btn-gold:active,.btn-green:active,.btn-blue:active,.btn-red:active{transform:scale(0.96)}
.btn{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2)}
.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111}
.btn-green{background:linear-gradient(135deg,#2ecc71,#20b863);color:#09180f}
.btn-blue{background:linear-gradient(135deg,#00f2fe,#0984e3);color:#061322}
.btn-red{background:linear-gradient(135deg,#ff6b81,#e84118);color:#fff}

.section-title{font-size:0.98rem;color:var(--gold);font-weight:700;margin-top:4px;display:flex;align-items:center;gap:6px}
.friend-list{display:flex;flex-direction:column;gap:9px}
.friend-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,209,102,0.24);border-radius:16px}
.friend-profile-trigger{display:flex;align-items:center;gap:11px;cursor:pointer;flex:1;min-width:0}
.f-avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;border:2px solid var(--gold);flex-shrink:0}
.f-meta{min-width:0}
.f-meta b{display:block;font-size:1rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-meta small{display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--dim)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-online{background:var(--neon-green)}
.status-offline{background:#718096}
.f-actions{display:flex;gap:6px;flex-shrink:0}

/* Player Detail Modal */
.modal{position:fixed;inset:0;background:rgba(3,5,12,0.86);display:none;place-items:center;z-index:120;padding:15px}
.modal.show{display:grid}
.modalbox{width:min(100%,420px);background:linear-gradient(145deg,#121828,#1b243f);border:2px solid var(--gold);border-radius:24px;padding:20px;display:grid;gap:14px;max-height:86vh;overflow-y:auto;box-shadow:0 16px 36px rgba(0,0,0,0.82)}
.modalbox h3{text-align:center;color:var(--gold);font-size:1.25rem}

.detail-hero{display:flex;align-items:center;justify-content:space-around;gap:12px;background:rgba(0,0,0,0.34);border:1px solid rgba(255,209,102,0.3);border-radius:18px;padding:14px}
.detail-slot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.detail-circle{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;border:2.5px solid var(--gold)}
.detail-slot span{font-size:0.78rem;color:#e2e8f0;font-weight:700}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-box{background:rgba(255,255,255,0.05);border:1px solid rgba(255,209,102,0.25);border-radius:14px;padding:10px 12px;text-align:center}
.stat-box small{display:block;font-size:0.75rem;color:var(--dim)}
.stat-box b{display:block;font-size:1.25rem;color:#fff;margin-top:2px}
.stat-box.win b{color:var(--neon-green)}
.stat-box.loss b{color:var(--red)}
.stat-box.pts b{color:var(--gold)}

.detail-comm-row{display:flex;gap:10px}
.detail-comm-row button{flex:1;padding:11px 12px;font-size:0.95rem}

.bottom-nav{width:100%;min-height:66px;background:rgba(14,20,38,0.97);border:2px solid rgba(255,209,102,0.38);border-radius:24px;display:flex;align-items:center;justify-content:space-around;padding:6px 4px}
.nav-item{background:none;border:0;color:#aab4c7;text-decoration:none;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:0.72rem;font-weight:700;cursor:pointer}
.nav-item i{font-size:1.3rem}
.nav-item.active{color:var(--gold)}

#toast{position:fixed;bottom:20px;left:50%;transform:translate3d(-50%,120px,0);opacity:0;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--gold);color:#f8f9fa;border-radius:30px;padding:10px 20px;z-index:200;transition:transform .25s ease,opacity .25s ease;font-weight:600;display:flex;align-items:center;gap:8px;font-size:0.9rem}
#toast.show{transform:translate3d(-50%,0,0);opacity:1}
</style>
</head>
<body>
<div class="app">
 <div class="home-top">
  <div class="profile-float" onclick="window.location.href='profile.html'">
   <span class="avatar" id="headerAvatar"><i class="fa-solid fa-user"></i></span>
   <div><b id="headerName">ක්‍රීඩකයා</b></div>
  </div>
  <div class="coin-pill"><i class="fa-solid fa-coins"></i><b><span id="points">500</span></b><button onclick="window.location.href='shopandreward.html'">+</button></div>
 </div>

 <main>
  <section class="panel">
   <h2><i class="fa-solid fa-user-group"></i> Friends & Multiplayer</h2>

   <div class="bet-banner">
    <span><i class="fa-solid fa-coins" style="color:var(--gold)"></i> තරඟ ඔට්ටුව (Bet):</span>
    <b id="currentBetLabel">50 Points</b>
   </div>

   <div class="search-row">
    <input id="searchUsername" placeholder="ක්‍රීඩක නමින් සොයන්න (Username)..." autocomplete="off">
    <button class="btn-gold" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
   </div>

   <div id="searchResults" class="friend-list"></div>

   <div class="section-title"><i class="fa-solid fa-envelope-open-text"></i> Friend Requests</div>
   <div id="requestsList" class="friend-list"></div>

   <div class="section-title"><i class="fa-solid fa-users"></i> මගේ යහළුවන් (Profile Click කර බලන්න)</div>
   <div id="friendsList" class="friend-list"></div>
  </section>
 </main>

 <footer class="bottom-nav">
  <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a class="nav-item active" href="friends.html"><i class="fa-solid fa-user-group"></i><span>Friends</span></a>
  <a class="nav-item" href="profile.html"><i class="fa-solid fa-circle-user"></i><span>Profile</span></a>
  <a class="nav-item" href="event.html"><i class="fa-solid fa-trophy"></i><span>Events</span></a>
  <a class="nav-item" href="shopandreward.html"><i class="fa-solid fa-cart-shopping"></i><span>Shop</span></a>
 </footer>
</div>

<!-- Player Profile Detail Modal -->
<div class="modal" id="playerDetailModal" role="dialog" aria-modal="true">
 <div class="modalbox">
  <div style="display:flex;justify-content:space-between;align-items:center">
   <h3 id="detailPlayerName" style="margin:0;text-align:left">Player Name</h3>
   <button class="btn" id="closePlayerDetail" style="padding:5px 10px">✕</button>
  </div>
  <div id="detailOnlineStatus" style="font-size:0.82rem;color:var(--dim)"></div>

  <div class="detail-hero">
   <div class="detail-slot">
    <div class="detail-circle" id="detailAvatarCircle"><i class="fa-solid fa-user"></i></div>
    <span>Avatar</span>
   </div>
   <div class="detail-slot">
    <div class="detail-circle" id="detailPieceCircle">●</div>
    <span id="detailPieceThemeName">දාම් ඉත්තා Theme</span>
   </div>
  </div>

  <div class="stats-grid">
   <div class="stat-box win">
    <small>Wins</small>
    <b id="detailWins">0</b>
   </div>
   <div class="stat-box loss">
    <small>Losses</small>
    <b id="detailLosses">0</b>
   </div>
   <div class="stat-box">
    <small>Total Matches</small>
    <b id="detailMatches">0</b>
   </div>
   <div class="stat-box pts">
    <small>Points</small>
    <b id="detailPoints">500</b>
   </div>
  </div>

  <div class="detail-comm-row">
   <button class="btn-green" id="detailCallBtn"><i class="fa-solid fa-phone"></i> Call</button>
   <button class="btn-blue" id="detailMessageBtn"><i class="fa-solid fa-comment-dots"></i> Message</button>
  </div>

  <button class="btn-gold" id="detailInviteBtn" style="width:100%"><i class="fa-solid fa-gamepad"></i> තරඟයට ආරාධනා කරන්න</button>
 </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
'use strict';
const firebaseConfig={apiKey:"AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",authDomain:"bin-card-42614.firebaseapp.com",databaseURL:"https://bin-card-42614-default-rtdb.firebaseio.com",projectId:"bin-card-42614",storageBucket:"bin-card-42614.firebasestorage.app",messagingSenderId:"1063550230753",appId:"1:1063550230753:web:1ad8306405e709ac5b17a0"};
const $=id=>document.getElementById(id),KEY='sinhala_draughts_v7_user';

const PIECE_DESIGNS=[
 {id:0,name:'මුතු සුදු (Default)',bg:'radial-gradient(circle at 30% 30%,#ffffff,#dfe6e9)',border:'#b2bec3',color:'#2d3436',icon:'●'},
 {id:1,name:'රන් ඔටුන්න',bg:'linear-gradient(135deg,#ffeaa7,#fdcb6e)',border:'#e1b12c',color:'#2d3436',icon:'★'},
 {id:2,name:'රුධිර රතු',bg:'radial-gradient(circle at 30% 30%,#ff7675,#d63031)',border:'#c0392b',color:'#fff',icon:'◆'},
 {id:3,name:'මරකත කොළ',bg:'radial-gradient(circle at 30% 30%,#55efc4,#00b894)',border:'#00a8ff',color:'#fff',icon:'▲'},
 {id:4,name:'නියෝන් නිල්',bg:'radial-gradient(circle at 30% 30%,#74b9ff,#0984e3)',border:'#00f2fe',color:'#fff',icon:'✦'},
 {id:5,name:'රාජකීය දම්',bg:'radial-gradient(circle at 30% 30%,#a29bfe,#6c5ce7)',border:'#fd79a8',color:'#fff',icon:'❖'},
 {id:6,name:'අඳුරු කාබන්',bg:'radial-gradient(circle at 30% 30%,#636e72,#2d3436)',border:'#b2bec3',color:'#ffd166',icon:'♠'},
 {id:7,name:'සූර්ය රන්',bg:'radial-gradient(circle at 30% 30%,#fab1a0,#e17055)',border:'#d63031',color:'#fff',icon:'☀'},
 {id:8,name:'මැජෙන්ටා රෝස',bg:'radial-gradient(circle at 30% 30%,#ff7979,#eb4d4b)',border:'#ff7979',color:'#fff',icon:'✿'},
 {id:9,name:'සැහැල්ලු සිල්වර්',bg:'radial-gradient(circle at 30% 30%,#dfe6e9,#b2bec3)',border:'#636e72',color:'#2d3436',icon:'⚙'},
 {id:10,name:'කොස්මික් වයලට්',bg:'radial-gradient(circle at 30% 30%,#8e44ad,#3498db)',border:'#9b59b6',color:'#fff',icon:'☄'},
 {id:11,name:'නියෝන් ලෙමන්',bg:'radial-gradient(circle at 30% 30%,#f1c40f,#f39c12)',border:'#f1c40f',color:'#111',icon:'⚡'},
 {id:12,name:'ටර්කියුයිස්',bg:'radial-gradient(circle at 30% 30%,#1abc9c,#16a085)',border:'#1abc9c',color:'#fff',icon:'🌊'},
 {id:13,name:'චොක්ලට් බ්‍රවුන්',bg:'radial-gradient(circle at 30% 30%,#d35400,#a04000)',border:'#e67e22',color:'#fff',icon:'☕'},
 {id:14,name:'රෝස් ගෝල්ඩ්',bg:'radial-gradient(circle at 30% 30%,#f5b041,#eb984e)',border:'#f39c12',color:'#fff',icon:'♕'},
 {id:15,name:'ගැඹුරු මිනිරන්',bg:'radial-gradient(circle at 30% 30%,#34495e,#2c3e50)',border:'#7f8c8d',color:'#ffd166',icon:'🛡'},
 {id:16,name:'අයිස් මින්ට්',bg:'radial-gradient(circle at 30% 30%,#a3e4d7,#48c9b0)',border:'#17a589',color:'#111',icon:'❄'},
 {id:17,name:'සැණකෙළි පර්පල්',bg:'radial-gradient(circle at 30% 30%,#d98880,#c0392b)',border:'#e74c3c',color:'#fff',icon:'🔮'},
 {id:18,name:'විදුලි ලෙමන්',bg:'radial-gradient(circle at 30% 30%,#f7dc6f,#f9e79f)',border:'#f1c40f',color:'#111',icon:'✨'},
 {id:19,name:'අමරණීය අඳුර',bg:'radial-gradient(circle at 30% 30%,#2c3e50,#000000)',border:'#ffd166',color:'#ffd166',icon:'♔'}
];

let auth,db,fbUser,selectedPlayer=null;
let user={name:'',points:500,wins:0,losses:0,uid:null,pieceIndex:0,avatarIcon:'fa-user'};
const betAmount=Number(new URLSearchParams(window.location.search).get('bet'))||Number(sessionStorage.getItem('sinhala_draughts_bet'))||50;
$('currentBetLabel').textContent=`${betAmount} Points`;

function toast(msg,icon='fa-circle-info'){
 const t=$('toast');
 t.replaceChildren();
 const i=document.createElement('i');i.className=`fa-solid ${icon}`;i.style.color='var(--gold)';
 const s=document.createElement('span');s.textContent=String(msg);
 t.append(i,s);
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),2800);
}

function getPieceDesign(idx){
 const n=Number(idx)||0;
 return PIECE_DESIGNS[n]||PIECE_DESIGNS[0];
}

function applyAvatarStyle(el, pieceIdx, iconName){
 if(!el)return;
 const d=getPieceDesign(pieceIdx);
 el.style.background=d.bg;
 el.style.borderColor=d.border;
 el.style.color=d.color;
 const cleanIcon=String(iconName||'fa-user').replace(/^fa-solid\s+/,'');
 el.innerHTML=`<i class="fa-solid ${cleanIcon}"></i>`;
}

function applyPieceThemeStyle(el, pieceIdx){
 if(!el)return;
 const d=getPieceDesign(pieceIdx);
 el.style.background=d.bg;
 el.style.borderColor=d.border;
 el.style.color=d.color;
 el.textContent=d.icon;
}

function updateMyHeader(){
 $('headerName').textContent=user.name||'ක්‍රීඩකයා';
 $('points').textContent=user.points ?? 500;
 applyAvatarStyle($('headerAvatar'), user.pieceIndex||0, user.avatarIcon||'fa-user');
}

try{
 const cached=localStorage.getItem(KEY);
 if(cached)user={...user,...JSON.parse(cached)};
}catch(_){}
updateMyHeader();

function openPlayerDetail(player){
 selectedPlayer=player;
 const wins=Number(player.wins)||0;
 const losses=Number(player.losses)||0;
 const matches=wins+losses;
 const pts=Number(player.points) ?? 500;
 const pieceIdx=player.pieceIndex ?? 0;
 const design=getPieceDesign(pieceIdx);

 $('detailPlayerName').textContent=player.name||'Player';
 $('detailOnlineStatus').textContent=player.online ? '🟢 Online දැන් ක්‍රීඩා කරමින්' : '⚪ Offline';
 applyAvatarStyle($('detailAvatarCircle'), pieceIdx, player.avatarIcon||'fa-user');
 applyPieceThemeStyle($('detailPieceCircle'), pieceIdx);
 $('detailPieceThemeName').textContent=design.name;

 $('detailWins').textContent=wins;
 $('detailLosses').textContent=losses;
 $('detailMatches').textContent=matches;
 $('detailPoints').textContent=pts;

 $('playerDetailModal').classList.add('show');
}

$('closePlayerDetail').onclick=()=>$('playerDetailModal').classList.remove('show');

$('detailCallBtn').onclick=()=>{
 if(!selectedPlayer)return;
 if(db && fbUser && selectedPlayer.uid){
  db.ref(`calls_v6/${selectedPlayer.uid}`).push({
   fromUid:fbUser.uid,
   fromName:user.name||'Player',
   toUid:selectedPlayer.uid,
   toName:selectedPlayer.name||'Player',
   status:'ringing',
   timestamp:Date.now()
  }).catch(()=>{});
 }
 toast(`${selectedPlayer.name||'Player'} වෙත Call එකක් යවන ලදී...`,'fa-phone');
};

$('detailMessageBtn').onclick=()=>{
 if(!selectedPlayer)return;
 sessionStorage.setItem('sinhala_draughts_chat_target', JSON.stringify({
  uid:selectedPlayer.uid,
  name:selectedPlayer.name||'Player',
  pieceIndex:selectedPlayer.pieceIndex||0,
  avatarIcon:selectedPlayer.avatarIcon||'fa-user'
 }));
 window.location.href=`inbox.html?with=${encodeURIComponent(selectedPlayer.uid||'')}&name=${encodeURIComponent(selectedPlayer.name||'')}`;
};

$('detailInviteBtn').onclick=()=>{
 if(!selectedPlayer)return;
 if(db && fbUser && selectedPlayer.uid){
  const roomId='room_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  db.ref('rooms_v6/'+roomId).set({
   hostUid:fbUser.uid,
   hostName:user.name||'Host',
   hostPieceIndex:user.pieceIndex||0,
   guestUid:selectedPlayer.uid,
   guestName:selectedPlayer.name||'Guest',
   bet:betAmount,
   status:'waiting',
   createdAt:Date.now()
  }).catch(()=>{});
  sessionStorage.setItem('sinhala_draughts_multi_room', JSON.stringify({
   roomId, role:'host', bet:betAmount, guestName:selectedPlayer.name||'Guest'
  }));
  window.location.href=`arena.html?mode=multi&role=host&roomId=${encodeURIComponent(roomId)}&bet=${encodeURIComponent(betAmount)}&oppName=${encodeURIComponent(selectedPlayer.name||'')}`;
 }
};

function renderPlayerCard(container, player, mode){
 const card=document.createElement('div');
 card.className='friend-card';

 const trigger=document.createElement('div');
 trigger.className='friend-profile-trigger';
 trigger.onclick=()=>openPlayerDetail(player);

 const av=document.createElement('div');
 av.className='f-avatar';
 applyAvatarStyle(av, player.pieceIndex||0, player.avatarIcon||'fa-user');

 const meta=document.createElement('div');
 meta.className='f-meta';
 const nameB=document.createElement('b');
 nameB.textContent=player.name||'Player';
 const subSm=document.createElement('small');
 const dot=document.createElement('span');
 dot.className='status-dot '+(player.online?'status-online':'status-offline');
 const themeLabel=getPieceDesign(player.pieceIndex||0).name;
 subSm.append(dot, document.createTextNode(`${player.points ?? 500} pts • ${themeLabel}`));
 meta.append(nameB, subSm);
 trigger.append(av, meta);

 const actions=document.createElement('div');
 actions.className='f-actions';

 if(mode==='search'){
  const addBtn=document.createElement('button');
  addBtn.className='btn-gold';
  addBtn.innerHTML='<i class="fa-solid fa-user-plus"></i>';
  addBtn.title='Add Friend';
  addBtn.onclick=(e)=>{e.stopPropagation();sendFriendRequest(player);};
  actions.append(addBtn);
 }else if(mode==='request'){
  const accBtn=document.createElement('button');
  accBtn.className='btn-green';
  accBtn.innerHTML='<i class="fa-solid fa-check"></i>';
  accBtn.onclick=(e)=>{e.stopPropagation();acceptFriendRequest(player);};
  actions.append(accBtn);
 }else{
  const msgBtn=document.createElement('button');
  msgBtn.className='btn-blue';
  msgBtn.innerHTML='<i class="fa-solid fa-comment"></i>';
  msgBtn.onclick=(e)=>{
   e.stopPropagation();
   sessionStorage.setItem('sinhala_draughts_chat_target', JSON.stringify(player));
   window.location.href=`inbox.html?with=${encodeURIComponent(player.uid||'')}&name=${encodeURIComponent(player.name||'')}`;
  };
  const callBtn=document.createElement('button');
  callBtn.className='btn-green';
  callBtn.innerHTML='<i class="fa-solid fa-phone"></i>';
  callBtn.onclick=(e)=>{
   e.stopPropagation();
   openPlayerDetail(player);
  };
  actions.append(msgBtn, callBtn);
 }

 card.append(trigger, actions);
 container.appendChild(card);
}

async function sendFriendRequest(target){
 if(!db || !fbUser || !target.uid)return toast('ගිණුමට ඇතුළු වන්න.');
 await db.ref(`friendRequests_v6/${target.uid}/${fbUser.uid}`).set({
  uid:fbUser.uid, name:user.name||'Player', points:user.points||500,
  wins:user.wins||0, losses:user.losses||0, pieceIndex:user.pieceIndex||0, avatarIcon:user.avatarIcon||'fa-user'
 });
 toast(`${target.name} වෙත Friend Request යවන ලදී.`,'fa-user-plus');
}

async function acceptFriendRequest(reqPlayer){
 if(!db || !fbUser || !reqPlayer.uid)return;
 await db.ref(`friends_v6/${fbUser.uid}/${reqPlayer.uid}`).set(true);
 await db.ref(`friends_v6/${reqPlayer.uid}/${fbUser.uid}`).set(true);
 await db.ref(`friendRequests_v6/${fbUser.uid}/${reqPlayer.uid}`).remove();
 toast(`${reqPlayer.name} දැන් ඔබගේ යහළුවෙක්!`,'fa-check');
 loadFriendsAndRequests();
}

async function enrichProfiles(uidList){
 const out=[];
 for(const uid of uidList){
  if(!uid || uid===fbUser?.uid)continue;
  let p={uid,name:'Player',points:500,wins:0,losses:0,pieceIndex:0,avatarIcon:'fa-user',online:false};
  try{
   const pub=await db.ref('publicProfiles_v6/'+uid).once('value');
   if(pub.exists())p={...p,...pub.val(),uid};
   const st=await db.ref('status_v6/'+uid).once('value');
   if(st.exists() && st.val()?.state==='online')p.online=true;
  }catch(_){}
  out.push(p);
 }
 return out;
}

async function loadFriendsAndRequests(){
 if(!db || !fbUser)return;
 const reqBox=$('requestsList');
 const frBox=$('friendsList');
 reqBox.innerHTML='';
 frBox.innerHTML='';

 const reqSnap=await db.ref('friendRequests_v6/'+fbUser.uid).once('value').catch(()=>null);
 if(reqSnap && reqSnap.exists()){
  const reqPlayers=await enrichProfiles(Object.keys(reqSnap.val()));
  reqPlayers.forEach(p=>renderPlayerCard(reqBox, p, 'request'));
 }else{
  reqBox.innerHTML='<small style="color:var(--dim)">Requests නොමැත.</small>';
 }

 const frSnap=await db.ref('friends_v6/'+fbUser.uid).once('value').catch(()=>null);
 if(frSnap && frSnap.exists()){
  const frPlayers=await enrichProfiles(Object.keys(frSnap.val()));
  frPlayers.forEach(p=>renderPlayerCard(frBox, p, 'friend'));
 }else{
  frBox.innerHTML='<small style="color:var(--dim)">තවම යහළුවන් එකතු කර නොමැත.</small>';
 }
}

$('searchBtn').onclick=async()=>{
 const q=$('searchUsername').value.trim().toLowerCase();
 const resBox=$('searchResults');
 resBox.innerHTML='';
 if(!q)return;
 if(!db)return toast('Database සම්බන්ධතාවය නොමැත.');

 const snap=await db.ref('publicProfiles_v6').once('value').catch(()=>null);
 if(!snap || !snap.exists()){
  resBox.innerHTML='<small style="color:var(--dim)">ක්‍රීඩකයන් හමු නොවීය.</small>';
  return;
 }
 const matches=[];
 snap.forEach(child=>{
  const d=child.val()||{};
  const uid=child.key;
  if(uid!==fbUser?.uid && String(d.name||'').toLowerCase().includes(q)){
   matches.push({...d, uid});
  }
 });
 if(!matches.length){
  resBox.innerHTML='<small style="color:var(--dim)">එම නමින් ක්‍රීඩකයෙක් හමු නොවීය.</small>';
  return;
 }
 for(const m of matches.slice(0,8)){
  const st=await db.ref('status_v6/'+m.uid).once('value').catch(()=>null);
  m.online=Boolean(st && st.val()?.state==='online');
  renderPlayerCard(resBox, m, 'search');
 }
};

try{
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();
 db=firebase.database();
 auth.onAuthStateChanged(async u=>{
  fbUser=u;
  if(u){
   const s=await db.ref('users_v6/'+u.uid).once('value').catch(()=>null);
   if(s && s.exists())user={...user,...s.val(),uid:u.uid};
   updateMyHeader();
   loadFriendsAndRequests();
  }
 });
}catch(e){console.error(e);}
</script>
</body>
