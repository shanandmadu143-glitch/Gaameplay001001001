<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ශ්‍රී ලංකීය දාම් - Game Arena</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070e;
  --panel:rgba(14,20,38,0.92);
  --gold:#ffd166;
  --neon-blue:#00f2fe;
  --neon-green:#2ecc71;
  --red:#ff4757;
  --dim:#a0aec0;
  --light-sq:#273252;
  --dark-sq:#0d1324;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:radial-gradient(circle at 50% 15%,#1a103c 0%,#080b18 62%,#03050a 100%);color:#f8f9fa;overflow:hidden}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center}

.arena-app{
  width:100%;height:100dvh;max-width:768px;margin:0 auto;padding:12px;
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;
}

.hud-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px;border-radius:18px;
  background:linear-gradient(135deg,rgba(22,30,56,0.95),rgba(10,14,28,0.95));
  border:1.5px solid rgba(255,209,102,0.35);box-shadow:0 8px 22px rgba(0,0,0,0.55)
}
.hud-player{display:flex;align-items:center;gap:8px;min-width:0}
.hud-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot-host{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dot-guest{background:var(--neon-blue);box-shadow:0 0 10px var(--neon-blue)}
.hud-name{font-weight:800;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:125px}
.hud-role{font-size:0.72rem;color:var(--dim)}

.hud-center{text-align:center}
.bet-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(46,204,113,0.16);border:1px solid rgba(46,204,113,0.45);
  color:var(--neon-green);padding:4px 10px;border-radius:14px;font-weight:800;font-size:0.84rem
}
.turn-label{font-size:0.82rem;margin-top:3px;color:var(--gold);font-weight:700}

.board-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
}
.board{
  width:min(92vw,54dvh,500px);
  height:min(92vw,54dvh,500px);
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border:3px solid rgba(255,209,102,0.55);border-radius:16px;overflow:hidden;
  box-shadow:0 16px 40px rgba(0,0,0,0.8)
}

.sq{
  position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background 0.14s ease
}
.sq.light{background:var(--light-sq)}
.sq.dark{background:var(--dark-sq)}
.sq.selected{outline:2.5px solid var(--neon-green);outline-offset:-2.5px;background:rgba(46,204,113,0.2)}
.sq.valid-move::after{
  content:'';width:32%;height:32%;border-radius:50%;
  background:rgba(0,242,254,0.55);box-shadow:0 0 10px var(--neon-blue)
}
.sq.valid-capture::after{
  content:'';position:absolute;inset:10%;border-radius:50%;
  border:2.5px solid var(--red);box-shadow:0 0 12px rgba(255,71,87,0.75)
}

.piece{
  width:76%;height:76%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(0.85rem,2.5vw,1.25rem);font-weight:900;
  transition:transform 0.14s ease,box-shadow 0.14s ease;
  position:relative;z-index:2
}
.piece.host{
  background:radial-gradient(circle at 30% 30%,#fff0b8,#ffd166 55%,#c78916 100%);
  color:#2b1800;border:2px solid #fff5cf;
  box-shadow:0 4px 12px rgba(255,209,102,0.45)
}
.piece.guest{
  background:radial-gradient(circle at 30% 30%,#b8fcff,#00f2fe 55%,#00789c 100%);
  color:#041e29;border:2px solid #d9feff;
  box-shadow:0 4px 12px rgba(0,242,254,0.45)
}
.piece.king::before{
  content:'\f521';font-family:'Font Awesome 6 Free';font-weight:900;
  font-size:0.75em;color:#111;text-shadow:0 1px 0 rgba(255,255,255,0.6)
}

.hud-bottom{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px;border-radius:18px;
  background:var(--panel);border:1.5px solid rgba(255,209,102,0.25)
}
.score-box{font-size:0.86rem;font-weight:700;display:flex;gap:12px}
.score-box span b{color:var(--gold)}

.btn,.btn-danger,.btn-gold{
  border:0;border-radius:12px;padding:8px 13px;cursor:pointer;font-weight:700;font-size:0.84rem;
  display:inline-flex;align-items:center;gap:6px;transition:transform 0.12s ease
}
.btn:active,.btn-danger:active,.btn-gold:active{transform:scale(0.97)}
.btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.btn-danger{background:linear-gradient(135deg,#ff4757,#c0392b);color:#fff}
.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:300;
  display:none;align-items:center;justify-content:center;padding:16px
}
.modal-backdrop.show{display:flex}
.modal-card{
  width:min(94%,380px);background:linear-gradient(145deg,#18223d,#0b101f);
  border:2px solid var(--gold);border-radius:22px;padding:20px;text-align:center;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,0.85)
}
.modal-card h2{color:var(--gold);font-size:1.35rem}
.modal-card p{font-size:0.95rem;color:#e2e8f0;line-height:1.45}

#toast{
  position:fixed;bottom:76px;left:50%;transform:translate(-50%,80px);opacity:0;
  background:rgba(15,23,42,0.96);border:1px solid var(--gold);color:#fff;
  padding:8px 18px;border-radius:24px;font-size:0.86rem;font-weight:700;
  transition:0.22s ease;z-index:320;pointer-events:none
}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<div class="arena-app">
  <div class="hud-top">
    <div class="hud-player">
      <span class="hud-dot dot-host"></span>
      <div>
        <div class="hud-name" id="hostNameEl">Host</div>
        <div class="hud-role">Gold / Light (1st)</div>
      </div>
    </div>

    <div class="hud-center">
      <div class="bet-pill"><i class="fa-solid fa-coins"></i> <span id="betEl">50</span></div>
      <div class="turn-label" id="turnLabelEl">සූදානම් වෙමින්...</div>
    </div>

    <div class="hud-player" style="justify-content:flex-end;text-align:right">
      <div>
        <div class="hud-name" id="guestNameEl">Guest</div>
        <div class="hud-role">Blue / Dark (2nd)</div>
      </div>
      <span class="hud-dot dot-guest"></span>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="boardEl"></div>
  </div>

  <div class="hud-bottom">
    <div class="score-box">
      <span>Gold: <b id="hostCountEl">12</b></span>
      <span>Blue: <b id="guestCountEl">12</b></span>
    </div>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn" id="leaveBtn"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
      <button type="button" class="btn-danger" id="forfeitBtn"><i class="fa-solid fa-flag"></i> Forfeit</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="resultModal">
  <div class="modal-card">
    <h2 id="resultTitle">තරඟය අවසන්!</h2>
    <p id="resultDesc">ප්‍රතිඵලය සකසමින් පවතී...</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:4px">
      <button type="button" class="btn-gold" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Rematch</button>
      <button type="button" class="btn" id="homeBtn"><i class="fa-solid fa-house"></i> Lobby</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",
  authDomain: "bin-card-42614.firebaseapp.com",
  databaseURL: "https://bin-card-42614-default-rtdb.firebaseio.com",
  projectId: "bin-card-42614",
  storageBucket: "bin-card-42614.firebasestorage.app",
  messagingSenderId: "1063550230753",
  appId: "1:1063550230753:web:1ad8306405e709ac5b17a0"
};

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(window.location.search);

let storedRoom = null;
try {
  storedRoom = JSON.parse(sessionStorage.getItem('sinhala_draughts_multi_room') || 'null');
} catch (_) {}

const mode = params.get('mode') || (storedRoom && storedRoom.roomId ? 'multi' : 'single');
const roomId = params.get('roomId') || (storedRoom && storedRoom.roomId) || '';
const myRole = params.get('role') || (storedRoom && storedRoom.role) || 'host';
const bet = Math.max(10, Number(params.get('bet')) || (storedRoom && Number(storedRoom.bet)) || Number(sessionStorage.getItem('sinhala_draughts_bet')) || 50);

$('betEl').textContent = bet;

let auth, db, fbUser;
let roomRef = null;
let board = createInitialBoard();
let currentTurn = 'host'; // 'host' or 'guest'
let selectedCell = null;
let validMoves = [];
let forcedPieceKey = null;
let hostName = (storedRoom && storedRoom.hostName) || 'Host';
let guestName = (storedRoom && storedRoom.guestName) || 'Guest';
let matchFinished = false;
let settledForMatch = false;

function showToast(msg) {
  const t = $('toast');
  t.textContent = String(msg);
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function createInitialBoard() {
  // 8x8 grid: null or { owner: 'host' | 'guest', king: boolean }
  // Guest (blue) starts at top rows (0..2), Host (gold) starts at bottom rows (5..7) on dark squares ((r+c)%2 === 1)
  const grid = Array.from({ length: 8 }, () => Array(8).fill(null));
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if ((r + c) % 2 === 1) {
        if (r < 3) grid[r][c] = { owner: 'guest', king: false };
        else if (r > 4) grid[r][c] = { owner: 'host', king: false };
      }
    }
  }
  return grid;
}

function normalizeGrid(rawGrid) {
  if (!Array.isArray(rawGrid) || rawGrid.length !== 8) return createInitialBoard();
  return Array.from({ length: 8 }, (_, r) =>
    Array.from({ length: 8 }, (__, c) => {
      const cell = rawGrid[r] && rawGrid[r][c];
      if (!cell || typeof cell !== 'object') return null;
      if (cell.owner !== 'host' && cell.owner !== 'guest') return null;
      return { owner: cell.owner, king: Boolean(cell.king) };
    })
  );
}

function getMoveDirs(piece) {
  if (piece.king) {
    return [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  }
  // Host moves up (-1), Guest moves down (+1)
  return piece.owner === 'host'
    ? [[-1, -1], [-1, 1]]
    : [[1, -1], [1, 1]];
}

function getPieceMoves(r, c, grid = board) {
  const piece = grid[r] && grid[r][c];
  if (!piece) return [];

  const captures = [];
  const steps = [];
  const allDirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  const moveDirs = getMoveDirs(piece);

  for (const [dr, dc] of allDirs) {
    const mr = r + dr;
    const mc = c + dc;
    const jr = r + dr * 2;
    const jc = c + dc * 2;
    if (jr >= 0 && jr < 8 && jc >= 0 && jc < 8) {
      const mid = grid[mr][mc];
      const dest = grid[jr][jc];
      if (mid && mid.owner !== piece.owner && !dest) {
        captures.push({ r: jr, c: jc, capture: { r: mr, c: mc } });
      }
    }
  }

  if (captures.length > 0) return captures;

  for (const [dr, dc] of moveDirs) {
    const nr = r + dr;
    const nc = c + dc;
    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !grid[nr][nc]) {
      steps.push({ r: nr, c: nc, capture: null });
    }
  }

  return steps;
}

function hasAnyCaptureForOwner(owner, grid = board) {
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = grid[r][c];
      if (p && p.owner === owner) {
        const moves = getPieceMoves(r, c, grid);
        if (moves.some((m) => Boolean(m.capture))) return true;
      }
    }
  }
  return false;
}

function canControlTurn() {
  if (matchFinished) return false;
  if (mode === 'single') return currentTurn === 'host';
  return currentTurn === myRole;
}

function updateHud() {
  $('hostNameEl').textContent = hostName;
  $('guestNameEl').textContent = guestName;

  let hCount = 0;
  let gCount = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (board[r][c]?.owner === 'host') hCount++;
      if (board[r][c]?.owner === 'guest') gCount++;
    }
  }
  $('hostCountEl').textContent = hCount;
  $('guestCountEl').textContent = gCount;

  if (matchFinished) {
    $('turnLabelEl').textContent = 'තරඟය අවසන්';
    return;
  }

  if (mode === 'multi') {
    if (currentTurn === myRole) {
      $('turnLabelEl').textContent = 'ඔබගේ වාරයයි (Your Turn)';
      $('turnLabelEl').style.color = '#2ecc71';
    } else {
      $('turnLabelEl').textContent = 'ප්‍රතිවාදියාගේ වාරය...';
      $('turnLabelEl').style.color = '#00f2fe';
    }
  } else {
    $('turnLabelEl').textContent = currentTurn === 'host' ? 'ඔබගේ වාරයයි' : 'AI වාරය...';
    $('turnLabelEl').style.color = currentTurn === 'host' ? '#2ecc71' : '#ffd166';
  }
}

function renderBoard() {
  const boardEl = $('boardEl');
  boardEl.replaceChildren();

  const flipBoard = mode === 'multi' && myRole === 'guest';

  for (let vr = 0; vr < 8; vr++) {
    for (let vc = 0; vc < 8; vc++) {
      const r = flipBoard ? 7 - vr : vr;
      const c = flipBoard ? 7 - vc : vc;

      const sq = document.createElement('div');
      const isDark = (r + c) % 2 === 1;
      sq.className = `sq ${isDark ? 'dark' : 'light'}`;

      if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
        sq.classList.add('selected');
      }

      const matchedMove = validMoves.find((m) => m.r === r && m.c === c);
      if (matchedMove) {
        sq.classList.add(matchedMove.capture ? 'valid-capture' : 'valid-move');
      }

      const piece = board[r][c];
      if (piece) {
        const pEl = document.createElement('div');
        pEl.className = `piece ${piece.owner}${piece.king ? ' king' : ''}`;
        sq.appendChild(pEl);
      }

      sq.onclick = () => onSquareClick(r, c);
      boardEl.appendChild(sq);
    }
  }

  updateHud();
  checkGameOver();
}

async function syncRoomState(extra = {}) {
  if (mode !== 'multi' || !db || !roomId) return;
  try {
    await db.ref(`rooms_v6/${roomId}`).update({
      board,
      turn: currentTurn,
      updatedAt: Date.now(),
      ...extra
    });
  } catch (e) {
    console.error('Room sync error:', e);
  }
}

async function settleCoinsIfNeeded(winnerRole) {
  if (settledForMatch || !db || !fbUser) return;
  settledForMatch = true;
  if (!winnerRole) return;

  const didIWin = mode === 'single' ? winnerRole === 'host' : winnerRole === myRole;
  const delta = didIWin ? bet : -bet;

  try {
    await db.ref(`users_v6/${fbUser.uid}/points`).transaction((cur) => {
      const val = Number(cur) || 0;
      return Math.max(0, val + delta);
    });
    await db.ref(`publicProfiles_v6/${fbUser.uid}`).update({
      points: await db.ref(`users_v6/${fbUser.uid}/points`).once('value').then((s) => Number(s.val()) || 0),
      wins: await db.ref(`publicProfiles_v6/${fbUser.uid}/wins`).once('value').then((s) => (Number(s.val()) || 0) + (didIWin ? 1 : 0))
    }).catch(() => {});
  } catch (_) {}
}

function openResultModal(title, desc, winnerRole) {
  if (matchFinished) return;
  matchFinished = true;
  $('resultTitle').textContent = title;
  $('resultDesc').textContent = desc;
  $('resultModal').classList.add('show');
  settleCoinsIfNeeded(winnerRole);
}

function checkGameOver() {
  if (matchFinished) return;
  let hostPieces = 0;
  let guestPieces = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (board[r][c]?.owner === 'host') hostPieces++;
      if (board[r][c]?.owner === 'guest') guestPieces++;
    }
  }

  if (hostPieces === 0) {
    openResultModal(
      mode === 'multi' && myRole === 'guest' ? 'ඔබ ජයග්‍රහණය කළා!' : 'ප්‍රතිවාදියා ජයග්‍රහණය කළා',
      `ඔට්ටුව: ${bet} Coins`,
      'guest'
    );
  } else if (guestPieces === 0) {
    openResultModal(
      mode === 'multi' && myRole === 'host' ? 'ඔබ ජයග්‍රහණය කළා!' : (mode === 'single' ? 'ඔබ ජයග්‍රහණය කළා!' : 'ප්‍රතිවාදියා ජයග්‍රහණය කළා'),
      `ඔට්ටුව: ${bet} Coins`,
      'host'
    );
  }
}

async function executeMove(fromR, fromC, move) {
  const piece = board[fromR][fromC];
  if (!piece) return;

  const wasCapture = Boolean(move.capture);
  board[fromR][fromC] = null;
  if (wasCapture) {
    board[move.capture.r][move.capture.c] = null;
  }

  const promoted =
    (piece.owner === 'host' && move.r === 0) ||
    (piece.owner === 'guest' && move.r === 7);

  board[move.r][move.c] = {
    owner: piece.owner,
    king: piece.king || promoted
  };

  // Check chain capture if this move was a capture and not newly promoted
  const nextMoves = wasCapture && !promoted
    ? getPieceMoves(move.r, move.c, board).filter((m) => Boolean(m.capture))
    : [];

  if (nextMoves.length > 0) {
    forcedPieceKey = `${move.r},${move.c}`;
    selectedCell = { r: move.r, c: move.c };
    validMoves = nextMoves;
    renderBoard();
    await syncRoomState({ lastMove: { fromR, fromC, toR: move.r, toC: move.c, chain: true } });
    return;
  }

  forcedPieceKey = null;
  selectedCell = null;
  validMoves = [];
  currentTurn = currentTurn === 'host' ? 'guest' : 'host';

  renderBoard();
  await syncRoomState({
    lastMove: { fromR, fromC, toR: move.r, toC: move.c, at: Date.now() }
  });

  if (mode === 'single' && currentTurn === 'guest' && !matchFinished) {
    setTimeout(runAiTurn, 420);
  }
}

function runAiTurn() {
  if (matchFinished || currentTurn !== 'guest') return;
  const mustCapture = hasAnyCaptureForOwner('guest', board);
  const candidates = [];

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (board[r][c]?.owner === 'guest') {
        const ms = getPieceMoves(r, c, board);
        for (const m of ms) {
          if (mustCapture && !m.capture) continue;
          candidates.push({ fromR: r, fromC: c, move: m });
        }
      }
    }
  }

  if (!candidates.length) {
    openResultModal('ඔබ ජයග්‍රහණය කළා!', 'AI හට පියවර නොමැත.', 'host');
    return;
  }

  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  executeMove(pick.fromR, pick.fromC, pick.move);
}

function onSquareClick(r, c) {
  if (!canControlTurn()) {
    if (mode === 'multi') showToast('දැන් ප්‍රතිවාදියාගේ වාරයයි.');
    return;
  }

  const clickedValid = validMoves.find((m) => m.r === r && m.c === c);
  if (selectedCell && clickedValid) {
    executeMove(selectedCell.r, selectedCell.c, clickedValid);
    return;
  }

  if (forcedPieceKey) {
    const [fr, fc] = forcedPieceKey.split(',').map(Number);
    if (r === fr && c === fc) {
      selectedCell = { r: fr, c: fc };
      validMoves = getPieceMoves(fr, fc, board).filter((m) => Boolean(m.capture));
      renderBoard();
    } else {
      showToast('Chain capture සම්පූර්ණ කරන්න!');
    }
    return;
  }

  const piece = board[r][c];
  const actorRole = mode === 'single' ? 'host' : myRole;
  if (!piece || piece.owner !== actorRole) {
    selectedCell = null;
    validMoves = [];
    renderBoard();
    return;
  }

  const mustCapture = hasAnyCaptureForOwner(actorRole, board);
  let moves = getPieceMoves(r, c, board);
  if (mustCapture) {
    moves = moves.filter((m) => Boolean(m.capture));
    if (!moves.length) {
      showToast('Capture කළ හැකි ඉත්තෙකු තෝරන්න!');
      return;
    }
  }

  selectedCell = { r, c };
  validMoves = moves;
  renderBoard();
}

function bindMultiplayerRoom() {
  if (mode !== 'multi' || !db || !roomId) {
    renderBoard();
    return;
  }

  roomRef = db.ref(`rooms_v6/${roomId}`);
  roomRef.on('value', (snap) => {
    const room = snap.val();
    if (!room) return;

    if (room.hostName) hostName = String(room.hostName);
    if (room.guestName) guestName = String(room.guestName);

    if (room.status === 'finished' && room.winner) {
      const winMsg = room.winner === myRole ? 'ඔබ ජයග්‍රහණය කළා!' : 'ප්‍රතිවාදියා ජයග්‍රහණය කළා';
      openResultModal(winMsg, `ඔට්ටුව: ${bet} Coins`, room.winner);
      return;
    }

    if (Array.isArray(room.board)) {
      board = normalizeGrid(room.board);
    }
    if (room.turn === 'host' || room.turn === 'guest') {
      currentTurn = room.turn;
    }

    if (currentTurn === myRole) {
      selectedCell = null;
      validMoves = [];
      forcedPieceKey = null;
    }

    renderBoard();
  });
}

$('leaveBtn').onclick = () => {
  if (roomRef) { try { roomRef.off(); } catch (_) {} }
  window.location.href = mode === 'multi' ? `mulitiplay.html?bet=${encodeURIComponent(bet)}` : 'index.html';
};

$('forfeitBtn').onclick = async () => {
  if (matchFinished) return;
  const winnerRole = mode === 'single' ? 'guest' : (myRole === 'host' ? 'guest' : 'host');
  if (mode === 'multi' && db && roomId) {
    await db.ref(`rooms_v6/${roomId}`).update({ status: 'finished', winner: winnerRole }).catch(() => {});
  }
  openResultModal('ඔබ තරඟය අත්හැරියා', `ඔට්ටුව: ${bet} Coins`, winnerRole);
};

$('playAgainBtn').onclick = async () => {
  matchFinished = false;
  settledForMatch = false;
  board = createInitialBoard();
  currentTurn = 'host';
  selectedCell = null;
  validMoves = [];
  forcedPieceKey = null;
  $('resultModal').classList.remove('show');
  if (mode === 'multi') {
    await syncRoomState({ status: 'active', board, turn: 'host', winner: null });
  }
  renderBoard();
};

$('homeBtn').onclick = () => {
  if (roomRef) { try { roomRef.off(); } catch (_) {} }
  window.location.href = 'index.html';
};

try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.database();
  auth.onAuthStateChanged((u) => {
    fbUser = u;
    if (u && mode === 'multi' && db && roomId) {
      db.ref(`users_v6/${u.uid}/name`).once('value').then((s) => {
        if (s.exists() && s.val()) {
          if (myRole === 'host') hostName = String(s.val());
          else guestName = String(s.val());
          updateHud();
        }
      }).catch(() => {});
    }
  });
} catch (e) {
  console.error('Firebase init error:', e);
}

if (mode === 'multi' && roomId) {
  bindMultiplayerRoom();
} else {
  renderBoard();
}
</script>
</body>
</html>
