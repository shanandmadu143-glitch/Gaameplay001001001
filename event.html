<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monthly Event Pass - Sinhala Draughts Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Orbitron:wght@600;700;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070e;
  --panel:rgba(14,20,38,0.94);
  --card:rgba(21,30,54,0.88);
  --gold:#ffd166;
  --gold-2:#ff9f1c;
  --neon-blue:#00f2fe;
  --neon-green:#2ecc71;
  --purple:#a855f7;
  --red:#ff4757;
  --dim:#9fb0c7;
  --line:rgba(255,209,102,0.24);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Gemunu Libre','Poppins',sans-serif;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 10%, rgba(46,204,113,0.14), transparent 38%),
    radial-gradient(circle at 85% 14%, rgba(168,85,247,0.18), transparent 42%),
    radial-gradient(circle at 50% 90%, rgba(255,209,102,0.13), transparent 48%),
    linear-gradient(180deg, #060913 0%, #04060c 100%);
  color:#f8fafc;
}

.app{
  width:100%;
  max-width:1040px;
  height:100dvh;
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top, 0px) + 10px)
    calc(env(safe-area-inset-right, 0px) + 12px)
    calc(env(safe-area-inset-bottom, 0px) + 10px)
    calc(env(safe-area-inset-left, 0px) + 12px);
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
  opacity:1;
  transform:scale(1);
  transition:opacity 0.16s ease-out,transform 0.16s ease-out;
}
.app.page-leaving{
  opacity:0;
  transform:scale(0.985);
}

.event-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-shrink:0;
  background:rgba(12,18,34,0.82);
  border:1px solid rgba(255,209,102,0.22);
  border-radius:18px;
  padding:8px 10px;
  backdrop-filter:blur(10px);
}

.back-btn{
  width:40px;
  height:40px;
  border-radius:13px;
  border:1.5px solid rgba(255,209,102,0.45);
  background:linear-gradient(135deg,rgba(24,33,62,0.96),rgba(12,17,34,0.96));
  color:var(--gold);
  font-size:1rem;
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,0.45);
  transition:transform 0.12s ease,border-color 0.15s ease;
  flex-shrink:0;
}
.back-btn:active{transform:scale(0.93)}

.event-title-box{
  flex:1;
  min-width:0;
}
.event-title-box b{
  display:block;
  font-family:'Orbitron','Gemunu Libre',sans-serif;
  font-size:clamp(0.82rem, 2.2vw, 1.05rem);
  color:var(--gold);
  letter-spacing:0.4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.event-title-box small{
  display:block;
  font-size:clamp(0.68rem, 1.7vw, 0.78rem);
  color:var(--dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.coin-pill{
  display:flex;
  align-items:center;
  gap:6px;
  border:1.5px solid rgba(255,209,102,0.42);
  border-radius:14px;
  background:rgba(6,10,20,0.92);
  padding:7px 11px;
  color:#fff;
  font-family:'Orbitron','Poppins',sans-serif;
  font-size:clamp(0.74rem, 1.8vw, 0.86rem);
  font-weight:800;
  flex-shrink:0;
}
.coin-pill i{color:var(--gold)}

main{
  flex:1;
  width:100%;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding-bottom:24px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,209,102,0.35) transparent;
}
main::-webkit-scrollbar{width:5px}
main::-webkit-scrollbar-thumb{background:rgba(255,209,102,0.35);border-radius:999px}

.coin-win-hero{
  background:linear-gradient(145deg,rgba(24,34,64,0.96),rgba(12,18,34,0.98));
  border:1.5px solid rgba(255,209,102,0.35);
  border-radius:20px;
  padding:clamp(12px, 2.5vw, 18px);
  box-shadow:0 12px 28px rgba(0,0,0,0.55);
  display:flex;
  flex-direction:column;
  gap:11px;
}

.hero-header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.month-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:10px;
  background:rgba(0,242,254,0.12);
  border:1px solid rgba(0,242,254,0.35);
  color:var(--neon-blue);
  font-size:clamp(0.66rem, 1.6vw, 0.74rem);
  font-weight:800;
}

.days-left-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 10px;
  border-radius:10px;
  background:rgba(255,209,102,0.12);
  border:1px solid rgba(255,209,102,0.35);
  color:var(--gold);
  font-size:clamp(0.66rem, 1.6vw, 0.74rem);
  font-weight:800;
}

.tracks-split-bar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  align-items:stretch;
}

.track-side{
  border-radius:16px;
  padding:10px 11px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:6px;
  min-width:0;
}

.track-side.free-side{
  background:linear-gradient(135deg,rgba(46,204,113,0.15),rgba(13,23,36,0.92));
  border:1.5px solid rgba(46,204,113,0.45);
}

.track-side.pro-side{
  background:linear-gradient(135deg,rgba(168,85,247,0.18),rgba(255,159,28,0.12));
  border:1.5px solid rgba(255,209,102,0.5);
}

.track-side-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}

.track-side b{
  font-family:'Orbitron','Gemunu Libre',sans-serif;
  font-size:clamp(0.7rem, 1.8vw, 0.84rem);
  letter-spacing:0.3px;
}
.free-side b{color:var(--neon-green)}
.pro-side b{color:var(--gold)}

.track-side span{
  font-size:clamp(0.66rem, 1.6vw, 0.76rem);
  color:var(--dim);
  line-height:1.25;
}

.pro-buy-btn{
  margin-top:2px;
  width:100%;
  border:0;
  border-radius:11px;
  padding:8px 8px;
  font-weight:800;
  font-size:clamp(0.68rem, 1.6vw, 0.78rem);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  background:linear-gradient(135deg,#ffe08a,#ff9f1c);
  color:#111;
  box-shadow:0 4px 12px rgba(255,159,28,0.35);
  transition:transform 0.12s ease;
}
.pro-buy-btn:active{transform:scale(0.96)}
.pro-buy-btn.owned{
  background:rgba(46,204,113,0.2);
  color:var(--neon-green);
  border:1px solid rgba(46,204,113,0.45);
  box-shadow:none;
  cursor:default;
}

.center-loading-wrap{
  background:rgba(5,9,18,0.85);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:11px 13px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.loading-stats-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.loading-stats-row .earned-label{
  font-size:clamp(0.72rem, 1.7vw, 0.82rem);
  color:var(--dim);
  font-weight:700;
}

.loading-stats-row .earned-amount{
  font-family:'Orbitron','Poppins',sans-serif;
  font-size:clamp(0.9rem, 2.3vw, 1.12rem);
  font-weight:900;
  color:var(--gold);
}

.loading-stats-row .earned-amount small{
  font-size:clamp(0.66rem, 1.6vw, 0.76rem);
  color:var(--dim);
  font-weight:700;
}

.coin-progress-track{
  position:relative;
  width:100%;
  height:18px;
  border-radius:999px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,209,102,0.3);
  overflow:hidden;
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.8);
}

.coin-progress-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg, var(--neon-green), var(--gold), var(--gold-2));
  box-shadow:0 0 14px rgba(255,209,102,0.55);
  transition:width 0.35s ease;
}

.loading-footer-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:clamp(0.68rem, 1.6vw, 0.76rem);
  color:var(--dim);
}

.milestones-list{
  display:grid;
  grid-template-columns:1fr;
  gap:11px;
}

.milestone-card{
  background:var(--panel);
  border:1.5px solid var(--line);
  border-radius:18px;
  padding:11px;
  display:flex;
  flex-direction:column;
  gap:9px;
  box-shadow:0 8px 20px rgba(0,0,0,0.45);
  min-width:0;
}

.milestone-card.reached{
  border-color:rgba(255,209,102,0.55);
}

.milestone-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.milestone-target{
  font-family:'Orbitron','Poppins',sans-serif;
  font-size:clamp(0.78rem, 2vw, 0.9rem);
  font-weight:900;
  color:#fff;
  display:flex;
  align-items:center;
  gap:6px;
}
.milestone-target i{color:var(--gold)}

.milestone-state{
  font-size:clamp(0.62rem, 1.5vw, 0.7rem);
  font-weight:800;
  padding:3px 8px;
  border-radius:999px;
  white-space:nowrap;
}
.state-unlocked{
  background:rgba(46,204,113,0.16);
  color:var(--neon-green);
  border:1px solid rgba(46,204,113,0.4);
}
.state-locked{
  background:rgba(255,255,255,0.06);
  color:var(--dim);
  border:1px solid rgba(255,255,255,0.12);
}

.reward-lanes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.lane-box{
  border-radius:14px;
  padding:8px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:7px;
  background:rgba(7,11,22,0.76);
  border:1px solid rgba(255,255,255,0.09);
  min-width:0;
}

.lane-box.pro-lane{
  background:linear-gradient(145deg,rgba(168,85,247,0.11),rgba(10,14,26,0.88));
  border-color:rgba(255,209,102,0.28);
}

.lane-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  font-size:clamp(0.62rem, 1.5vw, 0.7rem);
  font-weight:800;
}
.free-tag{color:var(--neon-green)}
.pro-tag{color:var(--gold)}

.reward-items-preview{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.reward-chip{
  display:flex;
  align-items:center;
  gap:7px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  padding:5px 7px;
  min-width:0;
}

.chip-icon-piece,
.chip-icon-av,
.chip-icon-coin{
  width:24px;
  height:24px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:0.78rem;
  flex-shrink:0;
}

.chip-icon-av,
.chip-icon-coin{
  background:rgba(255,209,102,0.15);
  border:1px solid rgba(255,209,102,0.45);
  color:var(--gold);
}

.chip-text{
  min-width:0;
  flex:1;
}
.chip-text b{
  display:block;
  font-size:clamp(0.66rem, 1.6vw, 0.76rem);
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chip-text small{
  display:block;
  font-size:clamp(0.58rem, 1.3vw, 0.65rem);
  color:var(--dim);
}

.claim-btn{
  width:100%;
  min-height:32px;
  border:0;
  border-radius:10px;
  padding:6px 8px;
  font-weight:800;
  font-size:clamp(0.66rem, 1.55vw, 0.75rem);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:transform 0.12s ease;
}
.claim-btn:active{transform:scale(0.96)}
.claim-btn.ready{
  background:linear-gradient(135deg,#ffe08a,#ff9f1c);
  color:#111;
  box-shadow:0 4px 12px rgba(255,159,28,0.3);
}
.claim-btn.claimed{
  background:rgba(46,204,113,0.16);
  color:var(--neon-green);
  border:1px solid rgba(46,204,113,0.35);
  cursor:default;
}
.claim-btn.disabled{
  background:rgba(255,255,255,0.06);
  color:var(--dim);
  cursor:not-allowed;
}

#toast{
  position:fixed;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);
  left:50%;
  transform:translate(-50%,120px);
  opacity:0;
  background:linear-gradient(135deg,#182238,#0b101d);
  border:1.5px solid var(--gold);
  color:#f8f9fa;
  border-radius:30px;
  padding:10px 18px;
  z-index:150;
  transition:transform 0.25s ease,opacity 0.25s ease;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:0.84rem;
  max-width:92vw;
  box-shadow:0 10px 25px rgba(0,0,0,0.65);
}
#toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

@media (min-width: 600px) {
  .app{
    padding:
      calc(env(safe-area-inset-top, 0px) + 16px)
      calc(env(safe-area-inset-right, 0px) + 20px)
      calc(env(safe-area-inset-bottom, 0px) + 16px)
      calc(env(safe-area-inset-left, 0px) + 20px);
    gap:14px;
  }
  .event-top{padding:10px 14px;border-radius:20px}
  .back-btn{width:44px;height:44px;border-radius:14px}
  .tracks-split-bar{gap:14px}
  .track-side{padding:13px 15px}
  .coin-progress-track{height:21px}
  .milestones-list{
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
  }
  .milestone-card{padding:14px;border-radius:20px}
  .reward-lanes{gap:10px}
  .lane-box{padding:10px}
}
</style>
</head>

<div class="app" id="appRoot">
 <div class="event-top">

    <div class="coin-progress-track">

  <section class="milestones-list" id="milestonesContainer"></section>
 </main>
</div>

const COIN_AMOUNTS={
 1000:{free:200,pro:600},
 10000:{free:800,pro:2500},
 30000:{free:1500,pro:4500},
 45000:{free:2200,pro:6500},
 75000:{free:3500,pro:10000},
 100000:{free:5000,pro:15000},
 200000:{free:8000,pro:25000},
 245000:{free:10000,pro:30000},
 545000:{free:18000,pro:55000},
 720000:{free:25000,pro:80000}
};

let auth,db,fbUser,isNavigating=false;
let lastObservedPoints=null;
let lastSyncedMonthlyWon=0;
let user={
 name:'',
 points:500,
 wins:0,
 losses:0,
 uid:null,
 pieceIndex:0,
 unlockedPieces:[0],
 avatarIcon:'fa-user',
 unlockedAvatars:['fa-user'],
 eventSeasonStart:0,
 eventSeasonNumber:1,
 monthlyWonCoins:0,
 hasProPass:false,
 claimedEventRewards:[]
};

function normalizeList(val, fallback) {
 if (Array.isArray(val)) return val.length ? val : fallback;
 if (val && typeof val === 'object') {
  const arr = Object.values(val);
  return arr.length ? arr : fallback;
 }
 return fallback;
}

function toast(s, icon='fa-circle-info'){
 const t=$('toast');
 t.replaceChildren();
 const iconEl=document.createElement('i');iconEl.className=`fa-solid ${icon}`;iconEl.style.color='var(--gold)';
 const textEl=document.createElement('span');textEl.textContent=String(s);
 t.append(iconEl,textEl);
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),3000);
}

function smoothNavigate(url){
 if(isNavigating)return;
 isNavigating=true;
 const app=$('appRoot');
 if(app)app.classList.add('page-leaving');
 setTimeout(()=>{window.location.href=url;},110);
}

function getCurrentSeasonNumber(){
 const now=Date.now();
 const start=Number(user.eventSeasonStart)||now;
 const cycles=Math.floor((now - start) / MONTH_MS);
 return Math.max(1, (Number(user.eventSeasonNumber)||1) + Math.max(0, cycles));
}

function ensureMonthlyCycle(){
 const now=Date.now();
 if(!user.eventSeasonStart){
  user.eventSeasonStart=now;
  user.eventSeasonNumber=Number(user.eventSeasonNumber)||1;
 }
 const elapsed=now - Number(user.eventSeasonStart);
 if(elapsed >= MONTH_MS){
  const completedCycles=Math.floor(elapsed / MONTH_MS);
  user.eventSeasonNumber=(Number(user.eventSeasonNumber)||1) + completedCycles;
  user.eventSeasonStart=Number(user.eventSeasonStart) + (completedCycles * MONTH_MS);
  user.monthlyWonCoins=0;
  lastSyncedMonthlyWon=0;
  user.claimedEventRewards=[];
  toast(`නව දින 30 Event Season #${user.eventSeasonNumber} ආරම්භ විය! නව Rewards සූදානම්.`,'fa-rotate');
 }
}

function buildSeasonMilestones(seasonNum){
 const shift=(Math.max(1, Number(seasonNum)||1) - 1);
 return MILESTONE_TARGETS.map((target, idx)=>{
  const fPieceBase=REWARD_POOLS.freePieces[(idx + shift) % REWARD_POOLS.freePieces.length];
  const pPieceBase=REWARD_POOLS.proPieces[(idx + shift) % REWARD_POOLS.proPieces.length];
  const fAvBase=REWARD_POOLS.freeAvatars[(idx + shift) % REWARD_POOLS.freeAvatars.length];
  const pAvBase=REWARD_POOLS.proAvatars[(idx + shift) % REWARD_POOLS.proAvatars.length];
  const cAmt=COIN_AMOUNTS[target]||{free:500,pro:1500};

  return {
   target,
   free:{
    coins:cAmt.free,
    piece:{
     ...fPieceBase,
     id:`ev_s${seasonNum}_p_${target}_free`,
     name:`${fPieceBase.name} (S${seasonNum})`
    },
    avatar:{
     ...fAvBase,
     id:`${fAvBase.icon}_s${seasonNum}_f`,
     name:`${fAvBase.name} (S${seasonNum})`
    }
   },
   pro:{
    coins:cAmt.pro,
    piece:{
     ...pPieceBase,
     id:`ev_s${seasonNum}_p_${target}_pro`,
     name:`${pPieceBase.name} (S${seasonNum})`
    },
    avatar:{
     ...pAvBase,
     id:`${pAvBase.icon}_s${seasonNum}_p`,
     name:`${pAvBase.name} (S${seasonNum})`
    }
   }
  };
 });
}

function persistEventState(){
 user.points=Math.max(0, Number(user.points)||0);
 user.monthlyWonCoins=Math.max(0, Number(user.monthlyWonCoins)||0);
 lastSyncedMonthlyWon=user.monthlyWonCoins;
 user.eventSeasonNumber=Number(user.eventSeasonNumber)||1;
 user.unlockedPieces=Array.from(new Set(normalizeList(user.unlockedPieces,[0])));
 user.unlockedAvatars=Array.from(new Set(normalizeList(user.unlockedAvatars,['fa-user']).map(String)));
 user.claimedEventRewards=Array.from(new Set(Array.isArray(user.claimedEventRewards)?user.claimedEventRewards:[]));
 localStorage.setItem(KEY,JSON.stringify(user));

 if(db && fbUser){
  const payload={
   points:user.points,
   pieceIndex:user.pieceIndex ?? 0,
   unlockedPieces:user.unlockedPieces,
   avatarIcon:user.avatarIcon||'fa-user',
   unlockedAvatars:user.unlockedAvatars,
   eventSeasonStart:Number(user.eventSeasonStart)||Date.now(),
   eventSeasonNumber:user.eventSeasonNumber,
   monthlyWonCoins:user.monthlyWonCoins,
   hasProPass:Boolean(user.hasProPass),
   claimedEventRewards:user.claimedEventRewards
  };
  db.ref('users_v6/'+fbUser.uid).update(payload).catch(()=>{});
  db.ref('publicProfiles_v6/'+fbUser.uid).update(payload).catch(()=>{});
 }
}

function addEventRewardToShopConfig(type, itemObj){
 if(!db || !itemObj) return;
 const path = type === 'piece' ? 'shopConfig_v6/customPieces' : 'shopConfig_v6/customAvatars';
 db.ref(path).once('value').then(snap=>{
  const val=snap.val();
  const list=Array.isArray(val)?val.filter(Boolean):(val&&typeof val==='object'?Object.values(val).filter(Boolean):[]);
  const exists=list.some(x=>String(x.id)===String(itemObj.id));
  if(!exists){
   list.push({
    ...itemObj,
    price:0,
    isEventReward:true,
    season:user.eventSeasonNumber||1
   });
   db.ref(path).set(list).catch(()=>{});
  }
 }).catch(()=>{});
}

function syncAutoCoinWinFromBalance(newPoints, remoteMonthlyWon=null){
 ensureMonthlyCycle();
 const currentPts=Math.max(0, Number(newPoints)||0);
 let changed=false;

 if(typeof remoteMonthlyWon === 'number' && Number.isFinite(remoteMonthlyWon)){
  if(remoteMonthlyWon > (Number(user.monthlyWonCoins)||0)){
   user.monthlyWonCoins=remoteMonthlyWon;
   changed=true;
  }
 }

 if(lastObservedPoints !== null && currentPts > lastObservedPoints){
  const gained=currentPts - lastObservedPoints;
  user.monthlyWonCoins=(Number(user.monthlyWonCoins)||0) + gained;
  changed=true;
 }

 user.points=currentPts;
 lastObservedPoints=currentPts;

 if(changed){
  persistEventState();
 }
}

function claimMilestoneReward(target, track){
 const seasonNum=Number(user.eventSeasonNumber)||1;
 const milestones=buildSeasonMilestones(seasonNum);
 const m=milestones.find(x=>x.target===target);
 if(!m)return;

 const won=Number(user.monthlyWonCoins)||0;
 if(won < target){
  return toast(`මෙම Reward එකට තව Coins ${(target - won).toLocaleString()}ක් දිනිය යුතුයි!`,'fa-lock');
 }
 if(track === 'pro' && !user.hasProPass){
  return toast('Pro Pass Rewards ලබාගැනීමට Pro Pass (100,000 Coins) මිලදී ගන්න!','fa-crown');
 }

 const claimKey=`s${seasonNum}_${target}_${track}`;
 const claimed=Array.isArray(user.claimedEventRewards)?user.claimedEventRewards:[];
 if(claimed.includes(claimKey)){
  return toast('මෙම ත්‍යාගය දැනටමත් ලබාගෙන ඇත.');
 }

 const rewardData=m[track];
 const bonusCoins=Number(rewardData.coins)||0;

 user.points=(Number(user.points)||0) + bonusCoins;
 lastObservedPoints=user.points;

 if(rewardData.avatar){
  const avId=String(rewardData.avatar.id);
  const uAv=normalizeList(user.unlockedAvatars,['fa-user']).map(String);
  if(!uAv.includes(avId))uAv.push(avId);
  user.unlockedAvatars=uAv;
  addEventRewardToShopConfig('avatar', rewardData.avatar);
 }

 if(rewardData.piece){
  const pId=String(rewardData.piece.id);
  const uP=normalizeList(user.unlockedPieces,[0]).map(String);
  if(!uP.includes(pId))uP.push(pId);
  user.unlockedPieces=uP;
  addEventRewardToShopConfig('piece', rewardData.piece);
 }

 user.claimedEventRewards=[...claimed, claimKey];
 persistEventState();
 renderEventUI();
 toast(`${target.toLocaleString()} (${track.toUpperCase()}) Event Reward ලැබුණි! Profile එකේ පෙන්වයි.`,'fa-trophy');
}

function renderRewardLaneHtml(m, track, seasonNum){
 const data=m[track];
 const won=Number(user.monthlyWonCoins)||0;
 const unlockedMilestone=won >= m.target;
 const proAllowed=(track === 'free') || Boolean(user.hasProPass);
 const claimKey=`s${seasonNum}_${m.target}_${track}`;
 const isClaimed=(user.claimedEventRewards||[]).includes(claimKey);

 let btnClass='claim-btn disabled';
 let btnLabel='<i class="fa-solid fa-lock"></i> Locked';
 if(isClaimed){
  btnClass='claim-btn claimed';
  btnLabel='<i class="fa-solid fa-check"></i> Claimed';
 }else if(unlockedMilestone && proAllowed){
  btnClass='claim-btn ready';
  btnLabel='<i class="fa-solid fa-gift"></i> Claim Reward';
 }else if(unlockedMilestone && !proAllowed){
  btnClass='claim-btn disabled';
  btnLabel='<i class="fa-solid fa-crown"></i> Pro Pass Required';
 }

 const p=data.piece;
 const av=data.avatar;

 return `
  <div class="lane-box ${track==='pro'?'pro-lane':''}">
   <div class="lane-head">
    <span class="${track==='free'?'free-tag':'pro-tag'}">${track==='free'?'FREE NORMAL':'PRO PASS'}</span>
    <span style="color:var(--gold)">+${Number(data.coins||0).toLocaleString()}</span>
   </div>
   <div class="reward-items-preview">
    <div class="reward-chip">
     <div class="chip-icon-coin"><i class="fa-solid fa-coins"></i></div>
     <div class="chip-text">
      <b>+${Number(data.coins||0).toLocaleString()} Coins</b>
      <small>Bonus Coins</small>
     </div>
    </div>
    <div class="reward-chip">
     <div class="chip-icon-piece" style="background:${p.bg};border:1.5px solid ${p.border};color:${p.color}">${p.icon}</div>
     <div class="chip-text">
      <b>${p.name}</b>
      <small>Piece Theme</small>
     </div>
    </div>
    <div class="reward-chip">
     <div class="chip-icon-av"><i class="fa-solid ${av.icon}"></i></div>
     <div class="chip-text">
      <b>${av.name}</b>
      <small>Profile Avatar</small>
     </div>
    </div>
   </div>
   <button type="button" class="${btnClass}" onclick="claimMilestoneReward(${m.target}, '${track}')">${btnLabel}</button>
  </div>
 `;
}

function renderEventUI(){
 ensureMonthlyCycle();
 const seasonNum=Number(user.eventSeasonNumber)||1;
 const milestones=buildSeasonMilestones(seasonNum);
 const won=Math.max(0, Number(user.monthlyWonCoins)||0);
 const maxTarget=milestones[milestones.length-1].target;
 const pct=Math.min(100, Math.round((won / maxTarget) * 1000) / 10);
 const elapsed=Date.now() - (Number(user.eventSeasonStart)||Date.now());
 const daysRem=Math.max(1, Math.ceil((MONTH_MS - elapsed) / (24*60*60*1000)));

 $('seasonTitle').textContent=`MONTHLY COIN EVENT · SEASON ${seasonNum}`;
 $('seasonCycleBadge').innerHTML=`<i class="fa-solid fa-rotate"></i> SEASON #${seasonNum} (30 DAYS)`;
 $('userCoinBalance').textContent=(Number(user.points)||0).toLocaleString();
 $('seasonDaysLeft').innerHTML=`<i class="fa-solid fa-hourglass-half"></i> දින ${daysRem}ක් ඉතිරියි`;
 $('monthlyEarnedDisplay').innerHTML=`${won.toLocaleString()} <small>/ ${maxTarget.toLocaleString()}</small>`;
 $('coinProgressFill').style.width=`${pct}%`;
 $('progressPercentText').textContent=`${pct}% Completed`;

 const proBtn=$('buyProPassBtn');
 if(user.hasProPass){
  proBtn.className='pro-buy-btn owned';
  proBtn.innerHTML='<i class="fa-solid fa-circle-check"></i> Pro Pass Active';
  proBtn.onclick=null;
 }else{
  proBtn.className='pro-buy-btn';
  proBtn.innerHTML='<i class="fa-solid fa-crown"></i> Buy Pro (100,000)';
  proBtn.onclick=()=>{
   const bal=Number(user.points)||0;
   if(bal < PRO_PASS_PRICE){
    return toast(`Pro Pass මිලදී ගැනීමට Coins ${PRO_PASS_PRICE.toLocaleString()}ක් අවශ්‍යයි!`,'fa-coins');
   }
   user.points=bal - PRO_PASS_PRICE;
   lastObservedPoints=user.points;
   user.hasProPass=true;
   persistEventState();
   renderEventUI();
   toast('Pro Pass සාර්ථකව සක්‍රිය කරන ලදී!','fa-crown');
  };
 }

 const container=$('milestonesContainer');
 container.innerHTML='';
 milestones.forEach(m=>{
  const reached=won >= m.target;
  const card=document.createElement('div');
  card.className='milestone-card'+(reached?' reached':'');
  card.innerHTML=`
   <div class="milestone-top">
    <div class="milestone-target"><i class="fa-solid fa-coins"></i> ${m.target.toLocaleString()} Coins Win</div>
    <span class="milestone-state ${reached?'state-unlocked':'state-locked'}">${reached?'UNLOCKED':'TARGET '+m.target.toLocaleString()}</span>
   </div>
   <div class="reward-lanes">
    ${renderRewardLaneHtml(m, 'free', seasonNum)}
    ${renderRewardLaneHtml(m, 'pro', seasonNum)}
   </div>
  `;
  container.appendChild(card);
 });
}

$('backHomeBtn').onclick=()=>smoothNavigate('index.html');

window.addEventListener('storage', e=>{
 if(e.key === KEY && e.newValue){
  try{
   const next=JSON.parse(e.newValue);
   if(next && typeof next === 'object'){
    const nextPts=Number.isFinite(Number(next.points))?Number(next.points):(Number(user.points)||0);
    const nextWon=Number.isFinite(Number(next.monthlyWonCoins))?Number(next.monthlyWonCoins):null;
    user={...user,...next};
    syncAutoCoinWinFromBalance(nextPts, nextWon);
    renderEventUI();
   }
  }catch(_){}
 }
});

try{
 const cached=localStorage.getItem(KEY);
 if(cached){
  const parsed=JSON.parse(cached);
  if(parsed&&typeof parsed==='object'){
   user={...user,...parsed};
  }
 }
}catch(e){}
ensureMonthlyCycle();
lastObservedPoints=Number(user.points)||0;
lastSyncedMonthlyWon=Number(user.monthlyWonCoins)||0;
localStorage.setItem(KEY,JSON.stringify(user));
renderEventUI();

try{
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();
 db=firebase.database();
}catch(e){console.error('Firebase init error:',e);}

if(auth && db){
 auth.onAuthStateChanged(async u=>{
  fbUser=u||null;
  if(!u)return;
  db.ref('users_v6/'+u.uid).on('value',snap=>{
   const d=snap.val();
   if(!d)return;
   const incomingPts=Number.isFinite(Number(d.points))?Number(d.points):(Number(user.points)||0);
   const incomingWon=Number.isFinite(Number(d.monthlyWonCoins))?Number(d.monthlyWonCoins):null;
   user={
    ...user,
    ...d,
    uid:u.uid,
    points:incomingPts,
    monthlyWonCoins:Math.max(Number(user.monthlyWonCoins)||0, Number(d.monthlyWonCoins)||0),
    eventSeasonStart:Number(d.eventSeasonStart)||user.eventSeasonStart||Date.now(),
    eventSeasonNumber:Number(d.eventSeasonNumber)||user.eventSeasonNumber||1,
    hasProPass:Boolean(d.hasProPass),
    claimedEventRewards:Array.isArray(d.claimedEventRewards)?d.claimedEventRewards:[],
    unlockedPieces:normalizeList(d.unlockedPieces,[0]),
    unlockedAvatars:normalizeList(d.unlockedAvatars,['fa-user']).map(String)
   };
   syncAutoCoinWinFromBalance(incomingPts, incomingWon);
   localStorage.setItem(KEY,JSON.stringify(user));
   renderEventUI();
  });
 });
}
</script>
