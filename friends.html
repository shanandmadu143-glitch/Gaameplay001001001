<style>
:root{
  --bg:#05070e;
  --panel:rgba(14,20,38,0.94);

*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;

  color:#f8f9fa;overflow:hidden;
}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center}

.app{
  width:100%;height:100dvh;max-width:768px;margin:0 auto;padding:12px;

  position:relative;overflow:hidden;

.top-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:10px 14px;border-radius:20px;
  background:linear-gradient(135deg,rgba(22,30,56,0.95),rgba(10,14,28,0.95));

}
.top-header h1{font-size:1.08rem;color:var(--gold);font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bet-chip{

  background:rgba(46,204,113,0.16);border:1.5px solid rgba(46,204,113,0.55);
  font-weight:800;font-size:0.82rem;color:var(--neon-green);white-space:nowrap;
}
.bet-chip.show{display:flex}
.clear-bet-btn{
  border:0;background:transparent;color:#fff;font-size:0.82rem;cursor:pointer;padding:0 2px;
}
.coin-chip{
  display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  background:rgba(5,8,18,0.85);border:1.5px solid rgba(255,209,102,0.4);
  font-weight:800;font-size:0.86rem;color:#fff;white-space:nowrap;
}
.coin-chip i{color:var(--gold)}

.search-box{
  display:flex;gap:8px;align-items:center;

.search-box input{

.friends-list{

}

.friend-card{
  display:flex;align-items:center;justify-content:space-between;gap:10px;

}
.friend-card:hover{border-color:var(--gold);background:rgba(255,255,255,0.08)}

.friend-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.friend-avatar{

.friend-sub{font-size:0.78rem;color:var(--dim);display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}

.call-notif-banner{

.call-notif-banner.show{transform:translate(-50%,0)}
.call-notif-top{display:flex;align-items:center;gap:12px}
.call-notif-pulse{
  width:42px;height:42px;border-radius:50%;

  color:var(--neon-green);display:grid;place-items:center;font-size:1.2rem;
  animation:callPulse 1.1s infinite ease-in-out;flex-shrink:0;
}
@keyframes callPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}
.call-notif-title{font-weight:800;font-size:1rem;color:#fff}
.call-notif-sub{font-size:0.82rem;color:var(--neon-green);font-weight:700}
.call-notif-actions{display:flex;gap:10px}
.btn-notif-accept,.btn-notif-reject{

.btn-notif-accept{background:linear-gradient(135deg,#2ecc71,#20b863);color:#08160d}
.btn-notif-reject{background:linear-gradient(135deg,#ff4757,#d63031);color:#fff}

.modal{

.modal.show{display:grid}

.p-name{font-size:1.35rem;font-weight:800;color:#fff}

.stats-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.stat-box{

  border-radius:14px;padding:10px;text-align:center;
}
.stat-box span{display:block;font-size:0.78rem;color:var(--dim)}

.action-btn-row{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn-call,.btn-msg,.btn-close{

.btn-call:active,.btn-msg:active,.btn-close:active{transform:scale(0.96)}
.btn-call{background:linear-gradient(135deg,#2ecc71,#20b863);color:#08160d;box-shadow:0 5px 16px rgba(46,204,113,0.35)}
.btn-msg{background:linear-gradient(135deg,#00f2fe,#0984e3);color:#06131f;box-shadow:0 5px 16px rgba(0,242,254,0.3)}
.btn-close{width:100%;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)}

.bottom-nav{

.nav-item{

#toast{

  transition:0.25s ease;font-weight:600;font-size:0.88rem;max-width:90vw;text-align:center;

#toast.show{transform:translate(-50%,0);opacity:1}
</style>

<script>
'use strict';
const firebaseConfig={apiKey:"AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",authDomain:"bin-card-42614.firebaseapp.com",databaseURL:"https://bin-card-42614-default-rtdb.firebaseio.com",projectId:"bin-card-42614",storageBucket:"bin-card-42614.firebasestorage.app",messagingSenderId:"1063550230753",appId:"1:1063550230753:web:1ad8306405e709ac5b17a0"};
const USER_KEY='sinhala_draughts_v7_user';
const $=id=>document.getElementById(id);

function getBetPointsFromContext(){
 const params=new URLSearchParams(window.location.search);
 const qBet=Number(params.get('bet'));
 if(Number.isFinite(qBet) && qBet > 0){
  sessionStorage.setItem('sinhala_draughts_bet',String(Math.floor(qBet)));
  sessionStorage.setItem('sinhala_draughts_bet_active','1');
  return Math.floor(qBet);
 }
 const active=sessionStorage.getItem('sinhala_draughts_bet_active')==='1';
 const saved=Number(sessionStorage.getItem('sinhala_draughts_bet')||0);
 return (active && Number.isFinite(saved) && saved > 0) ? Math.floor(saved) : 0;
}

let currentBetPoints=getBetPointsFromContext();

function syncBetChipUI(){
 const chip=$('activeBetChip');
 if(currentBetPoints > 0){
  $('activeBetVal').textContent=String(currentBetPoints);
  chip.classList.add('show');
 }else{
  chip.classList.remove('show');
 }
}
syncBetChipUI();

$('clearBetModeBtn').onclick=()=>{
 currentBetPoints=0;
 sessionStorage.setItem('sinhala_draughts_bet_active','0');
 syncBetChipUI();
 renderFriendsList();
 toast('Invite Mode ඉවත් කර Profile Mode වෙත මාරු විය.');
};

let auth,db,fbUser;
let cachedLocalUser=null;
try{
 cachedLocalUser=JSON.parse(localStorage.getItem(USER_KEY)||'null');
 if(cachedLocalUser && Number.isFinite(Number(cachedLocalUser.points))){
  $('myPoints').textContent=String(Number(cachedLocalUser.points));
 }
}catch(_){}

let allProfiles={};
let allStatuses={};
let selectedPlayer=null;
let pendingIncomingCall=null;
let callListenerRef=null;
let callListenerFn=null;
let ringtoneTimer=null;
let isSendingInvite=false;

function toast(msg){
 const t=$('toast');
 t.textContent=String(msg);
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),3200);
}

async function ensureAuthenticatedUser(){
 if(auth && auth.currentUser){
  fbUser=auth.currentUser;
  return fbUser;
 }
 if(auth && typeof auth.signInAnonymously === 'function'){
  try{
   const cred=await auth.signInAnonymously();
   if(cred && cred.user){
    fbUser=cred.user;
    return fbUser;
   }
  }catch(_){}
 }
 return fbUser || null;
}

function playRingTone(){
 try{
  const AudioCtx=window.AudioContext || window.webkitAudioContext;
  if(!AudioCtx)return;
  const ctx=new AudioCtx();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(740, ctx.currentTime);
  gain.gain.setValueAtTime(0.08, ctx.currentTime);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.25);
 }catch(_){}
}

function startIncomingRingtone(){
 stopIncomingRingtone();
 playRingTone();
 ringtoneTimer=setInterval(playRingTone, 1400);
}

function stopIncomingRingtone(){
 if(ringtoneTimer){
  clearInterval(ringtoneTimer);
  ringtoneTimer=null;
 }
}

function showIncomingCallNotification(callData){
 pendingIncomingCall=callData;
 $('incomingCallTitle').textContent=`${callData.fromName || 'ක්‍රීඩකයා'} Call කරයි`;
 $('incomingCallSub').textContent='Voice Call ලබා ගැනීමට Call ගන්න ඔබන්න';
 $('incomingCallNotif').classList.add('show');
 startIncomingRingtone();

 if('Notification' in window){
  if(Notification.permission === 'granted'){
   try{
    new Notification(`Incoming Call - ${callData.fromName || 'Player'}`,{
     body:'Voice Call එකක් පැමිණේ. Call ගැනීමට app එක විවෘත කරන්න.'
    });
   }catch(_){}
  }else if(Notification.permission === 'default'){
   Notification.requestPermission().catch(()=>{});
  }
 }
}

function hideIncomingCallNotification(){
 pendingIncomingCall=null;
 $('incomingCallNotif').classList.remove('show');
 stopIncomingRingtone();
}

$('notifAcceptCallBtn').onclick=()=>{
 if(!pendingIncomingCall)return;
 const call=pendingIncomingCall;
 hideIncomingCallNotification();
 const q=new URLSearchParams({
  incoming:'1',
  callId:call.callId || '',
  uid:call.fromUid || '',
  name:call.fromName || 'Player'
 }).toString();
 window.location.href=`Callfriend.html?${q}`;
};

$('notifRejectCallBtn').onclick=async()=>{
 const activeUser=await ensureAuthenticatedUser();
 if(!pendingIncomingCall || !activeUser || !db)return;
 const call=pendingIncomingCall;
 hideIncomingCallNotification();
 if(call.callId){
  await db.ref(`calls_v6/${activeUser.uid}/${call.callId}`).update({status:'rejected'}).catch(()=>{});
 }
 toast('Call එක ප්‍රතික්ෂේප කරන ලදී.');
};

async function sendGameInviteToFriend(uid, profileData, btnEl){
 if(isSendingInvite)return;
 if(!db){
  return toast('Database සම්බන්ධතාවය නොමැත.');
 }
 isSendingInvite=true;
 if(btnEl) btnEl.disabled=true;

 const activeUser=await ensureAuthenticatedUser();
 if(!activeUser || !activeUser.uid){
  isSendingInvite=false;
  if(btnEl) btnEl.disabled=false;
  return toast('ගිණුමට ඇතුළු වී නොමැත. කරුණාකර Login වන්න.');
 }
 if(uid === activeUser.uid){
  isSendingInvite=false;
  if(btnEl) btnEl.disabled=false;
  return toast('ඔබටම Invite යැවිය නොහැක.');
 }

 const betToUse=currentBetPoints > 0 ? currentBetPoints : 50;
 const myName=(cachedLocalUser && cachedLocalUser.name) || activeUser.displayName || (activeUser.email||'').split('@')[0] || 'Host';
 const guestName=profileData.name || 'Guest';
 const roomId=`room_${activeUser.uid}_${uid}_${Date.now()}`;
 const inviteId=`inv_${activeUser.uid}_${Date.now()}`;

 try{
  await db.ref(`rooms_v6/${roomId}`).set({
   roomId,
   hostUid:activeUser.uid,
   hostName:myName,
   guestUid:uid,
   guestName,
   bet:betToUse,
   status:'waiting',
   matchStarted:false,
   createdAt:Date.now()
  });

  await db.ref(`invites_v6/${uid}/${inviteId}`).set({
   fromUid:activeUser.uid,
   fromName:myName,
   bet:betToUse,
   roomId,
   status:'pending',
   createdAt:Date.now()
  });

  await db.ref('fcmPushQueue_v6').push({
   targetUid:uid,
   title:'ශ්‍රී ලංකීය දාම් - Multiplayer Invite',
   body:`${myName} ඔබට ${betToUse} Coins ඔට්ටුවකට ආරාධනා කරයි!`,
   url:`arena.html?mode=multi&bet=${encodeURIComponent(betToUse)}&roomId=${encodeURIComponent(roomId)}`,
   roomId,
   bet:betToUse,
   createdAt:Date.now()
  }).catch(()=>{});

  sessionStorage.setItem('sinhala_draughts_bet',String(betToUse));
  sessionStorage.setItem('sinhala_draughts_multi_room',JSON.stringify({
   roomId,
   role:'host',
   bet:betToUse,
   hostUid:activeUser.uid,
   guestUid:uid,
   hostName:myName,
   guestName,
   startedAt:Date.now()
  }));

  toast(`${guestName} වෙත Invite එක යවන ලදී!`);
  const q=new URLSearchParams({
   mode:'multi',
   bet:String(betToUse),
   roomId,
   role:'host'
  }).toString();
  window.location.href=`arena.html?${q}`;
 }catch(err){
  console.error('Invite error:',err);
  isSendingInvite=false;
  if(btnEl) btnEl.disabled=false;
  toast(`Invite යැවීමට නොහැකි විය: ${err.message || err.code || 'Permission denied'}`);
 }
}

function renderFriendsList(){
 const activeUser=fbUser || (auth && auth.currentUser) || null;
 const q=String($('searchFriendInput').value||'').trim().toLowerCase();
 const listEl=$('friendsList');
 listEl.replaceChildren();

 const isInviteMode=currentBetPoints > 0;

 const entries=Object.entries(allProfiles)
  .filter(([uid, p])=>p && uid !== (activeUser && activeUser.uid))
  .filter(([uid, p])=>{
   if(!q)return true;
   return String(p.name||'').toLowerCase().includes(q);
  });

 if(!entries.length){
  const empty=document.createElement('div');
  empty.style.cssText='text-align:center;padding:24px;color:var(--dim)';
  empty.textContent='ක්‍රීඩකයන් හමු නොවීය.';
  listEl.appendChild(empty);
  return;
 }

 entries.forEach(([uid, p])=>{
  const isOnline=Boolean(allStatuses[uid] && allStatuses[uid].state === 'online');
  const card=document.createElement('div');
  card.className='friend-card';

  const left=document.createElement('div');
  left.className='friend-left';

  const av=document.createElement('div');
  av.className='friend-avatar';
  const avIcon=document.createElement('i');
  avIcon.className=`fa-solid ${String(p.avatarIcon||'fa-user').replace(/^fa-solid\s+/,'')}`;
  av.appendChild(avIcon);

  const info=document.createElement('div');
  info.className='friend-info';

  const nameEl=document.createElement('div');
  nameEl.className='friend-name';
  nameEl.textContent=p.name || 'Player';

  const sub=document.createElement('div');
  sub.className='friend-sub';

  const stSpan=document.createElement('span');
  stSpan.className=isOnline ? 'dot-online' : 'dot-offline';
  stSpan.textContent=isOnline ? '● Online' : '● Offline';

  const ptsSpan=document.createElement('span');
  ptsSpan.textContent=`Points: ${Number(p.points)||0}`;

  sub.append(stSpan,ptsSpan);
  info.append(nameEl,sub);
  left.append(av,info);

  const viewBtn=document.createElement('button');
  viewBtn.type='button';
  viewBtn.className=isInviteMode ? 'btn-view invite-mode' : 'btn-view';
  viewBtn.textContent=isInviteMode ? `Invite (${currentBetPoints})` : 'Profile';

  viewBtn.onclick=e=>{
   e.stopPropagation();
   if(isInviteMode){
    sendGameInviteToFriend(uid, p, viewBtn);
   }else{
    openPlayerProfileModal(uid, p, isOnline);
   }
  };

  card.append(left,viewBtn);
  card.onclick=()=>openPlayerProfileModal(uid, p, isOnline);
  listEl.appendChild(card);
 });
}

function openPlayerProfileModal(uid, profileData, isOnline){
 selectedPlayer={
  uid,
  name:profileData.name || 'Player',
  points:Number(profileData.points)||0,
  wins:Number(profileData.wins)||0,
  losses:Number(profileData.losses)||0,
  avatarIcon:profileData.avatarIcon||'fa-user',
  isOnline:Boolean(isOnline)
 };

 $('modalPlayerName').textContent=selectedPlayer.name;
 $('modalPlayerStatus').textContent=selectedPlayer.isOnline ? 'Online' : 'Offline';
 $('modalPlayerStatus').style.color=selectedPlayer.isOnline ? 'var(--neon-green)' : 'var(--dim)';
 $('modalWins').textContent=String(selectedPlayer.wins);
 $('modalLosses').textContent=String(selectedPlayer.losses);
 $('modalMatches').textContent=String(selectedPlayer.wins + selectedPlayer.losses);
 $('modalPoints').textContent=String(selectedPlayer.points);
 $('modalAvatarIcon').className=`fa-solid ${String(selectedPlayer.avatarIcon||'fa-user').replace(/^fa-solid\s+/,'')}`;

 $('playerProfileModal').classList.add('show');
}

$('closeProfileModalBtn').onclick=()=>$('playerProfileModal').classList.remove('show');

$('modalCallBtn').onclick=()=>{
 if(!selectedPlayer || !selectedPlayer.uid){
  return toast('ක්‍රීඩකයෙකු තෝරා ගන්න.');
 }
 const query=new URLSearchParams({
  uid:selectedPlayer.uid,
  name:selectedPlayer.name
 }).toString();
 window.location.href=`Callfriend.html?${query}`;
};

$('modalMessageBtn').onclick=async()=>{
 const activeUser=await ensureAuthenticatedUser();
 if(!selectedPlayer || !selectedPlayer.uid || !activeUser || !db){
  return toast('Message යැවීමට ගිණුමට ඇතුළු වන්න.');
 }
 const text=window.prompt(`${selectedPlayer.name} වෙත යැවීමට Message එක ලියන්න:`);
 if(!text || !text.trim())return;
 const cleanText=text.trim().slice(0,500);
 const now=Date.now();
 const myName=(cachedLocalUser && cachedLocalUser.name) || activeUser.displayName || (activeUser.email||'').split('@')[0] || 'Player';
 const payload={
  fromUid:activeUser.uid,
  fromName:myName,
  fromAvatar:'fa-user',
  toUid:selectedPlayer.uid,
  toName:selectedPlayer.name,
  text:cleanText,
  read:false,
  timestamp:now
 };
 try{
  await db.ref('inbox_v6/'+selectedPlayer.uid).push().set(payload);
  await db.ref('sent_inbox_v6/'+activeUser.uid).push().set({...payload, read:true});
  toast(`${selectedPlayer.name} වෙත Message එක යවන ලදී!`);
 }catch(e){
  toast('Message යැවීමට නොහැකි විය.');
 }
};

$('searchFriendInput').addEventListener('input',renderFriendsList);

function attachCallNotificationListener(myUid){
 if(!db || !myUid)return;
 if(callListenerRef && callListenerFn){
  try{callListenerRef.off('child_added',callListenerFn);}catch(_){}
 }
 const startTs=Date.now() - 5000;
 callListenerRef=db.ref('calls_v6/'+myUid);
 callListenerFn=snap=>{
  const call=snap.val();
  if(!call || call.status !== 'calling' || !call.callId)return;
  if(call.timestamp && Number(call.timestamp) < startTs)return;
  showIncomingCallNotification(call);
 };
 callListenerRef.on('child_added',callListenerFn);
}

try{
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();
 db=firebase.database();

 db.ref('publicProfiles_v6').on('value',snap=>{
  allProfiles=snap.val()||{};
  renderFriendsList();
 });

 db.ref('status_v6').on('value',snap=>{
  allStatuses=snap.val()||{};
  renderFriendsList();
 });

 auth.onAuthStateChanged(async u=>{
  fbUser=u;
  if(!u){
   await ensureAuthenticatedUser();
   return;
  }

  attachCallNotificationListener(u.uid);

  db.ref('users_v6/'+u.uid+'/points').on('value',snap=>{
   if(snap.exists()){
    $('myPoints').textContent=String(Number(snap.val())||0);
   }
  });
  renderFriendsList();
 });
}catch(e){
 console.error('Friends init error:',e);
 toast('Firebase සම්බන්ධතාවය අසාර්ථකයි.');
}
</script>
</body>
</html>
