<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ශ්‍රී ලංකීය දාම් - Inbox</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070e;--panel:rgba(14,20,38,.94);--gold:#ffd166;--neon-blue:#00f2fe;--neon-green:#2ecc71;--red:#ff4757;--dim:#a0aec0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:radial-gradient(circle at 50% 15%,rgba(255,159,28,0.2) 0%,rgba(42,20,76,0.9) 38%,#080c1c 72%,#03050a 100%);color:#f8f9fa;overflow:hidden}
body{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center}

.msg-notif-banner{
 position:fixed;top:14px;left:50%;transform:translate3d(-50%,-150%,0);
 width:min(92vw,440px);background:linear-gradient(135deg,#182442,#0c1324);
 border:2px solid var(--gold);border-radius:18px;padding:11px 14px;
 display:flex;align-items:center;gap:11px;z-index:250;
 box-shadow:0 12px 28px rgba(0,0,0,0.75);cursor:pointer;
 transition:transform .28s cubic-bezier(0.22,1,0.36,1);opacity:0
}
.msg-notif-banner.show{transform:translate3d(-50%,0,0);opacity:1}
.msg-notif-icon{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffe08a,#ff9f1c);color:#111;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}
.msg-notif-body{flex:1;min-width:0}
.msg-notif-body b{display:block;font-size:0.95rem;color:var(--gold)}
.msg-notif-body p{font-size:0.82rem;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.app{width:100%;height:100dvh;max-width:768px;margin:0 auto;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2;overflow:hidden}

.home-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:linear-gradient(135deg,rgba(30,41,78,0.96),rgba(10,14,28,0.97));border:2px solid rgba(255,209,102,0.55);border-radius:22px}
.profile-float{display:flex;align-items:center;gap:12px;cursor:pointer}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffe08a,#ffb52e);color:#18213e;font-size:1.35rem;border:2px solid #ffd166}
#headerName{font-size:1.12rem;color:#fff;font-weight:800}
.coin-pill{display:flex;align-items:center;gap:6px;border:1.5px solid rgba(255,209,102,0.5);border-radius:20px;background:rgba(5,8,18,0.92);padding:4px 10px}
.coin-pill>i{color:var(--gold)}
.coin-pill b{color:#fff}

main{flex:1;display:flex;flex-direction:column;width:100%;margin:8px 0;overflow:hidden}
.inbox-panel{width:100%;height:100%;display:flex;flex-direction:column;gap:10px;padding:14px;background:linear-gradient(145deg,rgba(19,26,48,0.94),rgba(10,14,26,0.97));border:2px solid rgba(255,209,102,0.34);border-radius:24px;overflow:hidden}
.inbox-top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inbox-top-bar h2{color:var(--gold);font-size:1.2rem}
.storage-pill{font-size:0.75rem;color:var(--neon-blue);background:rgba(0,242,254,0.1);border:1px solid rgba(0,242,254,0.35);padding:3px 9px;border-radius:999px;font-weight:700}

.chat-stream{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px;background:rgba(0,0,0,0.28);border-radius:16px}
.bubble{max-width:82%;padding:9px 13px;border-radius:14px;font-size:0.9rem;word-break:break-word}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,rgba(46,204,113,0.3),rgba(20,110,65,0.45));border:1px solid rgba(46,204,113,0.55)}
.bubble.them{align-self:flex-start;background:rgba(255,255,255,0.09);border:1px solid rgba(255,209,102,0.25)}
.bubble small{display:block;font-size:0.7rem;color:var(--gold);margin-bottom:2px}

.send-bar{display:flex;gap:8px}
input{flex:1;padding:10px 14px;background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,209,102,0.4);border-radius:12px;color:white;font-size:0.95rem;outline:none}
.btn-gold,.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111}
.btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)}

.floating-inbox-btn{
 position:fixed;right:20px;bottom:92px;width:54px;height:54px;border-radius:50%;
 border:2px solid var(--gold);background:linear-gradient(135deg,#ffd166,#ff9f1c);
 color:#131a2e;font-size:1.35rem;display:grid;place-items:center;cursor:pointer;
 z-index:95;box-shadow:0 8px 22px rgba(0,0,0,0.65)
}
.floating-badge{
 position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;
 border-radius:999px;background:var(--red);color:#fff;font-size:0.7rem;font-weight:800;
 display:none;place-items:center;border:1.5px solid #fff
}
.floating-badge.show{display:grid}

.popup-inbox-modal{
 position:fixed;inset:0;background:rgba(3,5,12,0.82);display:none;place-items:center;z-index:160;padding:15px
}
.popup-inbox-modal.show{display:grid}
.popup-inbox-box{
 width:min(100%,420px);max-height:78vh;background:linear-gradient(145deg,#121828,#1b243f);
 border:2px solid var(--gold);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;
 box-shadow:0 16px 36px rgba(0,0,0,0.85)
}
.popup-inbox-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1}
.sender-item{
 padding:10px 12px;border-radius:14px;background:rgba(255,255,255,0.05);
 border:1px solid rgba(255,209,102,0.25);cursor:pointer;display:flex;flex-direction:column;gap:3px
}
.sender-item:hover{border-color:var(--gold);background:rgba(255,209,102,0.1)}
.sender-item b{color:var(--gold);font-size:0.95rem}
.sender-item p{color:#e2e8f0;font-size:0.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bottom-nav{width:100%;min-height:66px;background:rgba(14,20,38,0.97);border:2px solid rgba(255,209,102,0.38);border-radius:24px;display:flex;align-items:center;justify-content:space-around;padding:6px 4px}
.nav-item{background:none;border:0;color:#aab4c7;text-decoration:none;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:0.72rem;font-weight:700;cursor:pointer}
.nav-item i{font-size:1.3rem}
.nav-item.active{color:var(--gold)}
</style>
</head>
<body>

<div class="msg-notif-banner" id="msgNotifBanner" role="alert">
 <div class="msg-notif-icon"><i class="fa-solid fa-envelope"></i></div>
 <div class="msg-notif-body">
  <b id="notifSenderName">ක්‍රීඩකයා</b>
  <p id="notifMessageText">නව පණිවිඩයක් ලැබුණි</p>
 </div>
</div>

<div class="app">
 <div class="home-top">
  <div class="profile-float" onclick="window.location.href='profile.html'">
   <span class="avatar"><i class="fa-solid fa-user"></i></span>
   <div><b id="headerName">ක්‍රීඩකයා</b></div>
  </div>
  <div class="coin-pill"><i class="fa-solid fa-coins"></i><b><span id="points">500</span></b></div>
 </div>

 <main>
  <section class="inbox-panel">
   <div class="inbox-top-bar">
    <h2 id="chatWithTitle"><i class="fa-solid fa-inbox"></i> Messages Inbox</h2>
    <span class="storage-pill" id="inboxSizeBadge">0.00 / 2.00 MB</span>
   </div>
   <div class="chat-stream" id="chatStream"></div>
   <div class="send-bar">
    <input id="msgInput" placeholder="පණිවිඩයක් ලියන්න..." autocomplete="off">
    <button class="btn-gold" id="sendMsgBtn"><i class="fa-solid fa-paper-plane"></i></button>
   </div>
  </section>
 </main>

 <button class="floating-inbox-btn" id="openPopupInboxBtn" title="Popup Inbox">
  <i class="fa-solid fa-envelope-open-text"></i>
  <span class="floating-badge" id="popupInboxBadge">0</span>
 </button>

 <footer class="bottom-nav">
  <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a class="nav-item" href="friends.html"><i class="fa-solid fa-user-group"></i><span>Friends</span></a>
  <a class="nav-item" href="profile.html"><i class="fa-solid fa-circle-user"></i><span>Profile</span></a>
  <a class="nav-item" href="event.html"><i class="fa-solid fa-trophy"></i><span>Events</span></a>
  <a class="nav-item" href="shopandreward.html"><i class="fa-solid fa-cart-shopping"></i><span>Shop</span></a>
 </footer>
</div>

<div class="popup-inbox-modal" id="popupInboxModal" role="dialog" aria-modal="true">
 <div class="popup-inbox-box">
  <div style="display:flex;justify-content:space-between;align-items:center">
   <h3 style="color:var(--gold)">ක්‍රීඩකයන් එවන Messages (Max 2MB)</h3>
   <button class="btn" id="closePopupInboxBtn" style="padding:5px 10px">✕</button>
  </div>
  <div class="popup-inbox-list" id="popupInboxList">
   <small style="color:var(--dim);text-align:center">Messages පරීක්ෂා කරමින්...</small>
  </div>
 </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
'use strict';
const firebaseConfig={apiKey:"AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",authDomain:"bin-card-42614.firebaseapp.com",databaseURL:"https://bin-card-42614-default-rtdb.firebaseio.com",projectId:"bin-card-42614",storageBucket:"bin-card-42614.firebasestorage.app",messagingSenderId:"1063550230753",appId:"1:1063550230753:web:1ad8306405e709ac5b17a0"};
const $=id=>document.getElementById(id),KEY='sinhala_draughts_v7_user';
const MAX_INBOX_BYTES = 2 * 1024 * 1024; // 2MB limit for received messages

let auth,db,fbUser,notifTimer=null,unreadCount=0,isPruning=false;
let user={name:'ක්‍රීඩකයා',points:500,uid:null};
let activePeerUid='';
let activePeerName='';
let allIncomingMessages=[];

function getRecordBytes(val){
 try{
  return new Blob([JSON.stringify(val||{})]).size;
 }catch(_){
  return String(val?.text||'').length * 2;
 }
}

function updateStorageBadge(totalBytes){
 const mb=(Math.max(0, totalBytes) / (1024 * 1024)).toFixed(2);
 const badge=$('inboxSizeBadge');
 if(badge)badge.textContent=`${mb} / 2.00 MB`;
}

/**
 * Keeps received messages (toUid === myUid) within 2MB.
 * Oldest messages are deleted from Firebase when total size exceeds 2MB.
 */
async function enforce2MbInboxLimit(myUid){
 if(!db || !myUid || isPruning)return;
 isPruning=true;
 try{
  const snap=await db.ref('directMessages_v6').orderByChild('timestamp').once('value');
  if(!snap.exists()){
   allIncomingMessages=[];
   updateStorageBadge(0);
   return;
  }

  const receivedEntries=[];
  snap.forEach(child=>{
   const val=child.val()||{};
   if(val.toUid === myUid && val.fromUid !== myUid){
    receivedEntries.push({
     key:child.key,
     data:val,
     bytes:getRecordBytes(val),
     ts:Number(val.timestamp)||0
    });
   }
  });

  receivedEntries.sort((a,b)=>a.ts - b.ts);

  let totalBytes=receivedEntries.reduce((acc, item)=>acc + item.bytes, 0);
  const kept=[];

  // Remove oldest messages while total exceeds 2MB
  let idx=0;
  while(totalBytes > MAX_INBOX_BYTES && idx < receivedEntries.length){
   const oldest=receivedEntries[idx++];
   totalBytes -= oldest.bytes;
   await db.ref('directMessages_v6/'+oldest.key).remove().catch(()=>{});
  }

  for(let i=idx;i<receivedEntries.length;i++){
   kept.push(receivedEntries[i].data);
  }

  allIncomingMessages=kept;
  updateStorageBadge(totalBytes);
  renderPopupInboxList();
 }catch(e){
  console.error('2MB inbox cleanup error:',e);
 }finally{
  isPruning=false;
 }
}

function showIncomingMessageNotification(senderName, text, senderUid){
 const banner=$('msgNotifBanner');
 $('notifSenderName').textContent=senderName||'ක්‍රීඩකයා';
 $('notifMessageText').textContent=text||'නව පණිවිඩයක් ලැබුණි';
 banner.onclick=()=>{
  banner.classList.remove('show');
  if(senderUid){
   activePeerUid=senderUid;
   activePeerName=senderName||'Player';
   $('chatWithTitle').innerHTML=`<i class="fa-solid fa-comments"></i> ${activePeerName}`;
   loadConversation();
  }else{
   $('popupInboxModal').classList.add('show');
  }
 };
 banner.classList.add('show');
 clearTimeout(notifTimer);
 notifTimer=setTimeout(()=>banner.classList.remove('show'), 4200);
}

function updateUnreadBadge(){
 const badge=$('popupInboxBadge');
 if(unreadCount>0){
  badge.textContent=String(unreadCount);
  badge.classList.add('show');
 }else{
  badge.classList.remove('show');
 }
}

function renderPopupInboxList(){
 const list=$('popupInboxList');
 list.innerHTML='';
 if(!allIncomingMessages.length){
  list.innerHTML='<small style="color:var(--dim);text-align:center">තවම messages ලැබී නොමැත (2MB සීමාව ඇතුළත).</small>';
  return;
 }
 const latestBySender=new Map();
 for(const m of allIncomingMessages){
  latestBySender.set(m.fromUid || m.fromName || 'unknown', m);
 }
 Array.from(latestBySender.values()).reverse().forEach(item=>{
  const row=document.createElement('div');
  row.className='sender-item';
  row.innerHTML=`<b>${item.fromName||'Player'}</b><p>${item.text||''}</p>`;
  row.onclick=()=>{
   activePeerUid=item.fromUid||'';
   activePeerName=item.fromName||'Player';
   $('chatWithTitle').innerHTML=`<i class="fa-solid fa-comments"></i> ${activePeerName}`;
   unreadCount=0;
   updateUnreadBadge();
   $('popupInboxModal').classList.remove('show');
   loadConversation();
  };
  list.appendChild(row);
 });
}

$('openPopupInboxBtn').onclick=()=>{
 unreadCount=0;
 updateUnreadBadge();
 renderPopupInboxList();
 $('popupInboxModal').classList.add('show');
};
$('closePopupInboxBtn').onclick=()=>$('popupInboxModal').classList.remove('show');

function loadConversation(){
 const stream=$('chatStream');
 stream.innerHTML='';
 if(!db || !fbUser)return;

 db.ref('directMessages_v6').orderByChild('timestamp').limitToLast(80).once('value').then(snap=>{
  stream.innerHTML='';
  if(!snap.exists())return;
  snap.forEach(child=>{
   const m=child.val()||{};
   const isMe=m.fromUid===fbUser.uid;
   const isToMe=m.toUid===fbUser.uid;
   if(!isMe && !isToMe)return;
   if(activePeerUid && !((m.fromUid===fbUser.uid && m.toUid===activePeerUid)||(m.fromUid===activePeerUid && m.toUid===fbUser.uid)))return;

   const b=document.createElement('div');
   b.className='bubble '+(isMe?'me':'them');
   b.innerHTML=`<small>${isMe?'ඔබ':(m.fromName||'Player')}</small>${m.text||''}`;
   stream.appendChild(b);
  });
  stream.scrollTop=stream.scrollHeight;
 }).catch(()=>{});
}

$('sendMsgBtn').onclick=async()=>{
 const txt=$('msgInput').value.trim();
 if(!txt || !db || !fbUser)return;
 const targetUid=activePeerUid || 'global_lobby';
 await db.ref('directMessages_v6').push({
  fromUid:fbUser.uid,
  fromName:user.name||'Player',
  toUid:targetUid,
  text:txt,
  timestamp:Date.now()
 });
 $('msgInput').value='';
 loadConversation();
};

try{
 const cached=localStorage.getItem(KEY);
 if(cached)user={...user,...JSON.parse(cached)};
 $('headerName').textContent=user.name||'ක්‍රීඩකයා';
 $('points').textContent=user.points ?? 500;
}catch(_){}

const params=new URLSearchParams(window.location.search);
activePeerUid=params.get('with')||'';
activePeerName=params.get('name')||'';
if(activePeerName){
 $('chatWithTitle').innerHTML=`<i class="fa-solid fa-comments"></i> ${activePeerName}`;
}

try{
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();
 db=firebase.database();

 const startTime=Date.now();
 auth.onAuthStateChanged(async u=>{
  if(!u)return;
  fbUser=u;
  const s=await db.ref('users_v6/'+u.uid).once('value').catch(()=>null);
  if(s && s.exists())user={...user,...s.val(),uid:u.uid};
  $('headerName').textContent=user.name||'ක්‍රීඩකයා';
  $('points').textContent=user.points ?? 500;

  await enforce2MbInboxLimit(u.uid);
  loadConversation();

  db.ref('directMessages_v6').limitToLast(40).on('child_added', async snap=>{
   const m=snap.val()||{};
   if(m.toUid===u.uid && m.fromUid!==u.uid){
    await enforce2MbInboxLimit(u.uid);
    if((Number(m.timestamp)||0) >= startTime - 2000){
     unreadCount += 1;
     updateUnreadBadge();
     showIncomingMessageNotification(m.fromName||'ක්‍රීඩකයා', m.text||'', m.fromUid||'');
    }
    if(!activePeerUid || activePeerUid===m.fromUid){
     loadConversation();
    }
   }
  });
 });
}catch(e){console.error(e);}
</script>
</body>
</html>
