<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gaming Profile - Sinhala Draughts Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Orbitron:wght@600;700;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070e;
  --panel:rgba(13,19,36,0.92);
  --card:rgba(21,30,54,0.82);
  --gold:#ffd166;
  --gold-2:#ff9f1c;
  --neon-blue:#00f2fe;
  --neon-green:#2ecc71;
  --purple:#9b59b6;
  --red:#ff4757;
  --dim:#9fb0c7;
  --line:rgba(255,209,102,0.22);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Gemunu Libre','Poppins',sans-serif;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100vw;
  height:100dvh;
  max-width:100vw;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 12%, rgba(0,242,254,0.14), transparent 36%),
    radial-gradient(circle at 85% 18%, rgba(255,209,102,0.16), transparent 40%),
    radial-gradient(circle at 50% 85%, rgba(108,92,231,0.18), transparent 45%),
    linear-gradient(180deg, #060913 0%, #04060c 100%);
  color:#f8fafc;
}

.top-hud,
.bottom-nav{
  display:none !important;
}

.app{
  width:100vw;
  height:100dvh;
  max-width:100vw;
  margin:0;
  padding:
    calc(env(safe-area-inset-top, 0px) + 12px)
    calc(env(safe-area-inset-right, 0px) + 14px)
    calc(env(safe-area-inset-bottom, 0px) + 12px)
    calc(env(safe-area-inset-left, 0px) + 14px);
  display:flex;
  flex-direction:column;
  justify-content:stretch;
  gap:10px;
  position:fixed;
  inset:0;
  opacity:1;
  transform:scale(1);
  transition:opacity 0.16s ease-out,transform 0.16s ease-out;
}
.app.page-leaving{
  opacity:0;
  transform:scale(0.985);
}

/* Top-Left Back Icon Bar */
.top-back-bar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-shrink:0;
}

.top-back-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1.5px solid rgba(255,209,102,0.45);
  background:linear-gradient(135deg,rgba(24,33,62,0.96),rgba(12,17,34,0.96));
  color:var(--gold);
  font-size:1.05rem;
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
  transition:transform 0.12s ease,border-color 0.15s ease,background 0.15s ease,box-shadow 0.15s ease;
}
.top-back-btn:hover{
  border-color:var(--gold);
  background:linear-gradient(135deg,rgba(255,209,102,0.2),rgba(20,28,54,0.96));
  box-shadow:0 0 16px rgba(255,209,102,0.28);
}
.top-back-btn:active{
  transform:scale(0.94);
}

.top-screen-tag{
  font-family:'Orbitron','Gemunu Libre',sans-serif;
  font-size:0.72rem;
  font-weight:800;
  letter-spacing:0.8px;
  color:var(--dim);
  padding:6px 12px;
  border-radius:12px;
  background:rgba(13,19,36,0.78);
  border:1px solid rgba(255,255,255,0.08);
}

main{
  flex:1;
  width:100%;
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.profile-scroll{
  flex:1;
  width:100%;
  height:100%;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:4px 2px 20px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,209,102,0.35) transparent;
}
.profile-scroll::-webkit-scrollbar{width:5px}
.profile-scroll::-webkit-scrollbar-thumb{background:rgba(255,209,102,0.35);border-radius:999px}

/* Gamer Banner Card */
.gamer-banner{
  width:100%;
  min-height:fit-content;
  position:relative;
  overflow:visible;
  padding:18px 16px 16px;
  border-radius:22px;
  background:
    linear-gradient(135deg, rgba(26,37,68,0.96) 0%, rgba(13,19,36,0.97) 65%, rgba(16,44,49,0.94) 100%);
  border:1.5px solid rgba(255,209,102,0.35);
  box-shadow:0 14px 34px rgba(0,0,0,0.65);
}

.gamer-top-row{
  display:flex;
  align-items:center;
  gap:16px;
  min-height:92px;
}

.avatar-ring-wrap{
  position:relative;
  width:84px;
  height:84px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  border-radius:50%;
  padding:4px;
  background:rgba(8,12,24,0.92);
  box-shadow:0 0 22px rgba(255,209,102,0.28), inset 0 0 10px rgba(0,242,254,0.2);
}

.avatar-ring-wrap::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:50%;
  padding:3px;
  background:conic-gradient(from 0deg, var(--gold), var(--neon-blue), var(--neon-green), var(--purple), var(--gold));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:frameSpin 7s linear infinite;
  pointer-events:none;
}

@keyframes frameSpin{
  to{transform:rotate(360deg)}
}

.hero-avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ffe08a,#ffad62);
  color:#18213e;
  font-size:1.95rem;
  border:2.5px solid var(--gold);
  box-shadow:inset 0 2px 6px rgba(255,255,255,0.45), 0 4px 12px rgba(0,0,0,0.6);
  position:relative;
  z-index:1;
}

.hero-avatar i{
  line-height:1;
}

.rank-pill{
  position:absolute;
  bottom:-8px;
  left:50%;
  transform:translateX(-50%);
  z-index:3;
  padding:2px 9px;
  border-radius:999px;
  background:linear-gradient(135deg,#ff9f1c,#ffd166);
  color:#111;
  font-family:'Orbitron','Poppins',sans-serif;
  font-size:0.58rem;
  font-weight:900;
  white-space:nowrap;
  border:1px solid rgba(0,0,0,0.35);
  box-shadow:0 4px 10px rgba(0,0,0,0.6);
}

.gamer-meta{
  flex:1;
  min-width:0;
  position:relative;
  z-index:1;
}

.gamer-name-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  line-height:1.25;
}

.gamer-meta h2{
  font-size:1.4rem;
  line-height:1.25;
  font-weight:800;
  color:#fff;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-shadow:0 2px 10px rgba(0,0,0,0.5);
}

.pro-tag{
  font-family:'Orbitron','Poppins',sans-serif;
  font-size:0.64rem;
  line-height:1.2;
  padding:3px 9px;
  border-radius:8px;
  background:rgba(0,242,254,0.16);
  border:1px solid rgba(0,242,254,0.5);
  color:var(--neon-blue);
  font-weight:800;
  flex-shrink:0;
}

.gamer-sub{
  font-size:0.8rem;
  line-height:1.3;
  color:var(--dim);
  margin-top:4px;
}

.collection-strip{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:10px;
  background:rgba(46,204,113,0.12);
  border:1px solid rgba(46,204,113,0.3);
  color:var(--neon-green);
  font-size:0.74rem;
  font-weight:700;
}

/* Stats Grid */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:16px;
}

.stat-box{
  background:rgba(6,10,20,0.65);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:16px;
  padding:10px 6px;
  text-align:center;
}

.stat-box b{
  display:block;
  font-family:'Orbitron','Poppins',sans-serif;
  font-size:0.98rem;
  color:#fff;
}
.stat-box.win b{color:var(--neon-green)}
.stat-box.loss b{color:var(--red)}
.stat-box.rate b{color:var(--gold)}

.stat-box span{
  display:block;
  font-size:0.68rem;
  color:var(--dim);
  margin-top:2px;
  font-weight:700;
}

/* Live Loadout Preview Card */
.loadout-card{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 15px;
  border-radius:20px;
  background:var(--card);
  border:1.5px solid rgba(0,242,254,0.28);
  box-shadow:0 8px 22px rgba(0,0,0,0.45);
}

.loadout-info{
  min-width:0;
  flex:1;
}

.loadout-info small{
  display:block;
  font-size:0.72rem;
  color:var(--neon-blue);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.loadout-info b{
  display:block;
  font-size:1rem;
  color:#fff;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.loadout-info span{
  display:block;
  font-size:0.76rem;
  color:var(--dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.live-piece-stage{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(6,10,20,0.75);
  padding:8px 12px;
  border-radius:16px;
  border:1px solid rgba(255,209,102,0.25);
  flex-shrink:0;
}

.live-piece-token{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:1.15rem;
  box-shadow:0 6px 14px rgba(0,0,0,0.65), inset 0 2px 4px rgba(255,255,255,0.45);
  transition:transform 0.16s ease;
}

/* Section Panels */
.panel-box{
  width:100%;
  background:var(--panel);
  border:1.5px solid var(--line);
  border-radius:20px;
  padding:14px;
  box-shadow:0 10px 26px rgba(0,0,0,0.5);
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  gap:8px;
}

.section-head p{
  font-size:0.92rem;
  font-weight:800;
  color:#fff;
  display:flex;
  align-items:center;
  gap:7px;
}
.section-head p i{
  color:var(--gold);
}

.shop-link{
  background:rgba(255,209,102,0.12);
  border:1px solid rgba(255,209,102,0.4);
  color:var(--gold);
  font-size:0.74rem;
  font-weight:800;
  padding:4px 10px;
  border-radius:10px;
  cursor:pointer;
  transition:background 0.15s ease,transform 0.12s ease;
  flex-shrink:0;
}
.shop-link:hover{
  background:rgba(255,209,102,0.22);
}
.shop-link:active{
  transform:scale(0.96);
}

.pieces-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.piece-option{
  background:rgba(255,255,255,0.03);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:15px;
  padding:10px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer;
  position:relative;
  transition:transform 0.14s ease,border-color 0.14s ease,background 0.14s ease,box-shadow 0.14s ease;
}

.piece-option:hover{
  border-color:rgba(255,209,102,0.5);
  background:rgba(255,255,255,0.06);
}

.piece-option:active{
  transform:scale(0.96);
}

.piece-option.selected{
  border-color:var(--gold);
  background:linear-gradient(145deg,rgba(255,209,102,0.22),rgba(0,242,254,0.08));
  box-shadow:0 0 16px rgba(255,209,102,0.24);
}

.piece-badge{
  font-size:0.56rem;
  font-weight:800;
  padding:2px 7px;
  border-radius:999px;
  background:rgba(0,0,0,0.45);
  letter-spacing:0.3px;
}

.empty-unlocked-msg{
  grid-column:1 / -1;
  text-align:center;
  padding:14px 10px;
  font-size:0.78rem;
  color:var(--dim);
  background:rgba(255,255,255,0.02);
  border:1px dashed rgba(255,255,255,0.14);
  border-radius:14px;
}

/* Action Bar: Save / Logout (No Home Button) */
.icon-actions-bar{
  width:100%;
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:10px;
  padding-top:2px;
}

.icon-action-btn{
  border-radius:18px;
  padding:11px 12px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:transform 0.13s ease,box-shadow 0.16s ease,border-color 0.16s ease,background 0.16s ease;
}
.icon-action-btn:active{
  transform:scale(0.96);
}

.icon-action-btn .ic-wrap{
  width:34px;
  height:34px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:1.15rem;
}

.icon-action-btn .ic-label{
  font-family:'Orbitron','Gemunu Libre',sans-serif;
  font-size:0.66rem;
  font-weight:800;
  letter-spacing:0.5px;
}

.btn-save-ic{
  background:linear-gradient(135deg,rgba(255,209,102,0.22),rgba(255,159,28,0.16));
  border:1.5px solid var(--gold);
  color:var(--gold);
  box-shadow:0 6px 20px rgba(255,159,28,0.25);
}
.btn-save-ic .ic-wrap{
  background:linear-gradient(135deg,#ffe08a,#ff9f1c);
  color:#111;
  box-shadow:0 0 12px rgba(255,209,102,0.45);
}

.btn-logout-ic{
  background:linear-gradient(135deg,rgba(255,71,87,0.16),rgba(21,30,54,0.88));
  border:1.5px solid rgba(255,71,87,0.48);
  color:var(--red);
  box-shadow:0 6px 18px rgba(255,71,87,0.16);
}
.btn-logout-ic .ic-wrap{
  background:rgba(255,71,87,0.18);
  color:var(--red);
  border:1px solid rgba(255,71,87,0.42);
}

/* Toast */
#toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translate(-50%,120px);
  opacity:0;
  background:linear-gradient(135deg,#182238,#0b101d);
  border:1.5px solid var(--gold);
  color:#f8f9fa;
  border-radius:30px;
  padding:10px 20px;
  z-index:150;
  transition:transform 0.25s ease,opacity 0.25s ease;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:0.88rem;
  box-shadow:0 10px 25px rgba(0,0,0,0.65);
}
#toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

@media (min-width: 600px) {
  .pieces-grid{grid-template-columns:repeat(6,1fr)}
}
@media (min-width: 900px) {
  .pieces-grid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>
<body>
<div class="app" id="appRoot">
 <header class="top-hud" aria-hidden="true"></header>

 <div class="top-back-bar">
  <button type="button" class="top-back-btn" id="topBackBtn" title="මුල් පිටුවට (Back)" aria-label="මුල් පිටුවට යන්න">
   <i class="fa-solid fa-arrow-left"></i>
  </button>
  <span class="top-screen-tag">GAMER PROFILE</span>
 </div>

 <main>
  <div class="profile-scroll">
   <!-- Gamer Identity & Stats -->
   <section class="gamer-banner">
    <div class="gamer-top-row">
     <div class="avatar-ring-wrap" id="avatarFrameWrap">
      <div id="profileAvatar" class="hero-avatar"><i class="fa-solid fa-user"></i></div>

      <div class="gamer-name-row">

      <div class="gamer-sub" id="profileSubtitle">Sinhala Draughts Arena Competitor</div>

       <i class="fa-solid fa-sparkles"></i>
       <span>Unlocked Avatars: 1 | Themes: 1</span>
      </div>
     </div>
    </div>

    <div class="stats-grid">
     <div class="stat-box">
      <b id="statMatches">0</b>
      <span>MATCHES</span>
     </div>
     <div class="stat-box win">
      <b id="statWins">0</b>
      <span>WINS</span>
     </div>
     <div class="stat-box loss">
      <b id="statLosses">0</b>
      <span>LOSSES</span>
     </div>
     <div class="stat-box rate">
      <b id="statWinRate">0%</b>
      <span>WIN RATE</span>

   <!-- Live Loadout Preview -->
   <section class="loadout-card">
    <div class="loadout-info">
     <small><i class="fa-solid fa-eye"></i> ACTIVE LOADOUT PREVIEW</small>
     <b id="selectedThemeName">මුතු සුදු (Default)</b>
     <span id="selectedAvatarName">සම්මත (Default)</span>
    </div>
    <div class="live-piece-stage">
     <div id="livePiecePreview" class="live-piece-token">●</div>
     <div id="liveAvatarPreview" style="font-size:1.3rem;color:var(--gold)"><i class="fa-solid fa-user"></i></div>
    </div>
   </section>

   <!-- Unlocked Avatars Grid -->
   <section class="panel-box">
    <div class="section-head">
     <p><i class="fa-solid fa-id-badge"></i> UNLOCKED AVATARS</p>
     <button type="button" class="shop-link" id="goShopFromAvatars"><i class="fa-solid fa-cart-plus"></i> Shop</button>
    </div>
    <div class="pieces-grid" id="avatarGrid"></div>
   </section>

   <!-- Unlocked Piece Themes Grid -->
   <section class="panel-box">
    <div class="section-head">
     <p><i class="fa-solid fa-chess-board"></i> UNLOCKED PIECE THEMES</p>
     <button type="button" class="shop-link" id="goShopFromPieces"><i class="fa-solid fa-cart-plus"></i> Shop</button>
    </div>
    <div class="pieces-grid" id="piecesGrid"></div>
   </section>

   <!-- Action Bar: Save / Logout -->
   <div class="icon-actions-bar">
    <button type="button" class="icon-action-btn btn-save-ic" id="saveProfile" title="සුරකින්න (Save)">
     <span class="ic-wrap"><i class="fa-solid fa-shield-check"></i></span>
     <span class="ic-label">SAVE</span>
    </button>
    <button type="button" class="icon-action-btn btn-logout-ic" id="logoutBtn" title="Logout">
     <span class="ic-wrap"><i class="fa-solid fa-power-off"></i></span>
     <span class="ic-label">LOGOUT</span>
    </button>
   </div>
  </div>
 </main>

 <footer class="bottom-nav" aria-hidden="true"></footer>
</div>

<div id="toast"></div>

function normalizeList(val, fallback) {
 if (Array.isArray(val)) return val.length ? val : fallback;
 if (val && typeof val === 'object') {
  const arr = Object.values(val);
  return arr.length ? arr : fallback;
 }
 return fallback;
}

function getAllPieces(){
 const map = new Map();
 [...DEFAULT_PIECE_DESIGNS, ...customPieces, ...EVENT_REWARD_PIECES].forEach((p, i) => {
  if(!p || !p.name) return;
  const key = String(p.id !== undefined ? p.id : i);
  if(!map.has(key)) map.set(key, { ...p, _key: key, _idx: i });
 });
 return Array.from(map.values());
}

function getAllAvatars(){
 const map = new Map();
 [...DEFAULT_AVATARS, ...customAvatars, ...EVENT_REWARD_AVATARS].forEach((a, i) => {
  if(!a || !a.name) return;
  const key = String(a.id || a.icon || i);
  if(!map.has(key)) map.set(key, { ...a, _key: key });
 });
 return Array.from(map.values());
}

function findPieceByKey(keyOrIdx){
 const all = getAllPieces();
 const str = String(keyOrIdx ?? '0');
 const byId = all.find(p => String(p.id) === str || String(p._key) === str);
 if(byId) return byId;
 const num = Number(str);
 if(Number.isFinite(num) && all[num]) return all[num];
 return all[0];
}

function resolveDisplayName(d, authUser){
 const candidates = [
  d && typeof d.name === 'string' ? d.name.trim() : '',
  d && typeof d.username === 'string' ? d.username.trim() : '',
  user && typeof user.name === 'string' ? user.name.trim() : '',
  authUser && typeof authUser.displayName === 'string' ? authUser.displayName.trim() : '',
  authUser && typeof authUser.email === 'string' ? authUser.email.split('@')[0].trim() : ''
 ];
 const valid = candidates.find(n => n && n.toLowerCase() !== 'admin');
 return valid || 'ක්‍රීඩකයා';
}

function resolveIconClass(rawIcon){
 const allAvatars = getAllAvatars();
 const s = String(rawIcon || 'fa-user').trim();
 const found = allAvatars.find(a => String(a.id) === s || String(a.icon) === s);
 if(found && found.icon) return String(found.icon).replace(/^fa-solid\s+/, '');
 return s.replace(/^fa-solid\s+/, '') || 'fa-user';
}

function getRankInfo(wins, points){
 const w = Number(wins) || 0;
 const p = Number(points) || 0;
 if (w >= 50 || p >= 5000) return { badge: 'GRANDMASTER', tier: 'TIER V' };
 if (w >= 25 || p >= 2500) return { badge: 'DIAMOND', tier: 'TIER IV' };
 if (w >= 12 || p >= 1200) return { badge: 'GOLD PRO', tier: 'TIER III' };
 if (w >= 5 || p >= 700)  return { badge: 'STRIKER', tier: 'TIER II' };
 return { badge: 'ROOKIE', tier: 'TIER I' };
}

function toast(s, icon='fa-circle-info'){
 const t=$('toast');
 t.replaceChildren();
 const iconEl=document.createElement('i');iconEl.className=`fa-solid ${icon}`;iconEl.style.color='var(--gold)';
 const textEl=document.createElement('span');textEl.textContent=String(s);
 t.append(iconEl,textEl);
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),3000);
}

function smoothNavigate(url){
 if(isNavigating)return;
 isNavigating=true;
 const app=$('appRoot');
 if(app)app.classList.add('page-leaving');
 setTimeout(()=>{window.location.href=url;},110);
}

function applyAvatarToBox(elementId, pieceKeyOrIdx, customIcon){
 const el=$(elementId);if(!el)return;
 const design=findPieceByKey(pieceKeyOrIdx);
 el.style.background=design.bg;
 el.style.borderColor=design.border;
 el.style.color=design.color;

 const wrap = $('avatarFrameWrap');
 if(wrap && elementId === 'profileAvatar'){
  wrap.style.boxShadow = `0 0 22px ${design.border}55, inset 0 0 10px rgba(0,242,254,0.2)`;
 }

 if(customIcon){
  const iconCls = resolveIconClass(customIcon);
  el.innerHTML = `<i class="fa-solid ${iconCls}"></i>`;
 } else {
  el.textContent = design.icon;
 }
}

function updateLivePreview(){
 const allAvatars=getAllAvatars();
 const piece=findPieceByKey(tempSelectedPiece);
 const avObj=allAvatars.find(a=>String(a.id)===String(tempSelectedAvatar) || String(a._key)===String(tempSelectedAvatar))||allAvatars[0];
 const iconCls=resolveIconClass(avObj ? (avObj.icon || avObj.id) : tempSelectedAvatar);

 const token=$('livePiecePreview');
 if(token){
  token.style.background=piece.bg;
  token.style.border=`2px solid ${piece.border}`;
  token.style.color=piece.color;
  token.textContent=piece.icon;
 }
 const avPrev=$('liveAvatarPreview');
 if(avPrev){
  avPrev.innerHTML=`<i class="fa-solid ${iconCls}"></i>`;
 }
 $('selectedThemeName').textContent=piece.name;
 $('selectedAvatarName').textContent=`Avatar: ${avObj ? avObj.name : iconCls}`;
}

function renderProfileItems(){
 const wins=Number(user.wins)||0;
 const losses=Number(user.losses)||0;
 const matches=wins+losses;
 const winRate=matches>0?Math.round((wins/matches)*100):0;
 const rank=getRankInfo(wins, user.points);
 const displayName=resolveDisplayName(user, fbUser);

 $('profileName').textContent=displayName;
 $('rankBadge').textContent=rank.badge;
 $('tierTag').textContent=rank.tier;
 $('statMatches').textContent=matches;
 $('statWins').textContent=wins;
 $('statLosses').textContent=losses;
 $('statWinRate').textContent=`${winRate}%`;

 const aGrid=$('avatarGrid');
 aGrid.innerHTML='';
 const unlockedAvatars = normalizeList(user.unlockedAvatars, ['fa-user']).map(String);
 const allAvatars = getAllAvatars();
 const unlockedAvatarItems = allAvatars.filter(av => {
  const avId = String(av.id);
  const iconCls = resolveIconClass(av.icon || av.id);
  return unlockedAvatars.includes(avId) || unlockedAvatars.includes(iconCls);
 });

 if(!unlockedAvatarItems.length){
  aGrid.innerHTML=`<div class="empty-unlocked-msg">Unlocked Avatars නොමැත.</div>`;
 } else {
  unlockedAvatarItems.forEach(av => {
   const avId = String(av.id);
   const iconCls = resolveIconClass(av.icon || av.id);
   const currentAv = resolveIconClass(user.avatarIcon || 'fa-user');
   const isEquipped = avId === String(user.avatarIcon || 'fa-user') || iconCls === currentAv;
   const isSelected = avId === String(tempSelectedAvatar) || iconCls === resolveIconClass(tempSelectedAvatar);
   const avDiv = document.createElement('div');
   avDiv.className = 'piece-option' + (isSelected ? ' selected' : '');
   const statusLabel = isEquipped ? 'EQUIPPED' : 'UNLOCKED';
   const statusColor = isEquipped ? 'var(--gold)' : 'var(--neon-green)';
   avDiv.innerHTML = `
    <div style="font-size:1.35rem;color:var(--gold);padding:4px;"><i class="fa-solid ${iconCls}"></i></div>
    <span style="font-size:0.62rem;text-align:center;color:#e2e8f0;font-weight:700">${av.name}</span>
    <small class="piece-badge" style="color:${statusColor}">${statusLabel}</small>
   `;
   avDiv.onclick = () => {
    tempSelectedAvatar = avId;
    renderProfileItems();
   };
   aGrid.appendChild(avDiv);
  });
 }

 const grid=$('piecesGrid');
 grid.innerHTML='';
 const unlockedPieces = normalizeList(user.unlockedPieces, [0]).map(String);
 const allPieces = getAllPieces();
 const unlockedPieceEntries = allPieces
  .map((p, idx) => ({ p, idx: Number(idx), idStr: String(p.id !== undefined ? p.id : idx) }))
  .filter(item => unlockedPieces.includes(String(item.idx)) || unlockedPieces.includes(item.idStr));

 if(!unlockedPieceEntries.length){
  grid.innerHTML=`<div class="empty-unlocked-msg">Unlocked Piece Themes නොමැත.</div>`;
 } else {
  unlockedPieceEntries.forEach(({ p, idx: pIdx, idStr }) => {
   const equippedKey = String(user.pieceIndex ?? 0);
   const isEquipped = (equippedKey === String(pIdx)) || (equippedKey === idStr) || (String(findPieceByKey(equippedKey)._key) === String(p._key));
   const selKey = String(tempSelectedPiece ?? 0);
   const isSelected = (selKey === String(pIdx)) || (selKey === idStr) || (String(findPieceByKey(selKey)._key) === String(p._key));
   const div=document.createElement('div');
   div.className='piece-option'+(isSelected?' selected':'');
   const statusLabel = isEquipped ? 'EQUIPPED' : 'UNLOCKED';
   const statusColor = isEquipped ? 'var(--gold)' : 'var(--neon-green)';
   div.innerHTML=`
    <div style="width:30px;height:30px;border-radius:50%;background:${p.bg};border:2px solid ${p.border};color:${p.color};display:grid;place-items:center;font-size:0.95rem;box-shadow:0 3px 8px rgba(0,0,0,0.5)">${p.icon}</div>

 if(!db||!uid)return;
 if(userListenerRef&&userListenerFn){
  try{userListenerRef.off('value',userListenerFn);}catch(e){}
 }
 userListenerRef=db.ref('users_v6/'+uid);
 userListenerFn=snap=>{
  const d=snap.val()||{};
  const resolvedName=resolveDisplayName(d, authUser);
  user={
   ...user,
   ...d,
   name:resolvedName,
   uid:uid,
   points:Number.isFinite(Number(d.points))?Number(d.points):user.points,
   wins:Number(d.wins)||0,
   losses:Number(d.losses)||0,
   pieceIndex:d.pieceIndex ?? 0,
   unlockedPieces:normalizeList(d.unlockedPieces,[0]),
   avatarIcon:d.avatarIcon||'fa-user',
   unlockedAvatars:normalizeList(d.unlockedAvatars,['fa-user']).map(String)
  };
  tempSelectedPiece=user.pieceIndex;
  tempSelectedAvatar=user.avatarIcon;
  localStorage.setItem(KEY,JSON.stringify(user));
  renderProfileItems();
 };
 userListenerRef.on('value',userListenerFn);
}

if(auth){
 auth.onAuthStateChanged(u=>{
  fbUser=u||null;
  if(!u){
   if(userListenerRef&&userListenerFn){
    try{userListenerRef.off('value',userListenerFn);}catch(e){}
    userListenerRef=null;
    userListenerFn=null;
   }
   renderProfileItems();
   return;
  }
  user.name=resolveDisplayName(user, u);
  renderProfileItems();
  attachUserProfileListener(u.uid, u);
 });
}

$('saveProfile').onclick=async()=>{
 user.name=resolveDisplayName(user, fbUser);
 user.pieceIndex=tempSelectedPiece ?? 0;
 user.avatarIcon=tempSelectedAvatar||'fa-user';
 user.unlockedPieces=normalizeList(user.unlockedPieces,[0]);
 user.unlockedAvatars=normalizeList(user.unlockedAvatars,['fa-user']).map(String);
 localStorage.setItem(KEY,JSON.stringify(user));

 if(db&&fbUser){
  const patch={
   name:user.name,
   pieceIndex:user.pieceIndex,
   avatarIcon:user.avatarIcon,
   unlockedPieces:user.unlockedPieces,
   unlockedAvatars:user.unlockedAvatars
  };
  await db.ref('users_v6/'+fbUser.uid).update(patch).catch(()=>{});
  await db.ref('publicProfiles_v6/'+fbUser.uid).update(patch).catch(()=>{});
 }
 renderProfileItems();
 toast('Gaming Profile Loadout සුරකින ලදී!', 'fa-shield-check');
};

$('topBackBtn').onclick=()=>smoothNavigate('index.html');
$('goShopFromAvatars').onclick=()=>smoothNavigate('shopandreward.html');
$('goShopFromPieces').onclick=()=>smoothNavigate('shopandreward.html');

$('logoutBtn').onclick=async()=>{
 localStorage.removeItem(KEY);
 sessionStorage.removeItem('sinhala_draughts_admin_auth');
 if(auth)await auth.signOut().catch(()=>{});
 smoothNavigate('index.html');
};
</script>
<script src="./invite-global.js"></script>
