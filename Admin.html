<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ශ්‍රී ලංකීය දාම් - Admin Control Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070e;--panel:rgba(14,20,38,.92);--gold:#ffd166;--neon-blue:#00f2fe;--neon-green:#2ecc71;--red:#ff4757;--dim:#a0aec0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:radial-gradient(circle at 50% 15%,#1a103c 0%,#080b18 65%,#03050a 100%);color:#f8f9fa;overflow:hidden}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center}

.admin-app{width:100%;height:100dvh;max-width:860px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden;opacity:1;transform:scale(1);transition:opacity 0.16s ease-out,transform 0.16s ease-out;will-change:opacity,transform}
.admin-app.page-leaving{opacity:0;transform:scale(0.985)}

.admin-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:linear-gradient(135deg,rgba(22,30,56,0.95),rgba(10,14,28,0.95));border:2px solid rgba(255,209,102,0.45);border-radius:22px;box-shadow:0 8px 25px rgba(0,0,0,0.6);backdrop-filter:blur(10px)}
.admin-brand{display:flex;align-items:center;gap:12px}
.admin-badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffd166,#ff9f1a);color:#111;font-size:1.3rem;box-shadow:0 0 15px rgba(255,209,102,0.5);flex-shrink:0}
.admin-brand b{font-size:1.15rem;color:var(--gold);display:block;line-height:1.15}
.admin-brand small{font-size:0.75rem;color:var(--dim)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(14,20,38,0.9);padding:6px;border-radius:18px;border:1.5px solid rgba(255,209,102,0.25)}
.tab-btn{border:0;border-radius:13px;padding:9px 8px;background:transparent;color:var(--dim);font-weight:700;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.18s ease}
.tab-btn.active{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111;box-shadow:0 4px 14px rgba(255,173,98,0.35)}

.panel-scroll{flex:1;overflow-y:auto;padding:14px;background:linear-gradient(145deg,rgba(18,24,40,0.88),rgba(12,16,28,0.92));border:2px solid rgba(255,209,102,0.22);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.5);display:none;flex-direction:column;gap:12px}
.panel-scroll.active{display:flex}

.search-bar{display:flex;gap:8px;align-items:center}
input,select{width:100%;padding:10px 13px;background:rgba(0,0,0,0.55);border:1.5px solid rgba(255,209,102,0.35);border-radius:12px;color:#fff;font-size:0.9rem;outline:none}
input:focus,select:focus{border-color:var(--gold)}

.player-card{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,209,102,0.2);border-radius:18px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.player-info{display:flex;align-items:center;gap:12px;min-width:160px}
.player-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,209,102,0.14);border:2px solid var(--gold);color:var(--gold);font-size:1.15rem;flex-shrink:0}
.player-info b{font-size:1rem;color:#fff;display:block}
.player-info small{font-size:0.75rem;color:var(--dim)}

.player-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.coin-input{width:95px !important;padding:7px 9px !important;font-size:0.88rem !important;font-weight:700;color:var(--gold) !important}

.btn,.btn-gold,.btn-danger,.btn-green{border:0;border-radius:11px;padding:8px 11px;cursor:pointer;font-weight:700;font-size:0.8rem;display:inline-flex;align-items:center;gap:5px;justify-content:center;transition:transform 0.12s ease}
.btn:active,.btn-gold:active,.btn-danger:active,.btn-green:active{transform:scale(0.96)}
.btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111}
.btn-green{background:linear-gradient(135deg,#2ecc71,#20b863);color:#0b1910}
.btn-danger{background:linear-gradient(135deg,#ff4757,#c0392b);color:#fff}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:0.78rem;color:var(--dim)}

.preview-box{background:rgba(0,0,0,0.35);border:1.5px dashed rgba(255,209,102,0.4);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.piece-sample{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,0.6)}

.custom-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:6px}
.custom-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.custom-item-left{display:flex;align-items:center;gap:8px;min-width:0}
.custom-item-left span{font-size:0.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);opacity:0;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--gold);color:#f8f9fa;border-radius:30px;padding:10px 20px;z-index:150;transition:.25s ease;font-weight:600;display:flex;align-items:center;gap:8px;font-size:0.9rem}
#toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width: 560px) {
  .form-grid{grid-template-columns:1fr}
  .tabs .tab-btn span{font-size:0.74rem}
}
</style>
</head>
<body>
<div class="admin-app" id="adminRoot">
 <div class="admin-header">
  <div class="admin-brand">
   <div class="admin-badge"><i class="fa-solid fa-user-shield"></i></div>
   <div>
    <b>ADMIN PANEL</b>
    <small id="playerCountLabel">ක්‍රීඩකයන් පූරණය වෙමින්...</small>
   </div>
  </div>
  <div style="display:flex;gap:8px">

 <!-- Tab 1: Players Management -->

  <div class="search-bar">
   <input type="text" id="playerSearch" placeholder="ක්‍රීඩකයාගේ නම හෝ UID සොයන්න...">
   <button class="btn" id="refreshPlayersBtn" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
  </div>
  <div id="playersList" style="display:flex;flex-direction:column;gap:10px">
   <p style="text-align:center;color:var(--dim);padding:20px">දත්ත ලබාගනිමින් පවතී...</p>
  </div>
 </section>

 <!-- Tab 2: Add Piece Theme to Shop -->
 <section class="panel-scroll" id="themeTab">
  <h3 style="color:var(--gold)">Shop වෙත නව දාම් ඉත්තන්ගේ Theme එකක් එක් කරන්න</h3>
  <div class="preview-box">
   <div class="piece-sample" id="themePreview">♛</div>
   <small style="color:var(--dim)">Shop & Profile Preview</small>
  </div>
  <div class="form-grid">
   <div class="form-group">
    <label>Theme නම</label>
    <input type="text" id="themeName" placeholder="උදා: Royal Emerald">
   </div>
   <div class="form-group">
    <label>මිල (Coins / Points)</label>
    <input type="number" id="themePrice" min="0" value="250">
   </div>
   <div class="form-group">
    <label>සංකේතය (Icon / Emoji)</label>
    <input type="text" id="themeIcon" value="♛" maxlength="4">
   </div>
   <div class="form-group">
    <label>පසුබිම් වර්ණය (Background)</label>
    <input type="color" id="themeBg" value="#2ecc71">
   </div>
   <div class="form-group">
    <label>දාරයේ වර්ණය (Border)</label>
    <input type="color" id="themeBorder" value="#ffd166">
   </div>
   <div class="form-group">
    <label>අකුරු/සංකේත වර්ණය (Color)</label>

   </div>
  </div>
  <button class="btn-gold" id="addThemeBtn" style="padding:12px"><i class="fa-solid fa-plus-circle"></i> Shop එකට Theme එක එක් කරන්න</button>

  <h4 style="color:var(--gold);margin-top:8px">එකතු කළ Custom Themes:</h4>
  <div class="custom-list" id="customThemesList"></div>
 </section>

 <!-- Tab 3: Add Avatar to Shop -->
 <section class="panel-scroll" id="avatarTab">
  <h3 style="color:var(--gold)">Shop වෙත නව Profile Avatar එකක් එක් කරන්න</h3>
  <div class="preview-box">
   <div class="piece-sample" id="avatarPreview" style="background:rgba(255,209,102,0.15);border:2px solid var(--gold);color:var(--gold)"><i class="fa-solid fa-crown"></i></div>
   <small style="color:var(--dim)">Avatar Preview</small>
  </div>
  <div class="form-grid">
   <div class="form-group">
    <label>Avatar නම</label>
    <input type="text" id="avatarName" placeholder="උදා: Golden King">
   </div>
   <div class="form-group">
    <label>මිල (Coins / Points)</label>
    <input type="number" id="avatarPrice" min="0" value="300">
   </div>
   <div class="form-group" style="grid-column:1/-1">
    <label>FontAwesome Icon Class (උදා: fa-crown, fa-dragon, fa-fire, fa-bolt, fa-gem)</label>
    <input type="text" id="avatarIcon" value="fa-crown" placeholder="fa-crown">
   </div>
  </div>
  <button class="btn-gold" id="addAvatarBtn" style="padding:12px"><i class="fa-solid fa-plus-circle"></i> Shop එකට Avatar එක එක් කරන්න</button>

  <h4 style="color:var(--gold);margin-top:8px">එකතු කළ Custom Avatars:</h4>
  <div class="custom-list" id="customAvatarsList"></div>
 </section>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
'use strict';
const firebaseConfig={apiKey:"AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",authDomain:"bin-card-42614.firebaseapp.com",databaseURL:"https://bin-card-42614-default-rtdb.firebaseio.com",projectId:"bin-card-42614",storageBucket:"bin-card-42614.firebasestorage.app",messagingSenderId:"1063550230753",appId:"1:1063550230753:web:1ad8306405e709ac5b17a0"};
const $=id=>document.getElementById(id);

if(sessionStorage.getItem('sinhala_draughts_admin_auth')!=='1'){
 window.location.replace('index.html');
}

let db;
let allPlayers=[];
let customPieces=[];
let customAvatars=[];
let isNavigating=false;
let listenersAttached=false;

function toast(s, icon='fa-circle-info'){
 const t=$('toast');
 t.replaceChildren();
 const iconEl=document.createElement('i');iconEl.className=`fa-solid ${icon}`;iconEl.style.color='var(--gold)';
 const textEl=document.createElement('span');textEl.textContent=String(s);
 t.append(iconEl,textEl);
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),3000);
}

function smoothNavigate(url){
 if(isNavigating)return;
 isNavigating=true;
 const app=$('adminRoot');
 if(app)app.classList.add('page-leaving');
 setTimeout(()=>{window.location.href=url;},110);
}

function isSafeIconClass(cls){
 return /^fa-[a-z0-9-]+$/i.test(cls);
}

function isSafeColor(val){
 return /^#[0-9a-fA-F]{3,8}$/.test(val);
}

try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();}
catch(e){console.error('Firebase init failed:',e);}

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel-scroll').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  $(btn.dataset.tab).classList.add('active');
 };
});

async function updatePlayerCoins(uid, name, nextCoins){
 if(!Number.isFinite(nextCoins)||nextCoins<0){
  toast('නිවැරදි Coin අගයක් ඇතුළත් කරන්න.');
  return false;
 }
 const cleanCoins=Math.floor(nextCoins);
 try{
  await db.ref('users_v6/'+uid).update({points:cleanCoins});
  await db.ref('publicProfiles_v6/'+uid).update({points:cleanCoins}).catch(()=>{});
  toast(`${name} ගේ Coins ${cleanCoins} ලෙස යාවත්කාලීන විය.`,'fa-circle-check');
  return true;
 }catch(err){
  console.error(err);
  toast('Coins යාවත්කාලීන කිරීමට නොහැකි විය.');
  return false;
 }
}

function renderPlayers(){
 const q=($('playerSearch').value||'').trim().toLowerCase();
 const list=$('playersList');
 list.replaceChildren();

 const filtered=allPlayers.filter(p=>p.name.toLowerCase().includes(q)||p.uid.toLowerCase().includes(q));
 if(!filtered.length){
  const empty=document.createElement('p');
  empty.style.cssText='text-align:center;color:var(--dim);padding:20px';
  empty.textContent='ක්‍රීඩකයන් හමු නොවීය.';
  list.appendChild(empty);
  return;
 }

 filtered.forEach(p=>{
  const card=document.createElement('div');
  card.className='player-card';

  const info=document.createElement('div');
  info.className='player-info';

  const avBox=document.createElement('div');
  avBox.className='player-av';
  const avIcon=document.createElement('i');
  const safeAv=isSafeIconClass(p.avatarIcon)?p.avatarIcon:'fa-user';
  avIcon.className=`fa-solid ${safeAv}`;
  avBox.appendChild(avIcon);

  const meta=document.createElement('div');
  const nameEl=document.createElement('b');
  nameEl.textContent=p.name;
  const subEl=document.createElement('small');
  subEl.textContent=`Coins: ${p.points} • Wins: ${p.wins} | Losses: ${p.losses}`;
  meta.append(nameEl,subEl);
  info.append(avBox,meta);

  const actions=document.createElement('div');
  actions.className='player-actions';

  const minusBtn=document.createElement('button');
  minusBtn.className='btn';
  minusBtn.textContent='-50';
  minusBtn.onclick=async()=>{
   const next=Math.max(0,(Number(coinInp.value)||0)-50);
   coinInp.value=next;
   await updatePlayerCoins(p.uid,p.name,next);
  };

  const coinInp=document.createElement('input');
  coinInp.type='number';
  coinInp.className='coin-input';
  coinInp.value=p.points;
  coinInp.min='0';

  const plusBtn=document.createElement('button');
  plusBtn.className='btn';
  plusBtn.textContent='+50';
  plusBtn.onclick=async()=>{
   const next=(Number(coinInp.value)||0)+50;
   coinInp.value=next;
   await updatePlayerCoins(p.uid,p.name,next);
  };

  const saveCoinBtn=document.createElement('button');
  saveCoinBtn.className='btn-green';
  saveCoinBtn.innerHTML='<i class="fa-solid fa-coins"></i> Save';
  saveCoinBtn.onclick=async()=>{
   await updatePlayerCoins(p.uid,p.name,Number(coinInp.value));
  };

  const delBtn=document.createElement('button');
  delBtn.className='btn-danger';
  delBtn.innerHTML='<i class="fa-solid fa-trash"></i> Remove';
  delBtn.onclick=async()=>{
   if(!confirm(`"${p.name}" ක්‍රීඩකයා Database එකෙන් ඉවත් කිරීමට අවශ්‍යද?`))return;
   try{
    const lowerName=p.name.trim().toLowerCase();
    await db.ref('users_v6/'+p.uid).remove();
    await db.ref('publicProfiles_v6/'+p.uid).remove().catch(()=>{});
    if(lowerName)await db.ref('usernameIndex_v6/'+lowerName).remove().catch(()=>{});
    toast(`${p.name} ඉවත් කරන ලදී.`,'fa-trash');
   }catch(err){
    console.error(err);
    toast('ක්‍රීඩකයා ඉවත් කිරීමට නොහැකි විය.');
   }
  };

  actions.append(minusBtn,coinInp,plusBtn,saveCoinBtn,delBtn);
  card.append(info,actions);
  list.appendChild(card);
 });
}

function normalizeItems(rawVal){
 if(!rawVal)return [];
 if(Array.isArray(rawVal)){
  return rawVal
   .map((item,idx)=>item&&typeof item==='object'?{...item,_dbKey:String(idx),_isArray:true}:null)
   .filter(Boolean);
 }
 if(typeof rawVal==='object'){
  return Object.entries(rawVal).map(([key,item])=>({...item,_dbKey:key,_isArray:false}));
 }
 return [];
}

// Piece Theme Live Preview & Add
function updateThemePreview(){
 const prev=$('themePreview');
 const icon=$('themeIcon').value.trim()||'♛';
 const bg=isSafeColor($('themeBg').value)?$('themeBg').value:'#2ecc71';
 const border=isSafeColor($('themeBorder').value)?$('themeBorder').value:'#ffd166';
 const color=isSafeColor($('themeColor').value)?$('themeColor').value:'#ffffff';
 prev.textContent=icon;
 prev.style.background=bg;
 prev.style.border=`3px solid ${border}`;
 prev.style.color=color;
}
['themeIcon','themeBg','themeBorder','themeColor'].forEach(id=>$(id).addEventListener('input',updateThemePreview));
updateThemePreview();

$('addThemeBtn').onclick=async()=>{
 if(!db)return toast('Firebase සම්බන්ධතාවය නොමැත.');
 const name=$('themeName').value.trim();
 const price=Number($('themePrice').value);
 const icon=$('themeIcon').value.trim()||'♛';
 const bg=isSafeColor($('themeBg').value)?$('themeBg').value:'#2ecc71';
 const border=isSafeColor($('themeBorder').value)?$('themeBorder').value:'#ffd166';
 const color=isSafeColor($('themeColor').value)?$('themeColor').value:'#ffffff';

 if(!name)return toast('කරුණාකර Theme නම ඇතුළත් කරන්න.');
 if(!Number.isFinite(price)||price<0)return toast('නිවැරදි මිලක් ඇතුළත් කරන්න.');

 const newTheme={
  id:'custom_piece_'+Date.now(),
  name,
  price:Math.floor(price),
  icon,
  bg,
  border,
  color
 };

 try{
  await db.ref('shopConfig_v6/customPieces').push(newTheme);
  $('themeName').value='';
  toast(`"${name}" Theme එක Shop එකට එක් කරන ලදී!`,'fa-circle-check');
 }catch(err){
  console.error(err);
  toast('Theme එක එක් කිරීමට නොහැකි විය.');
 }
};

// Avatar Live Preview & Add
function updateAvatarPreview(){
 const prev=$('avatarPreview');
 const rawIcon=($('avatarIcon').value.trim()||'fa-crown').replace(/^fa-solid\s+/,'');
 const iconClass=isSafeIconClass(rawIcon)?rawIcon:'fa-crown';
 prev.replaceChildren();
 const iEl=document.createElement('i');
 iEl.className=`fa-solid ${iconClass}`;
 prev.appendChild(iEl);
}
$('avatarIcon').addEventListener('input',updateAvatarPreview);
updateAvatarPreview();

$('addAvatarBtn').onclick=async()=>{
 if(!db)return toast('Firebase සම්බන්ධතාවය නොමැත.');
 const name=$('avatarName').value.trim();
 const price=Number($('avatarPrice').value);
 const rawIcon=($('avatarIcon').value.trim()||'fa-crown').replace(/^fa-solid\s+/,'');
 const iconClass=isSafeIconClass(rawIcon)?rawIcon:'fa-crown';

 if(!name)return toast('කරුණාකර Avatar නම ඇතුළත් කරන්න.');
 if(!Number.isFinite(price)||price<0)return toast('නිවැරදි මිලක් ඇතුළත් කරන්න.');

 const newAvatar={
  id:iconClass,
  name,
  price:Math.floor(price),
  icon:iconClass
 };

 try{
  await db.ref('shopConfig_v6/customAvatars').push(newAvatar);
  $('avatarName').value='';
  toast(`"${name}" Avatar එක Shop එකට එක් කරන ලදී!`,'fa-circle-check');
 }catch(err){
  console.error(err);
  toast('Avatar එක එක් කිරීමට නොහැකි විය.');
 }
};

async function deleteCustomItem(path, item){
 if(!db||!item)return;
 if(item._isArray){
  const listName=path.endsWith('customPieces')?customPieces:customAvatars;
  const filtered=listName.filter(x=>x._dbKey!==item._dbKey).map(({_dbKey,_isArray,...rest})=>rest);
  await db.ref(path).set(filtered);
 }else{
  await db.ref(`${path}/${item._dbKey}`).remove();
 }
}

function renderCustomLists(){
 const tList=$('customThemesList');
 tList.replaceChildren();
 customPieces.forEach(t=>{
  const div=document.createElement('div');
  div.className='custom-item';

  const left=document.createElement('div');
  left.className='custom-item-left';

  const swatch=document.createElement('div');
  swatch.style.cssText='width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:0.85rem;flex-shrink:0';
  swatch.style.background=isSafeColor(t.bg)?t.bg:'#2ecc71';
  swatch.style.border=`2px solid ${isSafeColor(t.border)?t.border:'#ffd166'}`;
  swatch.style.color=isSafeColor(t.color)?t.color:'#ffffff';
  swatch.textContent=t.icon||'♛';

  const label=document.createElement('span');
  label.textContent=`${t.name||'Theme'} (${t.price||0})`;

  left.append(swatch,label);

  const delBtn=document.createElement('button');
  delBtn.className='btn-danger';
  delBtn.style.padding='5px 8px';
  delBtn.title='Delete';
  delBtn.innerHTML='<i class="fa-solid fa-xmark"></i>';
  delBtn.onclick=async()=>{
   try{
    await deleteCustomItem('shopConfig_v6/customPieces',t);
    toast('Theme ඉවත් කරන ලදී.');
   }catch(err){
    toast('ඉවත් කිරීමට නොහැකි විය.');
   }
  };

  div.append(left,delBtn);
  tList.appendChild(div);
 });

 const aList=$('customAvatarsList');
 aList.replaceChildren();
 customAvatars.forEach(a=>{
  const div=document.createElement('div');
  div.className='custom-item';

  const left=document.createElement('div');
  left.className='custom-item-left';

  const badge=document.createElement('div');
  badge.style.cssText='width:28px;height:28px;border-radius:50%;background:rgba(255,209,102,0.14);border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:0.85rem;flex-shrink:0';
  const iconEl=document.createElement('i');
  const safeIcon=isSafeIconClass(a.icon||a.id)?(a.icon||a.id):'fa-crown';
  iconEl.className=`fa-solid ${safeIcon}`;
  badge.appendChild(iconEl);

  const label=document.createElement('span');
  label.textContent=`${a.name||'Avatar'} (${a.price||0})`;

  left.append(badge,label);

  const delBtn=document.createElement('button');
  delBtn.className='btn-danger';
  delBtn.style.padding='5px 8px';
  delBtn.title='Delete';
  delBtn.innerHTML='<i class="fa-solid fa-xmark"></i>';
  delBtn.onclick=async()=>{
   try{
    await deleteCustomItem('shopConfig_v6/customAvatars',a);
    toast('Avatar ඉවත් කරන ලදී.');
   }catch(err){
    toast('ඉවත් කිරීමට නොහැකි විය.');
   }
  };

  div.append(left,delBtn);
  aList.appendChild(div);
 });
}

function attachListeners(){
 if(!db||listenersAttached)return;
 listenersAttached=true;

 db.ref('users_v6').on('value',snap=>{
  const val=snap.val()||{};
  allPlayers=Object.entries(val).map(([uid,data])=>({
   uid,
   name:data&&data.name?String(data.name):'Player',
   points:Number(data&&data.points)||0,
   wins:Number(data&&data.wins)||0,
   losses:Number(data&&data.losses)||0,
   avatarIcon:data&&data.avatarIcon?String(data.avatarIcon):'fa-user'
  }));
  $('playerCountLabel').textContent=`මුළු ක්‍රීඩකයන්: ${allPlayers.length}`;
  renderPlayers();
 });

 db.ref('shopConfig_v6/customPieces').on('value',snap=>{
  customPieces=normalizeItems(snap.val());
  renderCustomLists();
 });

 db.ref('shopConfig_v6/customAvatars').on('value',snap=>{
  customAvatars=normalizeItems(snap.val());
  renderCustomLists();
 });
}

attachListeners();

$('playerSearch').addEventListener('input',renderPlayers);
$('refreshPlayersBtn').onclick=()=>{renderPlayers();toast('ක්‍රීඩක ලැයිස්තුව Refresh විය.','fa-rotate');};
$('goShopBtn').onclick=()=>smoothNavigate('shopandreward.html');
$('exitAdminBtn').onclick=()=>{
 sessionStorage.removeItem('sinhala_draughts_admin_auth');
 smoothNavigate('index.html');
};
</script>
</body>
</html>
