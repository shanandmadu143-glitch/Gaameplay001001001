<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sinhala Draughts Pro - Lobby</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Orbitron:wght@600;700;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070e;
  --panel:rgba(13,19,36,0.92);
  --card:rgba(21,30,54,0.84);
  --gold:#ffd166;
  --gold-2:#ff9f1c;
  --neon-blue:#00f2fe;
  --neon-green:#2ecc71;
  --purple:#9b59b6;
  --red:#ff4757;
  --dim:#9fb0c7;
  --line:rgba(255,209,102,0.22);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Gemunu Libre','Poppins',sans-serif;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100vw;
  min-height:100dvh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 12%, rgba(0,242,254,0.14), transparent 36%),
    radial-gradient(circle at 85% 18%, rgba(255,209,102,0.16), transparent 40%),
    radial-gradient(circle at 50% 85%, rgba(108,92,231,0.18), transparent 45%),
    linear-gradient(180deg, #060913 0%, #04060c 100%);
  color:#f8fafc;
}

.page-sweep{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:3px;
  background:linear-gradient(90deg,var(--neon-blue),var(--gold),#ff9f1c,var(--neon-blue));
  box-shadow:0 0 14px rgba(255,209,102,0.85), 0 0 24px rgba(0,242,254,0.65);
  z-index:300;
  opacity:0;
  transform:scaleX(0);
  transform-origin:left center;
  pointer-events:none;
}
.page-sweep.active{
  opacity:1;
  transform:scaleX(1);
  transition:transform 0.14s cubic-bezier(0.22,1,0.36,1), opacity 0.14s ease-out;
}

.app{
  width:100%;
  max-width:560px;
  min-height:100dvh;
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top, 0px) + 12px)
    calc(env(safe-area-inset-right, 0px) + 14px)
    calc(env(safe-area-inset-bottom, 0px) + 18px)
    calc(env(safe-area-inset-left, 0px) + 14px);
  display:flex;
  flex-direction:column;
  gap:14px;
  opacity:1;
  transform:scale(1);
  transition:opacity 0.15s ease,transform 0.15s ease;
}
.app.page-leaving{
  opacity:0.92;
  transform:scale(0.992);
}

.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  border-radius:14px;
  background:var(--panel);
  border:1.5px solid var(--line);
  font-family:'Orbitron','Gemunu Libre',sans-serif;
  font-size:0.72rem;
  font-weight:800;
  color:var(--gold);
}

.ver-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:12px;
  background:rgba(0,242,254,0.1);
  border:1px solid rgba(0,242,254,0.35);
  color:var(--neon-blue);
  font-family:'Orbitron','Poppins',sans-serif;
  font-size:0.66rem;
  font-weight:800;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  border:1.5px solid rgba(255,209,102,0.42);
  background:linear-gradient(135deg,rgba(24,33,62,0.96),rgba(12,17,34,0.96));
  color:var(--gold);
  font-size:0.95rem;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:transform 0.12s ease,border-color 0.15s ease;
}
.icon-btn:hover{border-color:var(--gold)}
.icon-btn:active{transform:scale(0.94)}

.lobby-hero{
  background:linear-gradient(135deg,rgba(26,37,68,0.95),rgba(13,19,36,0.96) 65%,rgba(16,44,49,0.92));
  border:1.5px solid rgba(255,209,102,0.35);
  border-radius:22px;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  box-shadow:0 10px 26px rgba(0,0,0,0.55);
}

.player-row{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.player-avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffe08a,#ff9f1c);
  color:#111;
  border:2px solid var(--gold);
  display:grid;
  place-items:center;
  font-size:1.35rem;
  flex-shrink:0;
}

.player-meta h1{
  font-size:1.2rem;
  font-weight:800;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.player-meta p{
  font-size:0.78rem;
  color:var(--dim);
  margin-top:2px;
}

.coins-badge{
  padding:7px 12px;
  border-radius:14px;
  background:rgba(6,10,20,0.75);
  border:1.5px solid rgba(255,209,102,0.45);
  color:var(--gold);
  font-family:'Orbitron','Poppins',sans-serif;
  font-size:0.8rem;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.menu-card{
  background:var(--panel);
  border:1.5px solid var(--line);
  border-radius:18px;
  padding:15px 14px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  cursor:pointer;
  text-align:left;
  color:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,0.45);
  transition:transform 0.12s ease,border-color 0.15s ease;
}
.menu-card:hover{border-color:var(--gold)}
.menu-card:active{transform:scale(0.97)}

.menu-card.primary{
  grid-column:1 / -1;
  background:linear-gradient(135deg,rgba(255,159,28,0.22),rgba(21,30,54,0.94));
  border-color:var(--gold);
}

.menu-ic{
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:1.1rem;
  background:rgba(255,209,102,0.14);
  color:var(--gold);
}
.menu-card.primary .menu-ic{
  background:linear-gradient(135deg,#ffe08a,#ff9f1c);
  color:#111;
}

.menu-card b{font-size:1rem;font-weight:800}
.menu-card span{font-size:0.74rem;color:var(--dim)}

.update-strip{
  background:var(--card);
  border:1.5px solid rgba(0,242,254,0.32);
  border-radius:16px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.update-strip b{display:block;font-size:0.86rem;color:#fff}
.update-strip small{display:block;font-size:0.72rem;color:var(--dim)}

.btn-cyan{
  border:0;
  border-radius:12px;
  padding:9px 13px;
  background:linear-gradient(135deg,#00f2fe,#0984e3);
  color:#06101d;
  font-weight:800;
  font-size:0.78rem;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}
</style>
</head>
<body>
<div class="page-sweep" id="pageSweep" aria-hidden="true"></div>
<div class="app" id="appRoot">
 <div class="top-bar">
  <div class="brand-pill">
   <i class="fa-solid fa-chess-board"></i>
   <span>SINHALA DRAUGHTS PRO</span>
  </div>
  <div class="top-actions">
   <span class="ver-pill" id="appVersionBadge"><i class="fa-solid fa-code-branch"></i> v1.0.0</span>
   <button type="button" class="icon-btn" id="openSettingsBtn" title="Settings">
    <i class="fa-solid fa-gear"></i>
   </button>
  </div>
 </div>

 <section class="lobby-hero">
  <div class="player-row">
   <div class="player-avatar" id="lobbyAvatar">
    <i class="fa-solid fa-user"></i>
   </div>
   <div class="player-meta">
    <h1 id="lobbyPlayerName">ක්‍රීඩකයා</h1>
    <p id="lobbyVersionSub">Installed App Version: v1.0.0</p>
   </div>
  </div>
  <div class="coins-badge">
   <i class="fa-solid fa-coins"></i>
   <span id="lobbyPoints">500</span>
  </div>
 </section>

 <section class="menu-grid">
  <button type="button" class="menu-card primary" id="goMultiplayBtn">
   <div class="menu-ic"><i class="fa-solid fa-gamepad"></i></div>
   <b>Play Multiplayer / Arena</b>
   <span>Host / Guest rooms සහ live matches ආරම්භ කරන්න</span>
  </button>

  <button type="button" class="menu-card" id="goProfileBtn">
   <div class="menu-ic"><i class="fa-solid fa-id-badge"></i></div>
   <b>Gaming Profile</b>
   <span>Avatars, piece themes සහ stats</span>
  </button>

  <button type="button" class="menu-card" id="goShopBtn">
   <div class="menu-ic"><i class="fa-solid fa-store"></i></div>
   <b>Shop & Rewards</b>
   <span>Themes & rewards unlock කරන්න</span>
  </button>
 </section>

 <section class="update-strip">
  <div>
   <b id="lobbyUpdateTitle">App Version & Update Status</b>
   <small id="lobbyUpdateDesc">Settings තුළින් නව APK updates පරීක්ෂා කළ හැක</small>
  </div>
  <button type="button" class="btn-cyan" id="goUpdateSettingsBtn">
   <i class="fa-solid fa-download"></i> Updates
  </button>
 </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
'use strict';
const firebaseConfig={apiKey:"AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",authDomain:"bin-card-42614.firebaseapp.com",databaseURL:"https://bin-card-42614-default-rtdb.firebaseio.com",projectId:"bin-card-42614",storageBucket:"bin-card-42614.firebasestorage.app",messagingSenderId:"1063550230753",appId:"1:1063550230753:web:1ad8306405e709ac5b17a0"};
const $=id=>document.getElementById(id);
const USER_KEY='sinhala_draughts_v7_user';
const INSTALLED_VER_KEY='sinhala_draughts_installed_apk_version';

let isNavigating=false;

function normalizeVer(v){
 return String(v || '').trim().replace(/^v/i, '');
}

function readNativeAppVersionInfo(){
 let fallbackVer = normalizeVer(localStorage.getItem(INSTALLED_VER_KEY) || '1.0.0') || '1.0.0';
 let versionCode = '';
 try{
  if(window.AndroidNative && typeof window.AndroidNative.getInstalledAppVersionInfo === 'function'){
   const raw = window.AndroidNative.getInstalledAppVersionInfo();
   if(raw){
    try{
     const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
     if(parsed && typeof parsed === 'object'){
      const vName = normalizeVer(parsed.versionName || parsed.version || parsed.name);
      if(vName) fallbackVer = vName;
      if(parsed.versionCode !== undefined && parsed.versionCode !== null){
       versionCode = String(parsed.versionCode);
      }
     } else {
      const vStr = normalizeVer(raw);
      if(vStr) fallbackVer = vStr;
     }
    }catch(_){
     const vStr = normalizeVer(raw);
     if(vStr) fallbackVer = vStr;
    }
   }
  }
 }catch(_){}
 localStorage.setItem(INSTALLED_VER_KEY, fallbackVer);
 return { versionName: fallbackVer, versionCode };
}

function renderVersionUi(){
 const info = readNativeAppVersionInfo();
 const codeSuffix = info.versionCode ? ` (${info.versionCode})` : '';
 $('appVersionBadge').innerHTML = `<i class="fa-solid fa-code-branch"></i> v${info.versionName}${codeSuffix}`;
 $('lobbyVersionSub').textContent = `Installed App Version: v${info.versionName}${codeSuffix}`;
}

function renderCachedUser(){
 try{
  const raw = localStorage.getItem(USER_KEY);
  if(!raw) return;
  const u = JSON.parse(raw);
  if(u && typeof u === 'object'){
   if(u.name) $('lobbyPlayerName').textContent = u.name;
   if(Number.isFinite(Number(u.points))) $('lobbyPoints').textContent = Number(u.points);
   if(u.avatarIcon){
    const cleanIcon = String(u.avatarIcon).replace(/^fa-solid\s+/, '');
    $('lobbyAvatar').innerHTML = `<i class="fa-solid ${cleanIcon}"></i>`;
   }
  }
 }catch(_){}
}

function smoothNavigate(url){
 if(isNavigating) return;
 isNavigating = true;
 const app = $('appRoot');
 const sweep = $('pageSweep');
 if(sweep){
  sweep.classList.remove('active');
  void sweep.offsetWidth;
  sweep.classList.add('active');
 }
 if(app) app.classList.add('page-leaving');
 window.location.href = url;
}

try{
 if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
 const firestore = firebase.firestore();
 firestore.collection('apk_updates_v6').doc('latest_meta').get().then(doc => {
  if(doc.exists && doc.data() && doc.data().version){
   const serverVer = normalizeVer(doc.data().version);
   const currentVer = readNativeAppVersionInfo().versionName;
   if(serverVer && serverVer !== currentVer){
    $('lobbyUpdateTitle').textContent = `නව APK Update (v${serverVer}) ලබා ගත හැක`;
    $('lobbyUpdateDesc').textContent = `දැනට v${currentVer} — Update කිරීමට Updates ඔබන්න`;
   } else {
    $('lobbyUpdateTitle').textContent = `App එක Latest Version (v${currentVer}) හි ඇත`;
    $('lobbyUpdateDesc').textContent = 'නවතම update එක install කර ඇත';
   }
  }
 }).catch(()=>{});
}catch(_){}

renderCachedUser();
renderVersionUi();

$('openSettingsBtn').onclick = () => smoothNavigate('setting.html');
$('goUpdateSettingsBtn').onclick = () => smoothNavigate('setting.html');
$('goProfileBtn').onclick = () => smoothNavigate('Profile.html');
$('goShopBtn').onclick = () => smoothNavigate('shopandreward.html');
$('goMultiplayBtn').onclick = () => smoothNavigate('multiplay.html');
</script>
<script src="./invite-global.js"></script>
</body>
</html>
