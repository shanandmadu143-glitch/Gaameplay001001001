<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ශ්‍රී ලංකීය දාම් - Multiplayer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070e;--panel:rgba(14,20,38,.92);--gold:#ffd166;--neon-blue:#00f2fe;--neon-green:#2ecc71;--red:#ff4757;--dim:#a0aec0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:radial-gradient(circle at 50% 20%,#1a103c 0%,#080b18 60%,#03050a 100%);color:#f8f9fa;overflow:hidden}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center}

.app{width:100%;height:100dvh;max-width:768px;margin:0 auto;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;overflow:hidden;opacity:1;transform:scale(1);transition:opacity 0.16s ease-out,transform 0.16s ease-out}
.app.page-leaving{opacity:0;transform:scale(0.985)}

.top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:linear-gradient(135deg,rgba(22,30,56,0.95),rgba(10,14,28,0.95));border:2px solid rgba(255,209,102,0.4);border-radius:22px;box-shadow:0 8px 25px rgba(0,0,0,0.6)}
.title-group{display:flex;align-items:center;gap:10px}
.title-group h1{font-size:1.15rem;color:var(--gold);font-weight:800}
.bet-badge{background:rgba(46,204,113,0.16);border:1.5px solid rgba(46,204,113,0.5);color:var(--neon-green);padding:5px 12px;border-radius:16px;font-weight:700;font-size:0.9rem}

.box{flex:1;overflow-y:auto;padding:18px;background:linear-gradient(145deg,rgba(18,24,40,0.88),rgba(12,16,28,0.92));border:2px solid rgba(255,209,102,0.22);border-radius:24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}

.card-option{padding:16px;border-radius:18px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,209,102,0.25);display:flex;flex-direction:column;gap:8px}
.card-option b{font-size:1.05rem;color:var(--gold)}
.card-option p{font-size:0.85rem;color:var(--dim)}

.btn,.btn-gold{border:0;border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform 0.12s ease}
.btn:active,.btn-gold:active{transform:scale(0.97)}
.btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111;box-shadow:0 4px 15px rgba(255,173,98,0.35)}
.row{display:flex;gap:10px}
</style>
</head>
<body>
<div class="app" id="mpRoot">
 <div class="top-bar">
  <div class="title-group">
   <i class="fa-solid fa-swords" style="color:var(--neon-green);font-size:1.3rem"></i>
   <h1>MULTIPLAYER</h1>
  </div>
  <div class="bet-badge"><i class="fa-solid fa-coins"></i> Bet: <span id="betVal">50</span></div>
 </div>

 <div class="box">
  <div style="display:flex;flex-direction:column;gap:12px">
   <div class="card-option">
    <b><i class="fa-solid fa-user-group"></i> යහළුවන් සමඟ තරඟ කරන්න</b>
    <p>ඔබගේ Friends ලැයිස්තුවෙන් ක්‍රීඩකයෙකුට ආරාධනා කර Room එකක් සාදන්න.</p>
    <button class="btn-gold" id="findFriendsBtn"><i class="fa-solid fa-users"></i> Friends වෙත යන්න</button>
   </div>

   <div class="card-option">
    <b><i class="fa-solid fa-bolt"></i> කෙලින්ම Arena වෙත</b>
    <p>සූදානම් Multiplayer Room එකට පිවිසෙන්න.</p>
    <button class="btn" id="directArenaBtn"><i class="fa-solid fa-gamepad"></i> Arena Open</button>
   </div>
  </div>

  <button class="btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Lobby</button>
 </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(window.location.search);
const bet=Number(params.get('bet'))||Number(sessionStorage.getItem('sinhala_draughts_bet'))||50;

$('betVal').textContent=bet;
sessionStorage.setItem('sinhala_draughts_bet',String(bet));

function go(url){
 const root=$('mpRoot');
 if(root)root.classList.add('page-leaving');
 setTimeout(()=>{window.location.href=url;},110);
}

$('findFriendsBtn').onclick=()=>go('friends.html');
$('directArenaBtn').onclick=()=>go(`arena.html?mode=multi&bet=${encodeURIComponent(bet)}`);
$('backBtn').onclick=()=>go('index.html');
</script>
</body>
</html>
