<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ශ්‍රී ලංකීය දාම් - Voice Call</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070e;
  --card-bg:rgba(16,23,44,0.92);
  --gold:#ffd166;
  --neon-blue:#00f2fe;
  --neon-green:#2ecc71;
  --red:#ff4757;
  --dim:#9fb0c8;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;
  background:radial-gradient(circle at 50% 12%,#23134b 0%,#090e1e 58%,#03050a 100%);
  color:#f8fafc;overflow:hidden;display:flex;justify-content:center;align-items:center;
}
.call-wrap{
  width:100%;height:100dvh;max-width:500px;padding:16px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  gap:12px;
}

/* Header */
.call-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 16px;border-radius:20px;
  background:rgba(14,20,38,0.88);border:1.5px solid rgba(255,209,102,0.35);
  box-shadow:0 8px 24px rgba(0,0,0,0.55);
}
.brand-title{display:flex;align-items:center;gap:8px;font-size:1.08rem;font-weight:800;color:var(--gold)}
.badge-state{
  font-size:0.78rem;font-weight:800;padding:4px 11px;border-radius:999px;
  background:rgba(0,242,254,0.14);border:1px solid rgba(0,242,254,0.4);color:var(--neon-blue);
}
.badge-state.live{
  background:rgba(46,204,113,0.18);border-color:rgba(46,204,113,0.55);color:var(--neon-green);
}
.badge-state.ended{
  background:rgba(255,71,87,0.16);border-color:rgba(255,71,87,0.45);color:#ff9aa2;
}

/* Main Call Surface */
.call-surface{
  width:100%;flex:1;max-height:580px;
  background:linear-gradient(155deg,rgba(20,28,52,0.95),rgba(11,16,31,0.97));
  border:2px solid rgba(255,209,102,0.42);border-radius:30px;
  padding:24px 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  box-shadow:0 22px 48px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.08);
  text-align:center;
}

.peer-block{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.avatar-stage{
  width:104px;height:104px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#ffe29a,#ffaa2b);color:#141c33;
  font-size:2.6rem;border:3px solid var(--gold);
  box-shadow:0 0 26px rgba(255,209,102,0.42);position:relative;
  transition:transform 0.2s ease,box-shadow 0.2s ease,border-color 0.2s ease;
}
.avatar-stage.calling::after{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  border:2px solid var(--neon-blue);animation:ringPulse 1.45s infinite ease-out;
}
.avatar-stage.live{
  border-color:var(--neon-green);
  box-shadow:0 0 32px rgba(46,204,113,0.68);
  transform:scale(1.03);
}
@keyframes ringPulse{
  0%{transform:scale(0.94);opacity:0.9}
  100%{transform:scale(1.24);opacity:0}
}

.peer-title{font-size:1.6rem;font-weight:800;color:#ffffff;letter-spacing:0.3px}
.peer-sub{font-size:1rem;font-weight:700;color:var(--neon-blue);min-height:24px}
.live-timer{
  font-size:1.35rem;font-weight:800;color:var(--gold);
  background:rgba(255,209,102,0.1);border:1px solid rgba(255,209,102,0.3);
  padding:3px 14px;border-radius:999px;display:none;
}
.live-timer.show{display:inline-block}

/* Voice Wave Bars */
.wave-bars{
  display:flex;align-items:center;justify-content:center;gap:5px;height:26px;opacity:0.35;
  transition:opacity 0.2s ease;
}
.wave-bars.active{opacity:1}
.wave-bars span{
  width:5px;height:8px;border-radius:999px;
  background:linear-gradient(180deg,var(--neon-green),var(--neon-blue));
}
.wave-bars.active span{animation:waveAnim 0.85s infinite ease-in-out}
.wave-bars span:nth-child(2){animation-delay:0.12s}
.wave-bars span:nth-child(3){animation-delay:0.24s}
.wave-bars span:nth-child(4){animation-delay:0.36s}
.wave-bars span:nth-child(5){animation-delay:0.48s}
@keyframes waveAnim{
  0%,100%{height:7px}
  50%{height:25px}
}

/* Incoming Call Panel (Shown ONLY before user accepts) */
.incoming-panel{
  width:100%;display:none;flex-direction:column;gap:12px;
  background:rgba(0,242,254,0.08);border:1.5px solid rgba(0,242,254,0.38);
  border-radius:20px;padding:14px;
}
.incoming-panel.show{display:flex}
.incoming-heading{font-size:0.98rem;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}

/* Active Call Controls */
.controls-panel{width:100%;display:flex;flex-direction:column;gap:12px}
.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tool-btn{
  border:1.5px solid rgba(255,255,255,0.14);border-radius:18px;
  background:rgba(255,255,255,0.06);color:#f8fafc;
  padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:0.82rem;font-weight:700;cursor:pointer;transition:transform 0.12s,background 0.15s,border-color 0.15s;
}
.tool-btn:active{transform:scale(0.95)}
.tool-btn.muted{background:rgba(255,71,87,0.22);border-color:var(--red);color:#ffa8b0}
.tool-btn.soft{background:rgba(255,209,102,0.14);border-color:rgba(255,209,102,0.45);color:var(--gold)}
.tool-btn i{font-size:1.25rem}

.main-actions{display:flex;gap:10px}
.btn-accept,.btn-end,.btn-back{
  flex:1;border:0;border-radius:18px;padding:13px 14px;
  font-size:1rem;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform 0.12s ease;
}
.btn-accept:active,.btn-end:active,.btn-back:active{transform:scale(0.96)}
.btn-accept{background:linear-gradient(135deg,#2ecc71,#1eb962);color:#06140c;box-shadow:0 8px 22px rgba(46,204,113,0.4)}
.btn-end{background:linear-gradient(135deg,#ff4757,#d63031);color:#fff;box-shadow:0 8px 22px rgba(255,71,87,0.4)}
.btn-back{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)}

.hint-text{font-size:0.78rem;color:var(--dim);text-align:center;line-height:1.4}

#toast{
  position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);opacity:0;
  background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--gold);
  color:#f8f9fa;border-radius:30px;padding:10px 18px;z-index:250;
  transition:0.25s ease;font-weight:600;font-size:0.88rem;
}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>

<div class="call-wrap">
 <div class="call-header">
  <div class="brand-title"><i class="fa-solid fa-headset"></i> Voice Call</div>
  <span class="badge-state" id="callBadge">සූදානම් වෙමින්...</span>
 </div>

 <div class="call-surface">
  <div class="peer-block">
   <div class="avatar-stage calling" id="avatarStage">
    <i class="fa-solid fa-user" id="peerIcon"></i>
   </div>
   <div class="peer-title" id="peerNameLabel">ක්‍රීඩකයා</div>
   <div class="peer-sub" id="callStatusLabel">Call සූදානම් කරමින්...</div>
   <div class="live-timer" id="liveTimer">00:00</div>

   <div class="wave-bars" id="voiceWave">
    <span></span><span></span><span></span><span></span><span></span>
   </div>
  </div>

  <!-- Incoming Call UI (Disappears permanently once accepted) -->
  <div class="incoming-panel" id="incomingPanel">
   <div class="incoming-heading">
    <i class="fa-solid fa-phone-arrow-down-left" style="color:var(--neon-green)"></i>

   </div>
   <div class="main-actions">
    <button type="button" class="btn-accept" id="acceptBtn"><i class="fa-solid fa-phone"></i> Call ගන්න</button>

  <!-- Active Call Controls -->
  <div class="controls-panel">

     <i class="fa-solid fa-microphone" id="muteToggleIcon"></i>
     <span id="muteToggleText">Mute</span>
    </button>
    <button type="button" class="tool-btn" id="speakerToggleBtn">
     <i class="fa-solid fa-volume-high"></i>
     <span id="speakerToggleText">Speaker</span>
    </button>
    <button type="button" class="tool-btn" id="recallBtn">
     <i class="fa-solid fa-rotate-right"></i>

   <div class="main-actions">
    <button type="button" class="btn-end" id="endCallBtn"><i class="fa-solid fa-phone-slash"></i> Call අවසන්</button>
    <button type="button" class="btn-back" id="goBackBtn"><i class="fa-solid fa-arrow-left"></i> ආපසු</button>
   </div>
  </div>
 </div>

 <div class="hint-text">
  සජීවීව කතා කිරීමට දෙදෙනාම Microphone අවසරය (Allow) ලබා දී තිබිය යුතුය.
 </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
'use strict';
const firebaseConfig={apiKey:"AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",authDomain:"bin-card-42614.firebaseapp.com",databaseURL:"https://bin-card-42614-default-rtdb.firebaseio.com",projectId:"bin-card-42614",storageBucket:"bin-card-42614.firebasestorage.app",messagingSenderId:"1063550230753",appId:"1:1063550230753:web:1ad8306405e709ac5b17a0"};
const $=id=>document.getElementById(id);

const rtcConfig={
 iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'stun:stun2.l.google.com:19302'},
  {
   urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],
   username:'openrelayproject',
   credential:'openrelayproject'
  }
 ]
};

const params=new URLSearchParams(window.location.search);
let targetUid=params.get('uid')||params.get('toUid')||'';
let targetName=params.get('name')||params.get('toName')||'ක්‍රීඩකයා';
let incomingCallId=params.get('callId')||'';
let isIncomingFlow=params.get('incoming')==='1' || Boolean(incomingCallId);

let auth,db,fbUser;
let localStream=null;
let remoteStream=null;
let pc=null;
let activeCallPath=null;
let callNodeRef=null;
let callNodeFn=null;
let candNodeRef=null;
let candNodeFn=null;
let seenCandidateKeys=new Set();
let pendingCandidates=[];

let isMuted=false;
let isLoudSpeaker=true;
let hasAcceptedIncoming=false;
let isCallTerminated=false;
let isConnectedLive=false;
let timerId=null;
let elapsedSec=0;

function toast(msg){
 const t=$('toast');
 t.textContent=String(msg);
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),2800);
}

function setUiState(statusText, badgeText, mode='connecting'){
 $('callStatusLabel').textContent=statusText;
 $('callBadge').textContent=badgeText;
 $('callBadge').classList.remove('live','ended');
 $('avatarStage').classList.remove('calling','live');
 $('voiceWave').classList.remove('active');

 if(mode === 'live'){
  $('callBadge').classList.add('live');
  $('avatarStage').classList.add('live');
  $('voiceWave').classList.add('active');
 }else if(mode === 'calling'){
  $('avatarStage').classList.add('calling');
 }else if(mode === 'ended'){
  $('callBadge').classList.add('ended');
 }
}

function hideIncomingUiForever(){
 hasAcceptedIncoming=true;
 isIncomingFlow=false;
 $('incomingPanel').classList.remove('show');
}

function startCallTimer(){
 if(timerId)return;
 elapsedSec=0;
 $('liveTimer').classList.add('show');
 $('liveTimer').textContent='00:00';
 timerId=setInterval(()=>{
  elapsedSec+=1;
  const m=String(Math.floor(elapsedSec/60)).padStart(2,'0');
  const s=String(elapsedSec%60).padStart(2,'0');
  $('liveTimer').textContent=`${m}:${s}`;
 },1000);
}

function stopCallTimer(){
 if(timerId){
  clearInterval(timerId);
  timerId=null;
 }
 isConnectedLive=false;
 $('liveTimer').classList.remove('show');
}

function unlockAndPlayRemoteAudio(){
 const el=$('remoteAudio');
 if(!el)return;
 el.muted=false;
 el.volume=isLoudSpeaker ? 1.0 : 0.65;
 if(remoteStream && el.srcObject !== remoteStream){
  el.srcObject=remoteStream;
 }
 const req=el.play();
 if(req && typeof req.catch==='function'){
  req.catch(()=>{});
 }
}

document.addEventListener('pointerdown',unlockAndPlayRemoteAudio,{passive:true});

function enterLiveConversation(){
 if(isConnectedLive)return;
 isConnectedLive=true;
 hideIncomingUiForever();
 unlockAndPlayRemoteAudio();
 startCallTimer();
 setUiState(`${targetName} සමඟ සජීවීව කතා කරමින්...`, 'Live', 'live');
}

async function acquireMic(){
 if(localStream){
  localStream.getAudioTracks().forEach(t=>{t.enabled=!isMuted;});
  return localStream;
 }
 if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  throw new Error('Microphone සහාය නොමැත.');
 }
 localStream=await navigator.mediaDevices.getUserMedia({
  audio:{
   echoCancellation:true,
   noiseSuppression:true,
   autoGainControl:true,
   channelCount:1
  },
  video:false
 });
 localStream.getAudioTracks().forEach(t=>{t.enabled=!isMuted;});
 return localStream;
}

async function applyRemoteCandidate(key, rawCand){
 if(!rawCand || !pc)return;
 if(key && seenCandidateKeys.has(key))return;
 if(key)seenCandidateKeys.add(key);

 const ice=new RTCIceCandidate(rawCand);
 if(pc.remoteDescription && pc.remoteDescription.type){
  await pc.addIceCandidate(ice).catch(()=>{});
 }else{
  pendingCandidates.push(ice);
 }
}

async function flushIceQueue(){
 if(!pc || !pc.remoteDescription || !pc.remoteDescription.type)return;
 while(pendingCandidates.length){
  const item=pendingCandidates.shift();
  await pc.addIceCandidate(item).catch(()=>{});
 }
}

function setupPeerConnection(path, role){
 if(pc){
  try{pc.close();}catch(_){}
  pc=null;
 }
 seenCandidateKeys=new Set();
 pendingCandidates=[];

 remoteStream=new MediaStream();
 const audioEl=$('remoteAudio');
 audioEl.srcObject=remoteStream;
 audioEl.autoplay=true;
 audioEl.playsInline=true;

 pc=new RTCPeerConnection(rtcConfig);

 if(localStream){
  localStream.getTracks().forEach(track=>pc.addTrack(track, localStream));
 }

 pc.ontrack=ev=>{
  if(ev.streams && ev.streams[0]){
   ev.streams[0].getTracks().forEach(tr=>{
    if(!remoteStream.getTracks().some(x=>x.id===tr.id)){
     remoteStream.addTrack(tr);
    }
   });
  }else if(ev.track){
   if(!remoteStream.getTracks().some(x=>x.id===ev.track.id)){
    remoteStream.addTrack(ev.track);
   }
  }
  $('remoteAudio').srcObject=remoteStream;
  unlockAndPlayRemoteAudio();
  enterLiveConversation();
 };

 pc.onicecandidate=ev=>{
  if(ev.candidate && db && path){
   const bucket=role === 'caller' ? 'callerCandidates' : 'calleeCandidates';
   db.ref(`${path}/${bucket}`).push(ev.candidate.toJSON()).catch(()=>{});
  }
 };

 pc.oniceconnectionstatechange=()=>{
  if(!pc)return;
  if(pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed'){
   enterLiveConversation();
  }else if(pc.iceConnectionState === 'failed'){
   setUiState('Network සම්බන්ධතාවය අසාර්ථකයි', 'Failed', 'ended');
  }
 };

 pc.onconnectionstatechange=()=>{
  if(!pc)return;
  if(pc.connectionState === 'connected'){
   enterLiveConversation();
  }else if(pc.connectionState === 'disconnected' || pc.connectionState === 'failed'){
   setUiState('Call සම්බන්ධතාවය විසන්ධි විය', 'Ended', 'ended');
  }
 };

 const remoteBucket=role === 'caller' ? 'calleeCandidates' : 'callerCandidates';
 if(candNodeRef && candNodeFn){
  try{candNodeRef.off('child_added',candNodeFn);}catch(_){}
 }
 candNodeRef=db.ref(`${path}/${remoteBucket}`);
 candNodeFn=snap=>{
  applyRemoteCandidate(snap.key, snap.val());
 };
 candNodeRef.on('child_added',candNodeFn);

 candNodeRef.once('value',async snap=>{
  const mapObj=snap.val()||{};
  for(const k of Object.keys(mapObj)){
   await applyRemoteCandidate(k, mapObj[k]);
  }
 }).catch(()=>{});

 return pc;
}

function attachCallWatcher(path, role){
 if(callNodeRef && callNodeFn){
  try{callNodeRef.off('value',callNodeFn);}catch(_){}
 }
 callNodeRef=db.ref(path);
 callNodeFn=async snap=>{
  const data=snap.val();
  if(!data){
   if(!isCallTerminated){
    await teardownCall(false);
    setUiState('Call එක අවසන් කරන ලදී', 'Ended', 'ended');
   }
   return;
  }

  if(role === 'caller' && data.toName){
   targetName=data.toName;
   $('peerNameLabel').textContent=targetName;
  }else if(role === 'callee' && data.fromName){
   targetName=data.fromName;
   $('peerNameLabel').textContent=targetName;
  }

  if(data.status === 'rejected' || data.status === 'ended'){
   await teardownCall(false);
   setUiState(data.status === 'rejected' ? `${targetName} Call එක ප්‍රතික්ෂේප කළේය` : 'Call එක අවසන් විය', 'Ended', 'ended');
   return;
  }

  if(role === 'caller' && data.answer && pc && (!pc.remoteDescription || !pc.remoteDescription.type)){
   await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
   await flushIceQueue();
   unlockAndPlayRemoteAudio();
   setUiState(`${targetName} සමඟ සම්බන්ධ වෙමින්...`, 'Connecting', 'calling');
  }
 };
 callNodeRef.on('value',callNodeFn);
}

async function beginOutgoingCall(){
 if(!fbUser || !db || !targetUid){
  return setUiState('ක්‍රීඩක තොරතුරු හමු නොවීය', 'Error', 'ended');
 }
 isCallTerminated=false;
 hideIncomingUiForever();
 setUiState(`${targetName} වෙත Call කරමින්...`, 'Calling', 'calling');

 try{
  await acquireMic();
  unlockAndPlayRemoteAudio();
  const callId='call_'+Date.now()+'_'+fbUser.uid.slice(0,6);
  activeCallPath=`calls_v6/${targetUid}/${callId}`;

  const conn=setupPeerConnection(activeCallPath, 'caller');
  const offer=await conn.createOffer({offerToReceiveAudio:true});
  await conn.setLocalDescription(offer);

  await db.ref(activeCallPath).set({
   callId,
   fromUid:fbUser.uid,
   fromName:fbUser.displayName || (fbUser.email||'').split('@')[0] || 'Player',
   toUid:targetUid,
   toName:targetName,
   status:'calling',
   offer:{type:offer.type, sdp:offer.sdp},
   timestamp:Date.now()
  });

  attachCallWatcher(activeCallPath, 'caller');
 }catch(err){
  console.error('Outgoing call failed:',err);
  setUiState('Microphone හෝ Call ආරම්භය අසාර්ථකයි', 'Error', 'ended');
  toast(err.message || 'Call ආරම්භ කළ නොහැක.');
 }
}

async function loadIncomingCallPrompt(){
 if(!fbUser || !db || !incomingCallId)return;
 isCallTerminated=false;
 activeCallPath=`calls_v6/${fbUser.uid}/${incomingCallId}`;

 const snap=await db.ref(activeCallPath).once('value');
 const data=snap.val();
 if(!data || !data.offer){
  hideIncomingUiForever();
  setUiState('Incoming Call එක අවසන් වී ඇත', 'Ended', 'ended');
  return;
 }

 targetUid=data.fromUid || targetUid;
 targetName=data.fromName || targetName;
 $('peerNameLabel').textContent=targetName;

 if(!hasAcceptedIncoming){
  $('incomingPanel').classList.add('show');
  setUiState(`${targetName} ඔබට Call කරයි...`, 'Incoming', 'calling');
 }
 attachCallWatcher(activeCallPath, 'callee');
}

$('acceptBtn').onclick=async()=>{
 if(!fbUser || !db || !activeCallPath)return;

 // Immediately hide incoming prompt so it never shows again after accepting
 hideIncomingUiForever();
 setUiState(`${targetName} සමඟ සම්බන්ධ වෙමින්...`, 'Connecting', 'calling');

 try{
  await acquireMic();
  unlockAndPlayRemoteAudio();

  const snap=await db.ref(activeCallPath).once('value');
  const callData=snap.val();
  if(!callData || !callData.offer){
   return setUiState('Call එක අවසන් වී ඇත', 'Ended', 'ended');
  }

  const conn=setupPeerConnection(activeCallPath, 'callee');
  await conn.setRemoteDescription(new RTCSessionDescription(callData.offer));
  await flushIceQueue();

  const answer=await conn.createAnswer();
  await conn.setLocalDescription(answer);

  await db.ref(activeCallPath).update({
   status:'accepted',
   answer:{type:answer.type, sdp:answer.sdp}
  });
 }catch(err){
  console.error('Accept call failed:',err);
  setUiState('Call සම්බන්ධ කිරීම අසාර්ථකයි', 'Error', 'ended');
  toast(err.message || 'Microphone අවසරය අවශ්‍යයි.');
 }
};

$('rejectBtn').onclick=async()=>{
 hideIncomingUiForever();
 if(db && activeCallPath){
  await db.ref(activeCallPath).update({status:'rejected'}).catch(()=>{});
 }
 await teardownCall(true);
 setUiState('Call එක ප්‍රතික්ෂේප කරන ලදී', 'Rejected', 'ended');
};

$('muteToggleBtn').onclick=()=>{
 if(!localStream)return toast('Microphone තවම සක්‍රීය වී නැත.');
 isMuted=!isMuted;
 localStream.getAudioTracks().forEach(t=>{t.enabled=!isMuted;});
 $('muteToggleBtn').classList.toggle('muted', isMuted);
 $('muteToggleIcon').className=isMuted ? 'fa-solid fa-microphone-slash' : 'fa-solid fa-microphone';
 $('muteToggleText').textContent=isMuted ? 'Unmute' : 'Mute';
};

$('speakerToggleBtn').onclick=()=>{
 isLoudSpeaker=!isLoudSpeaker;
 unlockAndPlayRemoteAudio();
 $('speakerToggleBtn').classList.toggle('soft', !isLoudSpeaker);
 $('speakerToggleText').textContent=isLoudSpeaker ? 'Speaker' : 'Soft';
 toast(isLoudSpeaker ? 'Speaker Loud Mode' : 'Soft Volume Mode');
};

$('recallBtn').onclick=async()=>{
 if(!targetUid)return toast('ක්‍රීඩකයෙකු තෝරා නැත.');
 await teardownCall(true);
 beginOutgoingCall();
};

async function teardownCall(deleteNode){
 isCallTerminated=true;
 stopCallTimer();

 if(callNodeRef && callNodeFn){
  try{callNodeRef.off('value',callNodeFn);}catch(_){}
  callNodeRef=null;
  callNodeFn=null;
 }
 if(candNodeRef && candNodeFn){
  try{candNodeRef.off('child_added',candNodeFn);}catch(_){}
  candNodeRef=null;
  candNodeFn=null;
 }
 if(pc){
  try{pc.close();}catch(_){}
  pc=null;
 }
 if(localStream){
  localStream.getTracks().forEach(t=>t.stop());
  localStream=null;
 }
 if(remoteStream){
  remoteStream.getTracks().forEach(t=>t.stop());
  remoteStream=null;
 }
 $('remoteAudio').srcObject=null;

 if(deleteNode && db && activeCallPath){
  await db.ref(activeCallPath).remove().catch(()=>{});
 }
 activeCallPath=null;
}

$('endCallBtn').onclick=async()=>{
 hideIncomingUiForever();
 if(db && activeCallPath){
  await db.ref(activeCallPath).update({status:'ended'}).catch(()=>{});
 }
 await teardownCall(true);
 setUiState('Call එක අවසන් කරන ලදී', 'Ended', 'ended');
};

$('goBackBtn').onclick=async()=>{
 hideIncomingUiForever();
 if(db && activeCallPath){
  await db.ref(activeCallPath).update({status:'ended'}).catch(()=>{});
 }
 await teardownCall(true);
 if(window.history.length > 1){
  window.history.back();
 }else{
  window.location.href='index.html';
 }
};

window.addEventListener('beforeunload',()=>{
 teardownCall(false);
});

$('peerNameLabel').textContent=targetName;

try{
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();
 db=firebase.database();

 auth.onAuthStateChanged(async u=>{
  fbUser=u;
  if(!u){
   setUiState('කරුණාකර ගිණුමට ඇතුළු වන්න', 'Auth Required', 'ended');
   return;
  }
  if(isIncomingFlow && incomingCallId){
   await loadIncomingCallPrompt();
  }else if(targetUid){
   await beginOutgoingCall();
  }else{
   setUiState('Call කිරීමට ක්‍රීඩකයෙකු තෝරන්න', 'Ready', 'calling');
  }
 });
}catch(e){
 console.error('Callfriend init error:',e);
 setUiState('Firebase සම්බන්ධතාවය අසාර්ථකයි', 'Error', 'ended');
}
</script>
</body>
</html>
