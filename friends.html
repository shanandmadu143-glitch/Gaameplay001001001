<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>යහළුවන් - Sinhala Draughts Pro Gaming</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070e;--panel:rgba(14,20,38,.92);--gold:#ffd166;--neon-blue:#00f2fe;--neon-green:#2ecc71;--red:#ff4757;--dim:#a0aec0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100dvh;max-width:100vw;background:radial-gradient(circle at 50% 20%,#1a103c 0%,#080b18 60%,#03050a 100%);color:#f8f9fa;overflow:hidden}
body{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center}

/* Hidden Header & Bottom Menu */
.top-bar,
.bottom-nav{
  display:none !important;
}

.app{
  width:100vw;
  height:100dvh;
  max-width:100vw;
  margin:0;
  padding:
    calc(env(safe-area-inset-top, 0px) + 12px)
    calc(env(safe-area-inset-right, 0px) + 14px)
    calc(env(safe-area-inset-bottom, 0px) + 12px)
    calc(env(safe-area-inset-left, 0px) + 14px);
  display:flex;
  flex-direction:column;
  justify-content:stretch;
  position:fixed;
  inset:0;
  overflow:hidden;
  opacity:1;
  transform:scale(1);
  transition:opacity 0.16s ease-out,transform 0.16s ease-out;
}
.app.page-leaving{
  opacity:0;
  transform:scale(0.985);
}

main{flex:1;width:100%;height:100%;min-height:0;display:flex;flex-direction:column;position:relative;margin:0;overflow:hidden}
.friends-container{width:100%;height:100%;display:flex;flex-direction:column;gap:12px;padding:14px;background:linear-gradient(145deg,rgba(18,24,40,0.88),rgba(12,16,28,0.92));border:2px solid rgba(255,209,102,0.22);border-radius:24px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,0.5);overflow:hidden}

.search-box{display:flex;gap:8px;align-items:center;width:100%;flex-shrink:0}
.home-back-icon-btn{
  width:46px;
  height:46px;
  flex-shrink:0;
  border-radius:14px;
  border:1.5px solid rgba(255,209,102,0.45);
  background:linear-gradient(135deg,rgba(24,33,62,0.96),rgba(12,17,34,0.96));
  color:var(--gold);
  font-size:1.05rem;
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
  transition:transform 0.12s ease,border-color 0.15s ease,background 0.15s ease,box-shadow 0.15s ease;
}
.home-back-icon-btn:hover{
  border-color:var(--gold);
  background:linear-gradient(135deg,rgba(255,209,102,0.2),rgba(20,28,54,0.96));
  box-shadow:0 0 16px rgba(255,209,102,0.28);
}
.home-back-icon-btn:active{
  transform:scale(0.94);
}

.search-box input{flex:1;min-width:0;width:100%;padding:12px 16px;background:rgba(0,0,0,0.4);border:1.5px solid rgba(255,209,102,0.3);border-radius:14px;color:white;font-size:0.95rem;outline:none;transition:all 0.3s}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 10px rgba(255,209,102,0.2)}
.search-box button.btn-gold{padding:12px 16px;border-radius:14px;font-size:0.9rem;white-space:nowrap;flex-shrink:0}

.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(255,209,102,0.3) transparent}
.list::-webkit-scrollbar{width:4px}
.list::-webkit-scrollbar-thumb{background:rgba(255,209,102,0.3);border-radius:4px}

.friend-card{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.08);padding:10px 14px;border-radius:16px;transition:all 0.25s ease;gap:10px}
.friend-card:hover{border-color:rgba(255,209,102,0.4);background:rgba(255,255,255,0.06)}
.friend-info{display:flex;align-items:center;gap:12px;flex:1;min-width:0}

.avatar-wrapper{position:relative;width:44px;height:44px;flex-shrink:0}
.friend-avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;border:2px solid var(--gold);box-shadow:0 0 10px rgba(0,0,0,0.5)}
.status-dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;border:2px solid #121828}
.status-dot.online{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
.status-dot.offline{background:var(--dim)}

.friend-details{flex:1;min-width:0}
.friend-details b{display:block;color:#fff;font-size:0.95rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta{font-size:0.75rem;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:2px;white-space:nowrap}

.btn-invite{border:0;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111;box-shadow:0 4px 15px rgba(255,173,98,0.3);transition:all 0.2s;flex-shrink:0;font-size:0.85rem}
.btn-invite:active{transform:scale(0.95)}

.modal{position:fixed;inset:0;background:rgba(3,5,12,0.85);backdrop-filter:blur(8px);display:none;place-items:center;z-index:100;padding:15px}
.modal.show{display:grid}
.modalbox{width:min(100%,400px);background:linear-gradient(145deg,#121828,#1b243f);border:2px solid var(--gold);border-radius:24px;padding:22px;display:grid;gap:14px;box-shadow:0 20px 40px rgba(0,0,0,0.8)}
.modalbox h3{text-align:center;color:var(--gold);font-weight:700;font-size:1.15rem}
.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2)}
.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111;box-shadow:0 4px 15px rgba(255,173,98,0.4);border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}

#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);opacity:0;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--gold);color:#f8f9fa;border-radius:30px;padding:10px 20px;z-index:150;transition:.3s;font-weight:600;display:flex;align-items:center;gap:8px;font-size:0.9rem}
#toast.show{transform:translate(-50%,0);opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width: 420px) {
  .home-back-icon-btn{width:42px;height:42px;border-radius:12px;font-size:1rem}
  .search-box input{padding:10px 12px;font-size:0.9rem}
  .search-box button.btn-gold{padding:10px 13px}
}
@media (min-width: 600px) {
  .friends-container { padding: 20px; }
  .friend-card { padding: 12px 18px; }
  .avatar-wrapper, .friend-avatar { width: 50px; height: 50px; }
  .friend-details b { font-size: 1.05rem; }
  .player-meta { font-size: 0.82rem; }
}
</style>
</head>

];

function createInitialBoard() {
 const b = Array.from({length:8},()=>Array(8).fill(0));
 for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){if(r<3)b[r][c]=-1;else if(r>4)b[r][c]=1}
 return b;
}

function toast(s, icon='fa-circle-info'){
 const t=$('toast');
 t.replaceChildren();
 const iconEl=document.createElement('i');iconEl.className=`fa-solid ${icon}`;iconEl.style.color='var(--gold)';
 const textEl=document.createElement('span');textEl.textContent=String(s);
 t.append(iconEl,textEl);
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),3000);
}
function modal(id,on){$(id).classList.toggle('show',on);}

function smoothNavigate(url){
 if(isNavigating)return;
 isNavigating=true;
 const app=$('appRoot');
 if(app)app.classList.add('page-leaving');
 setTimeout(()=>{window.location.href=url;},110);
}

try{
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();
 db=firebase.database();
}catch(e){console.error('Firebase error:',e);}

auth.onAuthStateChanged(async u=>{
 if(u) {
  fbUser=u;
  try {
   const snap=await db.ref('users_v6/'+u.uid).once('value');
   const d=snap.val();
   if(d) {
    user={name:d.name,points:Number(d.points)||500,uid:u.uid,pieceIndex:Number(d.pieceIndex)||0,avatarIcon:d.avatarIcon||'fa-user'};
   } else {
    user.name = (u.email||'').split('@')[0] || 'Player';
    user.uid = u.uid;
   }

   const profileData = {
    name: user.name,
    points: user.points,
    pieceIndex: user.pieceIndex,
    avatarIcon: user.avatarIcon
   };
   await db.ref('publicProfiles_v6/'+u.uid).update(profileData).catch(()=>{});
   await db.ref('users_v6/'+u.uid).update(profileData).catch(()=>{});

   const userStatusDatabaseRef = db.ref('status_v6/' + u.uid);
   db.ref('.info/connected').on('value', snapshot => {
    if (snapshot.val() === false) return;
    userStatusDatabaseRef.onDisconnect().set({ state: 'offline', last_changed: firebase.database.ServerValue.TIMESTAMP });
    userStatusDatabaseRef.set({ state: 'online', last_changed: firebase.database.ServerValue.TIMESTAMP });
   });

   loadAllPlayers('');
  } catch(err) {
   console.error('Auth state load error:', err);
   loadAllPlayers('');
  }
 } else {
  window.location.href = 'index.html';
 }
});

async function loadAllPlayers(rawQuery) {
 const queryName = String(rawQuery || '').trim().toLowerCase();
 const resultsContainer = $('results');
 resultsContainer.innerHTML = '<div style="text-align:center;padding:20px;color:var(--dim)"><div style="width:30px;height:30px;margin:0 auto 10px;border:3px solid rgba(255,255,255,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite"></div>ක්‍රීඩකයන් පූරණය වෙමින්...</div>';

 try {
  const usersSnap = await db.ref('users_v6').once('value').catch(()=>null);
  const profilesSnap = await db.ref('publicProfiles_v6').once('value').catch(()=>null);
  const statusSnap = await db.ref('status_v6').once('value').catch(()=>null);

  let profiles = profilesSnap && profilesSnap.exists() ? profilesSnap.val() : {};
  const users = usersSnap && usersSnap.exists() ? usersSnap.val() : {};

  Object.keys(users).forEach(uid => {
   if(!profiles[uid]) {
    profiles[uid] = users[uid];
   }
  });

  if (!profiles || Object.keys(profiles).length === 0) {
   resultsContainer.innerHTML = '<div style="text-align:center;padding:30px;color:var(--dim)">ක්‍රීඩකයන් හමු නොවීය.</div>';
   return;
  }

  const statuses = statusSnap && statusSnap.exists() ? statusSnap.val() : {};
  resultsContainer.innerHTML = '';
  let found = false;

  Object.keys(profiles).forEach(uid => {
   const pData = profiles[uid];
   const candidateName = pData && pData.name ? String(pData.name) : '';

   if(fbUser && uid === fbUser.uid) return;
   if(candidateName.toLowerCase() === 'admin') return;

   if(candidateName && (!queryName || candidateName.toLowerCase().includes(queryName))) {
    found = true;

    const userStatus = statuses[uid];
    const isOnline = userStatus && userStatus.state === 'online';

    const designIndex = Number(pData.pieceIndex) || 0;
    const design = PIECE_DESIGNS[designIndex] || PIECE_DESIGNS[0];
    const avatarIcon = pData.avatarIcon || 'fa-user';

    const card = document.createElement('div');
    card.className = 'friend-card';

    const infoDiv = document.createElement('div');
    infoDiv.className = 'friend-info';

    const avatarWrapper = document.createElement('div');
    avatarWrapper.className = 'avatar-wrapper';

    const avatarEl = document.createElement('div');
    avatarEl.className = 'friend-avatar';
    avatarEl.style.background = design.bg;
    avatarEl.style.borderColor = design.border;
    avatarEl.style.color = design.color;
    avatarEl.innerHTML = `<i class="fa-solid ${avatarIcon}"></i>`;

    const statusDot = document.createElement('div');
    statusDot.className = `status-dot ${isOnline ? 'online' : 'offline'}`;
    statusDot.title = isOnline ? 'Online' : 'Offline';

    avatarWrapper.append(avatarEl, statusDot);

    const textWrap = document.createElement('div');
    textWrap.className = 'friend-details';

    const playerName = document.createElement('b');
    playerName.textContent = candidateName;

    const playerMeta = document.createElement('div');
    playerMeta.className = 'player-meta';
    playerMeta.innerHTML = `<i class="fa-solid fa-coins" style="color:var(--gold)"></i> ${Number(pData.points) || 0} pts <span>•</span> <span style="color:${isOnline ? 'var(--neon-green)' : 'var(--dim)'};font-weight:600">${isOnline ? 'Online' : 'Offline'}</span>`;

    textWrap.append(playerName, playerMeta);
    infoDiv.append(avatarWrapper, textWrap);
    card.appendChild(infoDiv);

    const inviteBtn = document.createElement('button');
    inviteBtn.className = 'btn-invite';
    inviteBtn.innerHTML = '<i class="fa-solid fa-gamepad"></i> Invite';
    inviteBtn.onclick = () => sendGameInvite(uid, candidateName);

    card.appendChild(inviteBtn);
    resultsContainer.appendChild(card);
   }
  });

  if(!found) {
   resultsContainer.innerHTML = `<div style="text-align:center;padding:30px;color:var(--dim)">${queryName ? 'අදාළ නමින් ක්‍රීඩකයන් හමු නොවීය.' : 'වෙනත් ක්‍රීඩකයන් තවම ලියාපදිංචි වී නැත.'}</div>`;
  }
 } catch(err) {
  console.error('Load players error:', err);
  resultsContainer.innerHTML = '<div style="text-align:center;padding:30px;color:var(--red)">දෝෂයක් සිදු විය. Firebase Rules පරීක්ෂා කරන්න.</div>';
 }
}

$('searchBtn').onclick = () => loadAllPlayers($('search').value);
$('search').addEventListener('input', () => loadAllPlayers($('search').value));
$('homeBackBtn').onclick = () => smoothNavigate('index.html');

async function sendGameInvite(friendUid, friendName) {
 if(!fbUser || !db) return toast('ගිණුමට ඇතුළු වී සිටින්න.');
 if(currentBet > user.points) return toast('ඔබ සතුව ප්‍රමාණවත් Points නොමැත.');

 if(activeInviteWatcher) {
  activeInviteWatcher.ref.off('value', activeInviteWatcher.handler);
  activeInviteWatcher = null;
 }

 const newInviteRef = db.ref('invites_v6/' + friendUid).push();
 const inviteId = newInviteRef.key;
 const initialBoard = createInitialBoard();

 const targetRoomRef = db.ref('rooms_v6/' + inviteId);
 const now = Date.now();

 try {
  await targetRoomRef.set({
   roomId: inviteId,
   board: initialBoard,
   turn: 1,
   forcedContinuation: null,
   lastMove: null,
   hostUid: fbUser.uid,
   guestUid: friendUid,
   hostName: user.name,
   guestName: friendName,
   hostPieceIndex: user.pieceIndex || 0,
   hostAvatar: user.avatarIcon || 'fa-user',
   guestPieceIndex: 0,
   guestAvatar: 'fa-user',
   bet: currentBet,
   status: 'waiting',
   matchStarted: false,
   createdAt: now,
   updatedAt: firebase.database.ServerValue.TIMESTAMP
  });

  await newInviteRef.set({
   roomId: inviteId,
   fromUid: fbUser.uid,
   fromName: user.name,
   hostName: user.name,
   bet: currentBet,
   status: 'pending',
   createdAt: now,
   timestamp: now
  });

  if (window.SinhalaDraughtsInviteBridge) {
   window.SinhalaDraughtsInviteBridge.trackHostRoom(inviteId, currentBet);
  }

  $('waitingHostText').textContent = `${friendName} ආරාධනය පිළිගන්නා තෙක් රැඳී සිටින්න...`;
  modal('waitingHostModal', true);

  const handler = snap => {
   const roomData = snap.val();
   if(!roomData) return;

   if(roomData.status === 'playing' || roomData.status === 'active' || roomData.status === 'accepted' || roomData.matchStarted === true) {
    targetRoomRef.off('value', handler);
    activeInviteWatcher = null;
    modal('waitingHostModal', false);
    const resolvedGuestName = roomData.guestName || friendName;
    if (window.SinhalaDraughtsInviteBridge) {
     window.SinhalaDraughtsInviteBridge.goArena(inviteId, roomData.bet || currentBet, 'host', {
      ...roomData,
      hostName: roomData.hostName || user.name,
      guestName: resolvedGuestName
     });
    } else {
     window.location.replace(`arena.html?mode=multi&roomId=${encodeURIComponent(inviteId)}&role=host&bet=${encodeURIComponent(roomData.bet || currentBet)}&oppName=${encodeURIComponent(resolvedGuestName)}`);
    }
   } else if(roomData.status === 'rejected' || roomData.status === 'declined' || roomData.status === 'cancelled') {
    targetRoomRef.off('value', handler);
    activeInviteWatcher = null;
    modal('waitingHostModal', false);
    if (window.SinhalaDraughtsInviteBridge) {
     window.SinhalaDraughtsInviteBridge.clearHostRoom();
    }
    targetRoomRef.remove().catch(()=>{});
    toast(`${friendName} ආරාධනය ප්‍රතික්ෂේප කළා.`);
   }
  };

  targetRoomRef.on('value', handler);
  activeInviteWatcher = { ref: targetRoomRef, handler: handler, inviteRef: newInviteRef };

 } catch(err) {
  console.error('Invite error:', err);
  modal('waitingHostModal', false);
  toast('ආරාධනය යැවීමට නොහැකි විය.');
 }
}

$('cancelInviteBtn').onclick = () => {
 modal('waitingHostModal', false);
 if (window.SinhalaDraughtsInviteBridge) {
  window.SinhalaDraughtsInviteBridge.clearHostRoom();
 }
 if(activeInviteWatcher) {
  activeInviteWatcher.ref.off('value', activeInviteWatcher.handler);
  activeInviteWatcher.ref.update({ status: 'cancelled' }).catch(()=>{});
  activeInviteWatcher.ref.remove().catch(()=>{});
  activeInviteWatcher.inviteRef.remove().catch(()=>{});
  activeInviteWatcher = null;
 }
 toast('ආරාධනය අවලංගු කරන ලදී.');
};
</script>
