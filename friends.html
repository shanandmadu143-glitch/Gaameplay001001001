function toast(s, icon='fa-circle-info'){
 const t=$('toast');
 t.replaceChildren();
 const iconEl=document.createElement('i');iconEl.className=`fa-solid ${icon}`;iconEl.style.color='var(--gold)';
 const textEl=document.createElement('span');textEl.textContent=String(s);
 t.append(iconEl,textEl);
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),3000);
}

try{
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();
 db=firebase.database();
}catch(e){console.error('Firebase error:',e);}

auth.onAuthStateChanged(async u=>{
 if(u) {
  fbUser=u;
  try {
   const snap=await db.ref('users_v6/'+u.uid).once('value');
   const d=snap.val();
   if(d) {
    user={name:d.name,points:Number(d.points)||500,uid:u.uid,pieceIndex:Number(d.pieceIndex)||0,avatarIcon:d.avatarIcon||'fa-user'};
   } else {
    user.name = (u.email||'').split('@')[0] || 'Player';
    user.uid = u.uid;
   }
   
   // Sync both users_v6 and publicProfiles_v6 to ensure data consistency
   const profileData = {
    name: user.name,
    points: user.points,
    pieceIndex: user.pieceIndex,
    avatarIcon: user.avatarIcon
   };
   await db.ref('publicProfiles_v6/'+u.uid).set(profileData);

   // Setup online presence
   const userStatusDatabaseRef = db.ref('status_v6/' + u.uid);
   const isOfflineForDatabase = { state: 'offline', last_changed: firebase.database.ServerValue.TIMESTAMP };
   const isOnlineForDatabase = { state: 'online', last_changed: firebase.database.ServerValue.TIMESTAMP };

   db.ref('.info/connected').on('value', snapshot => {
       if (snapshot.val() === false) return;
       userStatusDatabaseRef.onDisconnect().set(isOfflineForDatabase).then(() => {
           userStatusDatabaseRef.set(isOnlineForDatabase);
       });
   });

   loadAllPlayers('');
   listenForIncomingInvites();
  } catch(err) {
   console.error('Auth state load error:', err);
   loadAllPlayers('');
  }
 } else {
  window.location.href = 'index.html';
 }
});

async function loadAllPlayers(rawQuery) {
 const queryName = String(rawQuery || '').trim().toLowerCase();
 const resultsContainer = $('results');
 resultsContainer.innerHTML = 'ක්‍රීඩකයන් පූරණය වෙමින්...';

 try {
  // Fetch from users_v6 and publicProfiles_v6, fallback to users_v6 if publicProfiles is empty
  const [profilesSnap, usersSnap, statusSnap] = await Promise.all([
      db.ref('publicProfiles_v6').once('value'),
      db.ref('users_v6').once('value'),
      db.ref('status_v6').once('value')
  ]);

  let profiles = profilesSnap.val() || {};
  if(Object.keys(profiles).length === 0 && usersSnap.exists()) {
      profiles = usersSnap.val();
  }

  if (!profiles || Object.keys(profiles).length === 0) {
   resultsContainer.innerHTML = 'ක්‍රීඩකයන් හමු නොවීය.';
   return;
  }

  const statuses = statusSnap.val() || {};
  resultsContainer.innerHTML = '';
  let found = false;

  Object.keys(profiles).forEach(uid => {
   const pData = profiles[uid];
   const candidateName = pData && pData.name ? String(pData.name) : '';
   
   // Exclude current user from the list
   if(fbUser && uid === fbUser.uid) return;

   if(candidateName && (!queryName || candidateName.toLowerCase().includes(queryName))) {
    found = true;
    
    const userStatus = statuses[uid];
    const isOnline = userStatus && userStatus.state === 'online';

    const designIndex = Number(pData.pieceIndex) || 0;
    const design = PIECE_DESIGNS[designIndex] || PIECE_DESIGNS[0];
    const avatarIcon = pData.avatarIcon || 'fa-user';

    const card = document.createElement('div');
    card.className = 'friend-card';

    const infoDiv = document.createElement('div');
    infoDiv.className = 'friend-info';

    const avatarWrapper = document.createElement('div');
    avatarWrapper.className = 'avatar-wrapper';

    const avatarEl = document.createElement('div');
    avatarEl.className = 'friend-avatar';
    avatarEl.style.background = design.bg;
    avatarEl.style.borderColor = design.border;
    avatarEl.style.color = design.color;
    avatarEl.innerHTML = `<i class="fa-solid ${avatarIcon}"></i>`;

    const statusDot = document.createElement('div');
    statusDot.className = `status-dot ${isOnline ? 'online' : 'offline'}`;
    statusDot.title = isOnline ? 'Online' : 'Offline';

    avatarWrapper.append(avatarEl, statusDot);

    const textWrap = document.createElement('div');
    const playerName = document.createElement('b');
    playerName.textContent = candidateName;
    playerName.style.color = '#fff';
    playerName.style.fontSize = '1rem';

    const playerMeta = document.createElement('div');
    playerMeta.style.cssText = 'font-size:0.75rem;color:var(--dim);display:flex;align-items:center;gap:6px;';
    playerMeta.innerHTML = `<i class="fa-solid fa-coins" style="color:var(--gold)"></i> ${Number(pData.points) || 0} pts <span style="opacity:0.4">•</span> <span style="color:${isOnline ? 'var(--neon-green)' : 'var(--dim)'}">${isOnline ? 'Online' : 'Offline'}</span>`;

    textWrap.append(playerName, playerMeta);
    infoDiv.append(avatarWrapper, textWrap);
    card.appendChild(infoDiv);

    const inviteBtn = document.createElement('button');
    inviteBtn.className = 'btn-gold';
    inviteBtn.style.padding = '6px 14px';
    inviteBtn.style.fontSize = '0.85rem';
    inviteBtn.innerHTML = '<i class="fa-solid fa-gamepad"></i> Invite';
    inviteBtn.onclick = () => sendGameInvite(uid, candidateName);
    
    card.appendChild(inviteBtn);
    resultsContainer.appendChild(card);
   }
  });

  if(!found) {
   resultsContainer.innerHTML = queryName ? 'අදාළ නමින් ක්‍රීඩකයන් හමු නොවීය.' : 'වෙනත් ක්‍රීඩකයන් තවම ලියාපදිංචි වී නැත.';
  }
 } catch(err) {
  console.error('Load players error:', err);
  resultsContainer.innerHTML = 'දෝෂයක් සිදු විය. Firebase Rules පරීක්ෂා කරන්න.';
 }
}

async function sendGameInvite(friendUid, friendName) {
 if(currentBet > user.points) return toast('ඔබ සතුව ප්‍රමාණවත් Points නොමැත.');

 if(activeInviteWatcher) {
  activeInviteWatcher.ref.off('value', activeInviteWatcher.handler);
  activeInviteWatcher = null;
 }

 const newInviteRef = db.ref('invites_v6/' + friendUid).push();
 const inviteId = newInviteRef.key;
 const initialBoard = Array.from({length:8},()=>Array(8).fill(0));
 for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){if(r<3)initialBoard[r][c]=-1;else if(r>4)initialBoard[r][c]=1}
 
 const targetRoomRef = db.ref('rooms_v6/' + inviteId);

 try {
  await targetRoomRef.set({
   board: initialBoard,
   turn: 1,
   forcedContinuation: null,
   hostUid: fbUser.uid,
   guestUid: friendUid,
   hostName: user.name,
   guestName: friendName,
   hostPieceIndex: user.pieceIndex || 0,
   hostAvatar: user.avatarIcon || 'fa-user',
   guestPieceIndex: 0,
   guestAvatar: 'fa-user',
   bet: currentBet,
   status: 'waiting',
   updatedAt: firebase.database.ServerValue.TIMESTAMP
  });

  await newInviteRef.set({
   fromUid: fbUser.uid,
   hostName: user.name,
   bet: currentBet,
   status: 'pending',
   timestamp: Date.now()
  });

  $('waitingHostText').textContent = `${friendName} ආරාධනය පිළිගන්නා තෙක් රැඳී සිටින්න...`;
  modal('waitingHostModal', true);

  const handler = snap => {
   const roomData = snap.val();
   if(!roomData) return;

   if(roomData.status === 'playing') {
    targetRoomRef.off('value', handler);
    activeInviteWatcher = null;
    modal('waitingHostModal', false);
    window.location.href = `arena.html?mode=multi&roomId=${inviteId}&role=host&bet=${currentBet}&oppName=${encodeURIComponent(friendName)}`;
   } else if(roomData.status === 'rejected') {
    targetRoomRef.off('value', handler);
    activeInviteWatcher = null;
    modal('waitingHostModal', false);
    targetRoomRef.remove().catch(()=>{});
    toast(`${friendName} ආරාධනය ප්‍රතික්ෂේප කළා.`);
   }
  };

  targetRoomRef.on('value', handler);
  activeInviteWatcher = { ref: targetRoomRef, handler: handler, inviteRef: newInviteRef };

 } catch(err) {
  console.error('Invite error:', err);
  modal('waitingHostModal', false);
  toast('ආරාධනය යැවීමට නොහැකි විය.');
 }
}

$('cancelInviteBtn').onclick = () => {
 modal('waitingHostModal', false);
 if(activeInviteWatcher) {
  activeInviteWatcher.ref.off('value', activeInviteWatcher.handler);
  activeInviteWatcher.ref.remove().catch(()=>{});
  activeInviteWatcher.inviteRef.remove().catch(()=>{});
  activeInviteWatcher = null;
 }
 toast('ආරාධනය අවලංගු කරන ලදී.');
};

function listenForIncomingInvites() {
 if(!db || !fbUser) return;
 if(invitesListenerRef) invitesListenerRef.off();
 invitesListenerRef = db.ref('invites_v6/' + fbUser.uid);
 invitesListenerRef.on('child_added', snap => {
  const invite = snap.val();
  if(invite && invite.status === 'pending' && (Date.now() - Number(invite.timestamp || 0) < 300000)) {
   incomingInviteData = { id: snap.key, fromUid: invite.fromUid, ...invite };
   $('invitePopupText').textContent = `${invite.hostName} විසින් ඔට්ටුව ${invite.bet} ක් සමඟ ඔබට ආරාධනා කරයි!`;
   modal('invitePopupModal', true);
  }
 });
}

$('acceptInviteBtn').onclick = async () => {
 if(!incomingInviteData) return;
 const invite = incomingInviteData;
 const bet = Number(invite.bet) || 0;

 if(bet > user.points) {
  toast('මෙම ඔට්ටුව සඳහා ඔබ සතුව ප්‍රමාණවත් Points නොමැත.');
  return;
 }

 incomingInviteData = null;
 modal('invitePopupModal', false);

 try {
  const roomRefCheck = db.ref('rooms_v6/' + invite.id);
  const roomSnap = await roomRefCheck.once('value');
  const roomData = roomSnap.val() || {};

  await roomRefCheck.update({
   guestPieceIndex: user.pieceIndex || 0,
   guestAvatar: user.avatarIcon || 'fa-user',
   status: 'playing',
   updatedAt: firebase.database.ServerValue.TIMESTAMP
  });

  await db.ref('invites_v6/' + fbUser.uid + '/' + invite.id).remove().catch(()=>{});
  window.location.href = `arena.html?mode=multi&roomId=${invite.id}&role=guest&bet=${bet}&oppName=${encodeURIComponent(roomData.hostName || 'Host')}`;
 } catch(err) {
  console.error('Accept error:', err);
  toast('ආරාධනය පිළිගැනීමට නොහැකි විය.');
 }
};

$('rejectInviteBtn').onclick = () => {
 if(!incomingInviteData) return;
 const invite = incomingInviteData;
 incomingInviteData = null;
 modal('invitePopupModal', false);
 db.ref('rooms_v6/' + invite.id).update({ status: 'rejected' }).catch(()=>{});
 db.ref('invites_v6/' + fbUser.uid + '/' + invite.id).remove().catch(()=>{});
};
</script>
</body>
</html>
