<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shop & Reward - ශ්‍රී ලංකා දාම් Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b18;--panel:rgba(18,24,43,.96);--gold:#ffd166;--gold-glow:rgba(255,209,102,0.3);--dim:#a0aec0;--green:#2ecc71;--red:#ff6b81;--blue:#4facfe}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none}
html,body{width:100%;min-height:100%;background:radial-gradient(circle at 20% 20%,#1b264f30,transparent 40%),linear-gradient(145deg,#080b18,#111a31 55%,#0a1022);color:#f8f9fa;padding:15px}
.app{max-width:960px;margin:auto;display:grid;gap:20px}

/* Header */
header{background:var(--panel);border:1px solid #ffd16640;border-radius:18px;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 25px rgba(0,0,0,0.4)}
.brand{font-size:1.35rem;color:var(--gold);font-weight:800;display:flex;align-items:center;gap:10px}
.points-box{background:rgba(0,0,0,0.5);border:1px solid var(--gold);padding:7px 16px;border-radius:25px;font-weight:700;color:var(--gold);box-shadow:0 0 12px var(--gold-glow);display:flex;align-items:center;gap:6px}
.btn-back{background:rgba(255,255,255,0.08);color:white;border:1px solid rgba(255,255,255,0.2);border-radius:11px;padding:8px 16px;cursor:pointer;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.btn-back:hover{background:rgba(255,255,255,0.15);border-color:var(--gold)}

/* Category Tabs */
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px}
.tab{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--dim);padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.tab:hover{background:rgba(255,255,255,0.08);color:white}
.tab.active{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111;border-color:var(--gold);box-shadow:0 0 15px var(--gold-glow)}

/* Highlighted Free Reward Banner */
.highlight-reward{background:linear-gradient(135deg,rgba(255,209,102,0.15),rgba(46,204,113,0.15));border:2px solid var(--gold);border-radius:20px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,0.5);position:relative;overflow:hidden}
.highlight-reward::before{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:rgba(255,209,102,0.1);border-radius:50%;pointer-events:none}
.reward-left{display:flex;align-items:center;gap:18px}
.reward-icon-box{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#ffeaa7,#fdcb6e);color:#111;display:grid;place-items:center;font-size:2rem;box-shadow:0 0 20px rgba(255,209,102,0.5);animation:bounceReward 2s infinite ease-in-out}
@keyframes bounceReward{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.reward-title{color:var(--gold);font-size:1.3rem;font-weight:800;margin-bottom:4px}
.timer-count{font-size:1.05rem;font-weight:700;color:#50e8ae;font-variant-numeric:tabular-nums;margin-top:6px;display:flex;align-items:center;gap:6px}

/* Items Grid System */
.section-title{color:var(--gold);font-size:1.2rem;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.item-card{background:var(--panel);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transition:.2s;box-shadow:0 8px 20px rgba(0,0,0,0.3);position:relative}
.item-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 12px 25px rgba(0,0,0,0.5)}
.preview-circle{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#ffeaa7,#fdcb6e);display:grid;place-items:center;font-size:1.9rem;color:#111;position:relative;border:2px solid var(--gold)}

/* Visual Effects Styles */
.fx-glow{box-shadow:0 0 20px #ffd166, 0 0 40px #ffad62!important}
.fx-fire{box-shadow:0 0 20px #ff4757, 0 0 35px #ffa502!important;animation:pulseFire 1s infinite alternate}
.fx-rainbow{box-shadow:0 0 25px #ff6b81, 0 0 35px #7ee7ff!important;animation:spinRainbow 3s linear infinite}
.fx-lightning{box-shadow:0 0 22px #4facfe, 0 0 40px #00f2fe!important;animation:pulseLight .8s infinite alternate}
.fx-matrix{box-shadow:0 0 22px #2ed573, 0 0 35px #26de81!important}

@keyframes pulseFire{0%{filter:brightness(1)}100%{filter:brightness(1.4)}}
@keyframes pulseLight{0%{opacity:0.7}100%{opacity:1}}

.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111;border:0;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer;width:100%;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-gold:hover{filter:brightness(1.1)}
.btn-gold:disabled{background:#2ecc71;color:#fff;opacity:0.8;cursor:not-allowed;box-shadow:none}

/* Toast Notification */
#toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,120px);opacity:0;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--gold);color:#f8f9fa;border-radius:30px;padding:12px 24px;z-index:150;box-shadow:0 8px 25px rgba(0,0,0,0.6);transition:.3s cubic-bezier(0.175,0.885,0.32,1.275);font-weight:600;display:flex;align-items:center;gap:10px}
#toast.show{transform:translate(-50%,0);opacity:1}

@media(max-width:600px){.highlight-reward{flex-direction:column;text-align:center}.reward-left{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<div class="app">
<!-- Header -->
<header>
<div class="brand"><i class="fa-solid fa-store"></i> Shop & Reward</div>
<div class="points-box">🪙 <span id="userPoints">500</span> pts</div>
<a href="index.html" class="btn-back"><i class="fa-solid fa-house"></i> ප්‍රධාන පිටුව</a>
</header>

<!-- Category Tabs -->
<div class="tabs">
<div class="tab active" onclick="switchCategory('all', this)"><i class="fa-solid fa-border-all"></i> සියල්ල (All)</div>
<div class="tab" onclick="switchCategory('rewards', this)"><i class="fa-solid fa-gift"></i> Free Rewards</div>
<div class="tab" onclick="switchCategory('effects', this)"><i class="fa-solid fa-wand-magic-sparkles"></i> Visual Effects</div>
</div>

<!-- Category: Free Rewards (Highlighted) -->
<div id="rewardsSection" class="category-block">
<div class="highlight-reward">
<div class="reward-left">
<div class="reward-icon-box"><i class="fa-solid fa-gem"></i></div>
<div>
<div class="reward-title">පැය 6ක නොමිලේ ත්‍යාගය (Free 200 Points)</div>
<p style="color:var(--dim);font-size:0.95rem">සැම පැය 6කට වරක් කිසිදු ගෙවීමකින් තොරව ලකුණු 200ක් ලබා ගන්න!</p>
<div id="timerDisplay" class="timer-count"><i class="fa-solid fa-clock"></i> සූදානම් වෙමින්...</div>
</div>
</div>
<button class="btn-gold" id="claimRewardBtn" onclick="claimFreeReward()" style="width:auto;padding:12px 24px"><i class="fa-solid fa-circle-check"></i> ලබාගන්න (Claim)</button>
</div>
</div>

<!-- Category: Visual Effects Grid -->
<div id="effectsSection" class="category-block" style="display:grid;gap:15px">
<div class="section-title"><i class="fa-solid fa-star"></i> දාම් ඉත්තන් සඳහා විශේෂ Effects (250 pts)</div>
<div class="grid" id="shopGrid"></div>
</div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBnGTuZKekAWA4vBUgfzZZ2CeO8wyR1HaI",authDomain:"bin-card-42614.firebaseapp.com",databaseURL:"https://bin-card-42614-default-rtdb.firebaseio.com",projectId:"bin-card-42614",storageBucket:"bin-card-42614.firebasestorage.app",messagingSenderId:"1063550230753",appId:"1:1063550230753:web:1ad8306405e709ac5b17a0"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const KEY = 'sinhala_draughts_v7_user';
let user = JSON.parse(localStorage.getItem(KEY) || '{"points":500, "unlockedEffects":[], "lastRewardTime":0}');
if(!user.unlockedEffects) user.unlockedEffects = [];

const EFFECTS = [
 {id: 'glow', name: 'රන් කැටයම් (Golden Glow)', desc: 'ඉත්තා වටා දිලිසෙන රන්වන් ආලෝකයකි.', class: 'fx-glow', icon: '★'},
 {id: 'fire', name: 'ගිනි දැල් (Fire Aura)', desc: 'උණුසුම් ගිනි පුපුරු විහිදුවන ආචරණයකි.', class: 'fx-fire', icon: '🔥'},
 {id: 'rainbow', name: 'දේදුනු විදුලිය (Rainbow Flow)', desc: 'වර්ණ මාලාවකින් දිස්වන ආකර්ෂණීය පෙනුමකි.', class: 'fx-rainbow', icon: '⚡'},
 {id: 'lightning', name: 'විදුලි කුණාටුව (Lightning Shield)', desc: 'නිල් පැහැති විදුලි රැස් විහිදුවයි.', class: 'fx-lightning', icon: '🛡'},
 {id: 'matrix', name: 'මරකත මැජික් (Matrix Green)', desc: 'ශක්තිමත් කොළ පැහැති මැජික් ආලෝකයකි.', class: 'fx-matrix', icon: '❖'}
];

function toast(s, icon='fa-circle-info'){
 const t = document.getElementById('toast');
 t.innerHTML = `<i class="fa-solid ${icon}" style="color:var(--gold)"></i> <span>${s}</span>`;
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'), 2800);
}

function updatePointsUI(){
 document.getElementById('userPoints').textContent = user.points !== undefined ? user.points : 500;
}

function syncUserWithDB(){
 localStorage.setItem(KEY, JSON.stringify(user));
 const currentUser = auth.currentUser;
 if(currentUser){
  db.ref('users_v6/' + currentUser.uid).update({
   points: user.points,
   unlockedEffects: user.unlockedEffects || [],
   selectedEffect: user.selectedEffect || '',
   lastRewardTime: user.lastRewardTime || 0
  }).catch(console.error);
 }
 updatePointsUI();
}

auth.onAuthStateChanged(async u => {
 if(u){
  try{
   const snap = await db.ref('users_v6/' + u.uid).once('value');
   const d = snap.val();
   if(d){
    user.points = d.points !== undefined ? Number(d.points) : user.points;
    user.unlockedEffects = Array.isArray(d.unlockedEffects) ? d.unlockedEffects : (user.unlockedEffects || []);
    user.selectedEffect = d.selectedEffect || user.selectedEffect || '';
    user.lastRewardTime = d.lastRewardTime !== undefined ? Number(d.lastRewardTime) : (user.lastRewardTime || 0);
    user.uid = u.uid;
    localStorage.setItem(KEY, JSON.stringify(user));
   }
  }catch(e){}
 }
 updatePointsUI();
 renderShop();
 startRewardTimer();
});

// Category Switcher
function switchCategory(cat, el){
 document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
 el.classList.add('active');

 const rewardsSec = document.getElementById('rewardsSection');
 const effectsSec = document.getElementById('effectsSection');

 if(cat === 'all'){
  rewardsSec.style.display = 'block';
  effectsSec.style.display = 'grid';
 } else if(cat === 'rewards'){
  rewardsSec.style.display = 'block';
  effectsSec.style.display = 'none';
 } else if(cat === 'effects'){
  rewardsSec.style.display = 'none';
  effectsSec.style.display = 'grid';
 }
}

// Countdown Timer (6 Hours = 21600000 ms)
const COOLDOWN_TIME = 6 * 60 * 60 * 1000;

function startRewardTimer(){
 const btn = document.getElementById('claimRewardBtn');
 const timerText = document.getElementById('timerDisplay');

 setInterval(() => {
  const now = Date.now();
  const lastTime = user.lastRewardTime || 0;
  const elapsed = now - lastTime;

  if(elapsed < COOLDOWN_TIME){
   const remaining = COOLDOWN_TIME - elapsed;
   const hours = Math.floor(remaining / (1000 * 60 * 60));
   const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
   const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

   timerText.innerHTML = `<i class="fa-solid fa-clock"></i> නැවත ලබාගීමට: ${hours}h ${minutes}m ${seconds}s`;
   btn.disabled = true;
  } else {
   timerText.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#2ecc71"></i> ත්‍යාගය ලබා ගැනීමට සූදානම්!`;
   btn.disabled = false;
  }
 }, 1000);
}

function claimFreeReward(){
 const now = Date.now();
 const lastTime = user.lastRewardTime || 0;
 
 if((now - lastTime) < COOLDOWN_TIME){
  return toast('කරුණාකර නියමිත කාලය අවසන් වන තෙක් රැඳී සිටින්න!', 'fa-triangle-exclamation');
 }

 user.points += 200;
 user.lastRewardTime = now;
 syncUserWithDB();
 toast('සුභ පැතුම්! ඔබට Free Points 200ක් ලැබුණි! 🎉', 'fa-circle-check');
}

function renderShop(){
 const grid = document.getElementById('shopGrid');
 grid.innerHTML = '';
 
 EFFECTS.forEach(fx => {
  const isUnlocked = user.unlockedEffects && user.unlockedEffects.includes(fx.id);
  const card = document.createElement('div');
  card.className = 'item-card';
  card.innerHTML = `
   <div class="preview-circle ${fx.class}">${fx.icon}</div>
   <b style="color:var(--gold);font-size:1.1rem">${fx.name}</b>
   <p style="font-size:0.85rem;color:var(--dim)">${fx.desc}</p>
   <button class="btn-gold" ${isUnlocked ? 'disabled' : ''} onclick="buyEffect('${fx.id}')">
    ${isUnlocked ? '<i class="fa-solid fa-check"></i> මිලදී ගෙන ඇත' : '<i class="fa-solid fa-cart-shopping"></i> මිලදී ගන්න (250 pts)'}
   </button>
  `;
  grid.appendChild(card);
 });
}

function buyEffect(id){
 if(user.points < 250){
  return toast('ඔබ සතුව ප්‍රමාණවත් Points නැත (අවශ්‍යයි: 250 pts)!', 'fa-triangle-exclamation');
 }
 user.points -= 250;
 if(!user.unlockedEffects) user.unlockedEffects = [];
 user.unlockedEffects.push(id);
 
 syncUserWithDB();
 renderShop();
 toast('සාර්ථකව මිලදී ගන්නා ලදී! 🎉 (Profile වෙතින් Select කරගන්න)', 'fa-circle-check');
}

updatePointsUI();
renderShop();
startRewardTimer();
</script>
</body>
</html>
