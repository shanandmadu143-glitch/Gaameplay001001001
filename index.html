<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<div id="newUpdateNotifModal" style="position:fixed;inset:0;background:rgba(3,5,12,0.85);backdrop-filter:blur(8px);display:none;place-items:center;z-index:250;padding:16px">
 <div style="width:min(100%,380px);background:linear-gradient(145deg,#121828,#1b243f);border:2px solid #ffd166;border-radius:22px;padding:22px;display:grid;gap:14px;text-align:center;color:#fff">
  <h3 style="color:#ffd166"><i class="fa-brands fa-android"></i> New Update</h3>
  <p id="notifApkVersion" style="font-weight:800;color:#00f2fe"></p>
  <p id="notifApkNotes" style="font-size:0.9rem;color:#cbd5e1"></p>
  <div style="display:flex;gap:10px">
   <button type="button" id="notifInstallBtn" style="flex:1;border:0;border-radius:12px;padding:11px;font-weight:800;background:linear-gradient(135deg,#ffe08a,#ff9f1c);color:#111;cursor:pointer">
    <i class="fa-solid fa-download"></i> Install
   </button>
   <button type="button" id="notifCloseBtn" style="border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:11px 14px;background:rgba(255,255,255,0.08);color:#fff;cursor:pointer">
    Later
   </button>
  </div>
 </div>
</div>

<script>
(function(){
 if(!window.firebase || !firebase.database) return;
 const modal = document.getElementById('newUpdateNotifModal');
 const installBtn = document.getElementById('notifInstallBtn');
 const closeBtn = document.getElementById('notifCloseBtn');
 let currentApk = null;

 firebase.database().ref('adminConfig_v6/apkUpdate').on('value', snap => {
  const upd = snap.val();
  if(!upd || !upd.version || !upd.downloadUrl) return;
  if(sessionStorage.getItem('dismissed_apk_' + upd.version) === '1') return;
  currentApk = upd;
  document.getElementById('notifApkVersion').textContent = `Version v${upd.version} (${upd.fileName || 'game.apk'})`;
  document.getElementById('notifApkNotes').textContent = upd.notes || 'New Update available! Tap Install.';
  modal.style.display = 'grid';
 });

 closeBtn.onclick = () => {
  if(currentApk?.version) sessionStorage.setItem('dismissed_apk_' + currentApk.version, '1');
  modal.style.display = 'none';
 };

 installBtn.onclick = () => {
  if(!currentApk?.downloadUrl) return;
  const link = document.createElement('a');
  link.href = currentApk.downloadUrl;
  link.download = currentApk.fileName || 'SinhalaDraughts.apk';
  link.target = '_blank';
  link.rel = 'noopener';
  document.body.appendChild(link);
  link.click();
  link.remove();
 };
})();
</script>
