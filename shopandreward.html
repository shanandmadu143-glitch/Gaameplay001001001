<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shop & Reward - ශ්‍රී ලංකා දාම්</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b18;--panel:rgba(18,24,43,.96);--gold:#ffd166;--dim:#a0aec0}*{box-sizing:border-box;margin:0;padding:0;font-family:'Gemunu Libre','Poppins',sans-serif;user-select:none}html,body{width:100%;min-height:100%;background:radial-gradient(circle at 18% 18%,#3b2e2530,transparent 35%),linear-gradient(145deg,#080b18,#111a31 55%,#0a1022);color:#f8f9fa;display:grid;place-items:center;min-height:100dvh}
.container{width:min(90%,480px);background:var(--panel);border:2px solid var(--gold);border-radius:20px;padding:30px;text-align:center;display:grid;gap:20px;box-shadow:0 15px 35px rgba(0,0,0,0.6)}
.icon-box{font-size:3.5rem;color:var(--gold);animation:bounce 1.5s infinite ease-in-out}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h2{color:var(--gold);font-size:1.8rem;font-weight:700}
p{color:var(--dim);font-size:1rem;line-height:1.5}
.notice-badge{background:rgba(255,209,102,0.1);border:1px dashed var(--gold);padding:15px;border-radius:12px;color:var(--gold);font-weight:600;font-size:1.1rem}
.btn-gold{background:linear-gradient(135deg,#ffe08a,#ffad62);color:#111;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn-gold:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="container">
<div class="icon-box"><i class="fa-solid fa-store"></i></div>
<h2>Shop & Reward</h2>
<p>අපගේ වෙළඳසැල සහ ත්‍යාග පද්ධතිය (Rewards System) ඔබ වෙත ඉතා ඉක්මනින් ගෙන ඒමට කටයුතු කරමින් පවතී.</p>
<div class="notice-badge"><i class="fa-solid fa-clock"></i> ලගදිම බලාපොරොත්තු වන්න!</div>
<a href="index.html" class="btn-gold"><i class="fa-solid fa-arrow-left"></i> ප්‍රධාන පිටුවට යන්න</a>
</div>
</body>
</html>
